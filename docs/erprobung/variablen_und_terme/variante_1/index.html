<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welche Terme passen zu dieser Figur?</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">

<!-- ============================ Gestaltung ============================ -->
<style>
/* Die Farben und Schriften sind dieselben wie auf den Projektseiten.
   Wer sie dort ändert, ändert sie hier mit - deshalb stehen sie
   vollständig in diesem einen Block und nirgendwo sonst. Auch das
   JavaScript weiter unten liest von hier (siehe die Funktion `farbe`);
   fest verdrahtete Farbwerte gibt es in dieser Datei keine mehr.

   #6f9dc4 setzt die Themenfarbe: Ähnlichkeit lila, Faktorisieren rot,
   und so weiter wie auf der Klassenseite. Die Fläche trägt damit die
   Farbe der Tür, durch die man gekommen ist. */
:root{
  --w:170px; --h:143px;

  /* Zwei Werte weichen bewusst von den Projektseiten ab: Der Grund ist
     eine Spur tiefer und die Fläche eine Spur heller, damit sich Tisch,
     Fächer und Knöpfe deutlicher abheben. Auf einer Textseite braucht es
     das nicht - hier liegt Arbeitsfläche auf Hintergrund, und die Kante
     dazwischen muss man sehen. Der Unterschied wächst damit von 4 % auf
     9 %; das ist der «Tick», nicht mehr. Projektwerte: #fbf8f3 / #fffdf9. */
  --papier:#f8f4ec; --creme:#f6ecdf; --karte:#fffefb;
  --tinte:#2d2924;  --tinte-hell:#6c6357;
  --braun:#935100;  --braun-hell:#b07c3c;
  --linie:#e4d9c7;  --fliess:#463f36;
  --akzent:#6f9dc4;

  --druck:'Fira Sans','Segoe UI',sans-serif;
  --sans:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --hand:'Patrick Hand',"Bradley Hand","Segoe Print",cursive;

  /* Für das JavaScript. Nur lesen, nicht anwenden. */
  --feld-rand:#c9bda6;
  --feld-fest:#935100;
  --feld-fuell:rgba(147,81,0,.045);
  --richtig:#4f7a3a;
  --falsch:#b4474f;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--papier);color:var(--tinte);overflow:hidden;
     font-family:var(--druck);font-size:17px;}

/* ---- Kopf: wie .kopfklein auf den Projektseiten ------------------- */
header{padding:16px 22px 6px;}
/* Patrick Hand gibt es nur in einem Schnitt. Überall, wo sie steht,
   muss font-weight:400 stehen - sonst rechnet der Browser einen fetten
   Schnitt aus, und der sieht aus wie mit dem Filzstift nachgezogen.
   Dafür darf sie einen Tick grösser sein: die Versalhöhe liegt tiefer
   als bei Fira Sans, sonst wirkt sie daneben zu klein. */
h1{font-family:var(--hand);font-weight:400;font-size:1.75rem;line-height:1.2;
   margin:0 0 5px;color:var(--tinte);}
p.auftrag{font-size:.95rem;color:var(--fliess);margin:0;max-width:95ch;
          line-height:1.5;}

/* ---- Leiste ------------------------------------------------------- */
.leiste{display:flex;flex-wrap:wrap;gap:7px;align-items:center;
        padding:12px 22px 13px;}
/* Auch die Knöpfe. Damit sie trotzdem als Knöpfe zu erkennen sind,
   bleiben Rahmen und Fläche kräftig - die Schrift allein trägt bei einer
   Handschrift die Bedienbarkeit nicht. Und sie braucht mehr Grösse als
   Source Sans, sonst wird sie dünn. */
button{font-family:var(--hand);font-size:1.08rem;font-weight:400;
       padding:5px 14px 6px;border:1px solid var(--linie);border-radius:0;
       background:var(--karte);color:var(--tinte);cursor:pointer;
       line-height:1.3;
       transition:background .2s ease,border-color .2s ease;}
button:hover{background:var(--creme);border-color:var(--braun-hell);}
button:focus-visible{outline:2px solid var(--braun);outline-offset:2px;}
button.an{background:var(--braun);color:#fff;border-color:var(--braun);}
.trenner{width:1px;height:20px;background:var(--linie);margin:0 4px;}
#meldung{font-family:var(--hand);font-size:1.04rem;color:var(--braun);
         margin-left:8px;}

/* ---- Bühne -------------------------------------------------------- */
#buehne{display:flex;gap:16px;padding:0 22px 20px;height:calc(100% - 136px);}
.saeule{display:flex;flex-direction:column;gap:16px;
        width:calc(var(--w) + 42px);flex:0 0 auto;}
.fach{background:var(--karte);border:1px solid var(--linie);
      border-top:4px solid var(--akzent);border-radius:0;
      display:flex;flex-direction:column;min-height:0;flex:1 1 0;}
.fach h2{font-family:var(--hand);font-weight:400;font-size:1.12rem;
         letter-spacing:0;text-transform:none;color:var(--tinte-hell);
         margin:0;padding:10px 13px 6px;}
.stapel{overflow-y:auto;overflow-x:hidden;padding:0 13px 13px;
        display:flex;flex-direction:column;gap:8px;align-items:center;}
#tisch{flex:1 1 auto;background:var(--karte);border:1px solid var(--linie);
       border-top:4px solid var(--akzent);border-radius:0;
       position:relative;overflow:auto;}
#brett{position:absolute;left:0;top:0;pointer-events:none;}
#teiler{position:absolute;top:0;bottom:0;
        border-left:1.5px dashed var(--linie);pointer-events:none;}
.haelfte{position:absolute;top:8px;font-family:var(--hand);font-weight:400;
  font-size:1.1rem;color:var(--tinte-hell);letter-spacing:0;
  text-transform:none;pointer-events:none;}

/* Die Felder sind Struktur der Aufgabe, nicht Schmuck: durchgezogen,
   wenn sie von Anfang an dazugehören, gestrichelt, wenn die Lehrperson
   sie zugeschaltet hat. Die Klasse `fest` setzt das JavaScript. */
.rasterfeld{position:absolute;border:1.5px dashed var(--feld-rand);
  border-radius:0;background:transparent;pointer-events:none;
  display:flex;align-items:flex-start;justify-content:center;}
.rasterfeld.fest{border-style:solid;border-color:var(--akzent);
  background:var(--feld-fuell);}
.rasterfeld span{font-family:var(--hand);font-size:1.02rem;
  color:var(--tinte-hell);margin-top:5px;}

/* Frei beschriftbares Feld: Die Gruppe schreibt selbst hin, wonach sie
   geordnet hat. Das Feld selbst laesst Klicks durch (die Karten liegen
   darunter), die Schreiblinie nimmt sie an. */
.rasterfeld input.titel{font-family:var(--hand);font-size:1.02rem;
  color:var(--tinte);margin-top:5px;width:calc(100% - 18px);
  border:none;border-bottom:1.5px solid var(--feld-rand);
  background:transparent;text-align:center;padding:1px 0 2px;
  pointer-events:auto;}
.rasterfeld input.titel::placeholder{color:var(--tinte-hell);opacity:.75;}
.rasterfeld input.titel:focus{outline:none;border-bottom-color:var(--akzent);}

/* Das Feld, das ein weiteres Feld anlegt. Es steht dort, wo das nächste
   Feld entstehen wird - ein Knopf in der Leiste sagt nicht, was er tut. */
.rasterfeld.neu{border-style:dashed;border-color:var(--feld-rand);
  opacity:.55;align-items:center;cursor:pointer;pointer-events:auto;
  transition:opacity .12s;}
.rasterfeld.neu:hover{opacity:1;border-color:var(--akzent);}
.rasterfeld.neu span{font-family:var(--hand);font-size:1.02rem;
  color:var(--tinte-hell);margin-top:0;text-align:center;padding:0 6px;}
.rasterfeld.neu:hover span{color:var(--akzent);}

/* Das Schreibfeld auf dem direkten Pfeil der Kette. Es sieht aus wie die
   Faktorfelder daneben, nur wird hineingeschrieben statt hineingelegt. */
.direktfeld{font-family:var(--hand);font-size:1.16rem;color:var(--tinte);
  border:1.5px dashed var(--akzent);border-radius:9px;background:var(--karte);
  text-align:center;padding:0 6px;}
.direktfeld::placeholder{color:var(--akzent);opacity:.55;font-size:.86em;}
.direktfeld:focus{outline:none;border-style:solid;}

/* ---- Karten ------------------------------------------------------- */
.karte{width:var(--w);height:var(--h);border-radius:0;background:transparent;
       filter:drop-shadow(0 1px 2px rgba(90,70,35,.22));
       cursor:grab;touch-action:none;user-select:none;flex:0 0 auto;}
#tisch .karte{position:absolute;left:0;top:0;}
.karte img{width:100%;height:100%;display:block;pointer-events:none;
           -webkit-user-drag:none;}
.karte.aktiv{cursor:grabbing;will-change:transform;
             filter:drop-shadow(0 12px 26px rgba(90,70,35,.30));}
.karte.ablage{width:calc(var(--w) * var(--abl));
              height:calc(var(--h) * var(--abl));}
.karte.rastet{filter:drop-shadow(0 0 0 var(--akzent))
              drop-shadow(0 1px 3px rgba(90,70,35,.24));}
.karte.falsch{outline:3px solid var(--falsch);outline-offset:2px;}
.karte.richtig{outline:3px solid var(--richtig);outline-offset:2px;}
.karte:focus-visible{outline:2px solid var(--braun);outline-offset:3px;}

@media print{
  body{overflow:visible;background:#fff;}
  .leiste,.fach h2{display:none;}
  #buehne{display:block;height:auto;}
  .fach,#tisch{border:none;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>

<script>
/* Farben kommen aus dem Stylesheet, damit sie an einer Stelle stehen.
   Vorher standen fuenfzehn Farbwerte hier im Skript verstreut - beim
   Umstellen auf die Projektfarben waere jeder einzelne zu finden
   gewesen. */
const farbe = n => getComputedStyle(document.documentElement)
                     .getPropertyValue(n).trim();
const F = {
  akzent:   () => farbe('--akzent'),
  braun:    () => farbe('--braun'),
  linie:    () => farbe('--linie'),
  matt:     () => farbe('--tinte-hell'),
  rand:     () => farbe('--feld-rand'),
  fest:     () => farbe('--feld-fest'),
  fuell:    () => farbe('--feld-fuell'),
  richtig:  () => farbe('--richtig'),
  falsch:   () => farbe('--falsch'),
  karte:    () => farbe('--karte'),
};

const tisch  = document.getElementById('tisch');
const faecher = [document.getElementById('vorratBild'),
                 document.getElementById('vorratTerm')];
const meldung = document.getElementById('meldung');
const karten = [...document.querySelectorAll('.karte')];
let z = 1, breite = 170, pruefstufe = 0, rundeNr = 1;
const brett = document.getElementById('brett');
const KOPF = 30;                 // Freiraum fuer die Ueberschrift
const SORTIERT = true;   // links nach Kartensorte getrennt
const FLAECHE = 'tisch';                 // 'vorrat', 'tisch' oder 'runden'
const GEDREHT = false;                   // Karten leicht schief hinlegen?
const BRETT = null;
const RASTER = {"an": true, "anzahl": 6, "breite": 2.3, "hoehe": 2.45, "beschriftung": "eine Figur", "extra": {"beschriftung": "passt zu keiner Figur", "volle_breite": true, "hoehe": 1.4}};                     // null oder Vorstrukturierung
const HAELFTEN = {"links": "noch nicht zugeordnet", "rechts": "Figuren mit ihren Termen", "teiler": 0.42};                 // null oder zwei Tischhaelften
const RUNDEN = null;
const BUENDEL = null;
const ABL = 0.62;
document.documentElement.style.setProperty('--abl', ABL);
const RTEXT = {"einheit": "Baustein", "mehrzahl": "Bausteine", "hoechstens": 3};                  // Beschriftung der Rundensteuerung
const DREHUNG = 0;                   // 0 = alle Karten gerade                       // null oder {breite,hoehe,felder,feldbreite}

karten.forEach(k => { k._heim = k.parentElement; k._x = 0; k._y = 0;
                      k._lupe = 1; });

function masse(){
  document.documentElement.style.setProperty('--w', breite + 'px');
  document.documentElement.style.setProperty('--h', Math.round(breite * 0.844) + 'px');
  if (BRETT){
    const bw = breite * BRETT.breite, bh = breite * 0.844 * BRETT.hoehe;
    brett.style.width = bw + 'px'; brett.style.height = bh + 'px';
    brett.style.left = (FLAECHE === 'runden'
        ? Math.max(0, tisch.clientWidth - bw - 14)
        : Math.max(0, (tisch.clientWidth - bw) / 2)) + 'px';
    brett.style.top = '10px';
    felderZeichnen();
    if (BRETT.felder.length)
      karten.filter(k => k.dataset.rolle === 'ablage' && k._feld !== undefined)
            .forEach(k => setzen(k, ...feldpunkt(k._feld)));
  }
}

function feldpunkt(i){
  const bw = brett.offsetWidth, bh = brett.offsetHeight;
  const bx = parseFloat(brett.style.left) || 0, by = parseFloat(brett.style.top) || 0;
  const f = BRETT.felder[i];
  return [bx + f[0] * bw, by + f[1] * bh];
}

/* Mit der Maus: Ueberfahren zeigt die Karte gross. Auf Touchgeraeten
   nicht, dort gibt es kein Ueberfahren und es waere nur im Weg. */
let angetippt = null;          // Karte, die zum Lesen gross stehenbleibt

function tippLoesen(){
  if (angetippt){ lupe(angetippt, false); angetippt = null; }
}

function lupeAnhaengen(k){
  // Mit der Maus: Ueberfahren zeigt gross, Wegfahren wieder klein.
  if (matchMedia('(hover: hover)').matches){
    k.addEventListener('pointerenter', e => {
      if (e.pointerType === 'mouse' && !k.classList.contains('aktiv')
          && angetippt !== k){
        k._z = k.style.zIndex; lupe(k, true);
      }
    });
    k.addEventListener('pointerleave', () => {
      if (!k.classList.contains('aktiv') && angetippt !== k) lupe(k, false);
    });
  }

  // Mit dem Finger gibt es kein Ueberfahren. Dort bleibt die Karte nach
  // einem kurzen Tippen gross stehen, bis woanders hingetippt wird.
  k.addEventListener('pointerdown', e => {
    k._tippX = e.clientX; k._tippY = e.clientY;
  });
  k.addEventListener('pointerup', e => {
    if (e.pointerType === 'mouse') return;
    const weit = Math.abs(e.clientX - (k._tippX || 0)) > 5 ||
                 Math.abs(e.clientY - (k._tippY || 0)) > 5;
    if (weit) return;                       // war ein Ziehen, kein Tippen
    if (angetippt === k){ tippLoesen(); return; }
    tippLoesen();
    k._z = k.style.zIndex;
    angetippt = k;
    lupe(k, true);
  });
}

// Tippen neben die Karten loest die Vergroesserung wieder.
tisch.addEventListener('pointerdown', e => {
  if (!e.target.closest('.karte')) tippLoesen();
});

function einrasten(k){
  if (FLAECHE === 'buendel') return buendelEinrasten(k);
  if (FLAECHE === 'kette') return kettenEinrasten(k);
  if (!BRETT || !BRETT.felder.length || k.dataset.rolle !== 'ablage') return false;
  const w = breite * ABL, h = breite * 0.844 * ABL;
  const mx = k._x + w / 2, my = k._y + h / 2;
  const n = (FLAECHE === 'runden') ? aktiveFelder : BRETT.felder.length;
  for (let i = 0; i < n; i++){
    const [fx, fy] = feldpunkt(i);
    if (Math.abs(mx - (fx + w / 2)) < w * 0.9 &&
        Math.abs(my - (fy + h / 2)) < h * 1.1){
      const belegt = karten.find(a => a !== k && a._feld === i);
      if (belegt){ belegt._feld = undefined; belegt.classList.remove('rastet'); }
      k._feld = i; k.classList.add('rastet'); k._rot = 0;
      setzen(k, fx, fy);
      return true;
    }
  }
  k._feld = undefined; k.classList.remove('rastet');
  return false;
}
function zoom(d){
  breite = Math.max(50, Math.min(320, breite + d));
  masse();
  // Die Rasterfelder sind Vielfache der Kartenbreite - sie muessen
  // mitwachsen, sonst passen die Karten irgendwann nicht mehr hinein.
  haelftenZeichnen();
  rasterZeichnen(rasterKnopf && rasterKnopf.classList.contains('an'));
  rasterBeschriften();
}

function anteilBrett(){
  // Ein breites, niedriges Brett (drei Spalten über die ganze Fläche) darf
  // fast die volle Breite nehmen - die Karten liegen dann darunter, nicht
  // daneben. Sagt das Brett nichts, bleibt es bei den bisherigen Werten.
  if (BRETT && BRETT.anteil) return BRETT.anteil;
  return FLAECHE === 'runden' ? 0.34 : 0.52;
}

function einpassen(){
  const anz0 = karten.filter(k => k.dataset.rolle !== 'ablage').length || 1;
  if (FLAECHE === 'buendel'){
    const n = BUENDEL.plaetze;
    const nachReihe = (tisch.clientWidth - 60) / (n + 1.6);
    const nachHoehe = (tisch.clientHeight / BUENDEL.reihen - 12) / 0.844;
    breite = Math.max(46, Math.min(150,
               Math.floor(Math.min(nachReihe, nachHoehe))));
    masse(); return;
  }
  if (FLAECHE === 'kette'){
    // Oben muss das Trapez passen: fuenf Kartenbreiten quer, gut drei
    // Kartenhoehen hoch. Darunter bleiben die Vorraete.
    const nachReihe = (tisch.clientWidth - 80) / 7.0;
    const nachHoehe = (tisch.clientHeight * 0.58) / (3.6 * 0.844);
    const frei = tisch.clientWidth * (tisch.clientHeight * 0.38);
    const nachZahl = Math.sqrt(frei * 0.42 / (anz0 * 0.844));
    breite = Math.max(46, Math.min(150,
               Math.floor(Math.min(nachReihe, nachHoehe, nachZahl))));
    masse(); return;
  }
  if (!BRETT){
    // Ohne Brett zaehlt nur, dass die Karten nebeneinander Platz finden.
    const anteil = HAELFTEN ? HAELFTEN.teiler : 1;
    const frei0 = tisch.clientWidth * anteil * tisch.clientHeight;
    breite = Math.max(46, Math.min(200,
               Math.floor(Math.sqrt(frei0 * (SORTIERT ? 0.78 : 0.55)
                                    / (anz0 * 0.844)))));
    masse(); return;
  }
  const nachBreite = (tisch.clientWidth * anteilBrett()) / BRETT.breite;
  // Liegen die Karten unter dem Brett, bekommt das Brett nur einen Teil der
  // Hoehe und der Rest gehoert den Karten. Sonst nimmt das Brett die Hoehe
  // und die Karten den Platz daneben.
  const hAnteil = BRETT.unten ? (BRETT.hoehenanteil || 0.56) : 1.0;
  const nachHoehe  = ((tisch.clientHeight - 20) * hAnteil) / (BRETT.hoehe * 0.844);
  // Dritte Schranke: die Karten muessen neben oder unter dem Brett Platz
  // finden, sonst wird das Auslegen zum Stapel.
  const anz = karten.filter(k => k.dataset.rolle !== 'ablage').length || 1;
  const frei = BRETT.unten
      ? tisch.clientWidth * tisch.clientHeight * (1 - hAnteil)
      : tisch.clientWidth * (1 - anteilBrett()) * tisch.clientHeight;
  const nachZahl = Math.sqrt(frei * 0.50 / (anz * 0.844));
  breite = Math.max(46, Math.min(200,
             Math.floor(Math.min(nachBreite, nachHoehe, nachZahl))));
  masse();
}

function setzen(k, x, y){
  k._x = Math.max(0, x); k._y = Math.max(0, y);
  const w = (k._rot || 0);
  // Die Lupe vergroessert nur die Darstellung. Die gespeicherte Lage
  // (_x/_y) bleibt unveraendert, damit Ablage und Protokoll stimmen.
  const l = k._lupe || 1;
  k.style.transform = 'translate3d(' + k._x + 'px,' + k._y + 'px,0)' +
                      (w ? ' rotate(' + w + 'deg)' : '') +
                      (l !== 1 ? ' scale(' + l + ')' : '');
}

/* Karte zum Lesen kurz vergroessern. Damit muss nicht die ganze Flaeche
   aufgezoomt werden, nur um eine einzelne Karte zu entziffern. */
const LUPE = 1.45;
function lupe(k, an){
  k._lupe = an ? LUPE : 1;
  k.style.zIndex = an ? 9999 : (k._z || k.style.zIndex);
  setzen(k, k._x, k._y);
}

function aufTisch(k, x, y){
  if (k.parentElement !== tisch) tisch.appendChild(k);
  setzen(k, x, y);
}

function streuen(liste, streifen, h){
  // Versetztes Raster: durcheinander, aber jede Karte bleibt lesbar und im Bild.
  const platz = streifen.reduce((a, s) => a + Math.max(0, s[1] - s[0]), 0);
  const spaltenBreite = breite * 0.66;                 // etwas Ueberlappung
  const spalten = Math.max(1, Math.floor(platz / spaltenBreite));
  const zeilen = Math.max(1, Math.ceil(liste.length / spalten));
  const hoehe = Math.max(h * 0.42,
                Math.min(h * 0.72, (tisch.clientHeight - h - 16) / zeilen));
  const felder = [];
  streifen.forEach(s => {
    const n = Math.max(1, Math.floor((s[1] - s[0]) / spaltenBreite));
    for (let c = 0; c < n; c++) felder.push(s[0] + c * spaltenBreite);
  });
  const misch = liste.slice().sort(() => Math.random() - 0.5);
  misch.forEach((k, i) => {
    const c = i % felder.length, r = Math.floor(i / felder.length);
    k._rot = DREHUNG ? (Math.random() * 2 * DREHUNG - DREHUNG).toFixed(1) : 0;
    aufTisch(k,
      felder[c] + (Math.random() - 0.5) * spaltenBreite * 0.35,
      10 + r * hoehe + (Math.random() - 0.5) * hoehe * 0.30);
    k.style.zIndex = ++z;
  });
}


function nachSorten(zu, x0, x1, hoch, h){
  // Ein Bereich je Kartensorte, untereinander und der Kartenzahl entsprechend
  // hoch. Innerhalb eines Bereichs wird genauso gestreut wie sonst auf dem
  // ganzen Tisch: viele Plaetze, gemischt, mit Zittern - also unregelmaessig.
  const sorten = [];
  zu.forEach(k => { const t = k.dataset.typ || '?';
                    if (!sorten.includes(t)) sorten.push(t); });
  const gruppen = sorten.map(t => zu.filter(k => (k.dataset.typ || '?') === t));
  const gesamt = zu.length || 1;
  const luft = 10;
  const frei = Math.max(h, hoch - KOPF - luft * (gruppen.length - 1));

  let y = KOPF;
  gruppen.forEach(gruppe => {
    const bh = Math.max(h + 4, frei * gruppe.length / gesamt);
    const nx = Math.max(1, Math.floor((x1 - x0) / (breite * 0.62)));
    const ny = Math.max(1, Math.floor(bh / (h * 0.42)));
    const plaetze = [];
    for (let r = 0; r < ny; r++)
      for (let c = 0; c < nx; c++)
        plaetze.push([x0 + c * ((x1 - x0 - breite) / Math.max(1, nx - 1) || 0),
                      y + r * ((bh - h) / Math.max(1, ny - 1) || 0)]);
    for (let i = plaetze.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [plaetze[i], plaetze[j]] = [plaetze[j], plaetze[i]];
    }
    gruppe.slice().sort(() => Math.random() - 0.5).forEach((k, i) => {
      const pl = plaetze[i % plaetze.length] || [x0, y];
      k._rot = 0;
      aufTisch(k,
        Math.max(x0, Math.min(x1 - breite,
                  pl[0] + (Math.random() - 0.5) * breite * 0.24)),
        Math.max(KOPF, Math.min(tisch.clientHeight - h - 4,
                  pl[1] + (Math.random() - 0.5) * h * 0.22)));
      k.style.zIndex = ++z;
    });
    y += bh + luft;
  });
  loeschenMarken();
}


/* ============ Buendel: geordneter Start, es wird aussortiert ============ */
const BU = {reihen: [], seite: 0, seiten: 1};

function buendelAufbau(){
  document.querySelectorAll('.buendelteil').forEach(e => e.remove());
  BU.reihen = [];
  const W = tisch.clientWidth, h = breite * 0.844;
  const n = BUENDEL.plaetze;
  const luecke = breite * 0.55;
  const gesamt = n * breite + (n - 1) * 8 + luecke + breite;
  const x0 = Math.max(6, (W - gesamt) / 2);
  const hoehe = (tisch.clientHeight - 16) / BUENDEL.reihen;
  for (let r = 0; r < BUENDEL.reihen; r++){
    const y = 8 + r * hoehe + (hoehe - h) / 2;
    const plaetze = [];
    for (let i = 0; i < n; i++)
      plaetze.push({x: x0 + i * (breite + 8), y: y, karte: null});
    const raus = {x: x0 + n * (breite + 8) + luecke, y: y, karte: null};
    BU.reihen.push({plaetze: plaetze, raus: raus});
    plaetze.concat([raus]).forEach((sl, i) => {
      const d = document.createElement('div');
      d.className = 'buendelteil';
      const ist = i === n;
      Object.assign(d.style, {position:'absolute', pointerEvents:'none',
        left: sl.x + 'px', top: sl.y + 'px', width: breite + 'px',
        height: h + 'px', borderRadius:'9px',
        border: (ist ? '2px solid ' + F.akzent() : '1.5px dashed ' + F.rand()),
        background: ist ? F.fuell() : 'transparent'});
      if (ist){
        const t = document.createElement('span');
        t.textContent = BUENDEL.rest;
        Object.assign(t.style, {position:'absolute', inset:'0', display:'flex',
          alignItems:'center', justifyContent:'center', fontSize:'11px',
          color:F.akzent(), textAlign:'center', padding:'0 6px'});
        d.appendChild(t);
      }
      tisch.appendChild(d);
    });
    const nr = document.createElement('div');
    nr.className = 'buendelteil';
    Object.assign(nr.style, {position:'absolute', pointerEvents:'none',
      left: (x0 - 26) + 'px', top: (y + h / 2 - 9) + 'px', fontSize:'13px',
      color:F.matt()});
    nr.textContent = (r + 1);
    tisch.appendChild(nr);
  }
}

function buendelLegen(){
  // Die Karten liegen von Anfang an geordnet: ein Buendel je Reihe, in der
  // Reihenfolge, die karten() geliefert hat. Aussortiert wird, nicht einsortiert.
  const zu = karten.filter(k => k.dataset.rolle !== 'ablage');
  const n = BUENDEL.plaetze;
  BU.seiten = Math.max(1, Math.ceil(zu.length / (n * BUENDEL.reihen)));
  const von = BU.seite * n * BUENDEL.reihen;
  zu.forEach((k, i) => {
    const dran = i >= von && i < von + n * BUENDEL.reihen;
    k.style.display = dran ? '' : 'none';
    if (!dran) k.classList.remove('rastet');
  });
  let i = von;
  BU.reihen.forEach(reihe => {
    reihe.plaetze.forEach(sl => {
      const k = zu[i++];
      sl.karte = k || null;
      if (!k) return;
      k._rot = 0; k.classList.add('rastet');
      aufTisch(k, sl.x, sl.y); k.style.zIndex = ++z;
    });
    reihe.raus.karte = null;
  });
  const kn = document.getElementById('buendelrunde');
  if (kn) kn.style.display = BU.seiten > 1 ? '' : 'none';
  meldung.textContent = BU.seiten > 1
    ? 'Runde ' + (BU.seite + 1) + ' von ' + BU.seiten + '.'
    : '';
}

async function buendelBild(){
  const gelegt = BU.reihen.filter(r => r.raus.karte);
  if (!gelegt.length) return;
  const h = Math.round(breite * 0.844);
  const x0 = BU.reihen[0].plaetze[0].x;
  const x1 = BU.reihen[0].raus.x + breite;
  const hoehe = (tisch.clientHeight - 16) / BUENDEL.reihen;
  const c = document.createElement('canvas'), s2 = 2;
  c.width = (x1 - x0 + 24) * s2;
  c.height = (BUENDEL.reihen * hoehe + 30) * s2;
  const g = c.getContext('2d'); g.scale(s2, s2);
  g.fillStyle = F.karte(); g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = F.matt(); g.font = '13px "Source Sans 3", Helvetica, sans-serif';
  g.fillText('Runde ' + (BU.seite + 1), 12, 18);
  for (const r of BU.reihen)
    for (const sl of r.plaetze.concat([r.raus])){
      if (!sl.karte) continue;
      const b = sl.karte.querySelector('img');
      await b.decode().catch(() => {});
      g.drawImage(b, sl.x - x0 + 12, sl.y + 22, breite, h);
    }
  await new Promise(f => c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'eindringling-' + String(BU.seite + 1).padStart(2, '0') + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    f();
  }));
}

function buendelEinrasten(k){
  const h = breite * 0.844;
  const mx = k._x + breite / 2, my = k._y + h / 2;
  for (const reihe of BU.reihen){
    for (const sl of reihe.plaetze.concat([reihe.raus])){
      if (Math.abs(mx - (sl.x + breite / 2)) < breite * 0.9 &&
          Math.abs(my - (sl.y + h / 2)) < h * 1.1){
        BU.reihen.forEach(r2 => r2.plaetze.concat([r2.raus])
          .forEach(a => { if (a.karte === k) a.karte = null; }));
        if (sl.karte && sl.karte !== k) return false;      // Platz ist belegt
        sl.karte = k; k._rot = 0; k.classList.add('rastet');
        setzen(k, sl.x, sl.y);
        return true;
      }
    }
  }
  BU.reihen.forEach(r2 => r2.plaetze.concat([r2.raus])
    .forEach(a => { if (a.karte === k) a.karte = null; }));
  k.classList.remove('rastet');
  return false;
}

function buendelPruefen(){
  loeschenMarken();
  let fertig = 0, richtig = 0;
  BU.reihen.forEach(reihe => {
    const drin = reihe.plaetze.filter(s => s.karte).map(s => s.karte);
    const raus = reihe.raus.karte;
    if (!raus) return;
    fertig++;
    const marken = [...new Set(drin.map(k => k.dataset.gruppe))];
    const ok = raus.dataset.gruppe === '' && marken.length === 1 &&
               marken[0] !== '';
    drin.concat([raus]).forEach(k => k.classList.add(ok ? 'richtig' : 'falsch'));
    if (ok) richtig++;
  });
  meldung.textContent = fertig === 0
    ? 'Legt zuerst in jeder Reihe eine Karte heraus.'
    : richtig + ' von ' + fertig + ' Reihen stimmen.';
}

/* ================= Kette: Trapez oben, Vorraete unten =================

   Vier Figurenfelder bilden ein Trapez: Start unten links, Ende unten
   rechts, dazwischen oben zwei freie Felder. Vier Pfeile verbinden sie,
   jeder traegt ein Feld:

       drei Pfeile ueber die freien Felder  -> Karte aus dem Vorrat
       ein Pfeil direkt von Start zu Ende   -> Schreibfeld

   Warum das direkte Feld beschrieben und nicht belegt wird: Der Vorrat
   haelt acht Streckfaktoren. Zwischen zwei Figuren derselben Klasse
   kommen aber 22 verschiedene Verhaeltnisse vor, und beim direkten Weg
   faellt der Wert besonders oft heraus. Als Karte waere die Aufgabe in
   zwei Dritteln der Runden unloesbar - und im Rest eindeutig.

   Auf keiner sichtbaren Beschriftung steht, in welchem Verhaeltnis die
   vier Felder zueinander stehen. Genau das soll gefunden werden.
   ===================================================================== */
const KETTE = {slots: [], runde: null, nr: 0, direkt: ''};

const K_START = 0, K_C = 1, K_D = 2, K_ENDE = 3;
const K_F1 = 4, K_F2 = 5, K_F3 = 6;

function kettenAufbau(){
  document.querySelectorAll('.kettenteil').forEach(e => e.remove());
  KETTE.slots = [];
  const W = tisch.clientWidth, H = tisch.clientHeight;
  const h = breite * 0.844, g = Math.max(8, Math.round(breite * 0.16));
  // Zwischen den beiden oberen Feldern braucht es mehr Luft als sonst:
  // Sonst deckt das Faktorfeld den ganzen Pfeil zu und man sieht gar keinen.
  const gg = Math.max(16, Math.round(breite * 0.42));
  // Einrueckung und Hoehe des Trapezes sind so gewaehlt, dass von jeder
  // Diagonalen links und rechts des Faktorfelds noch ein Stueck Pfeil zu
  // sehen ist. Enger, und das Feld deckt den Pfeil vollstaendig zu.
  const ins = Math.round(breite * 1.35) + g;
  const B = 3 * breite + 2 * gg + 2 * ins;   // Spannweite der unteren Reihe
  const x0 = Math.max(6, (W - B) / 2);
  const yO = 30, dy = Math.round(h * 1.60), yU = yO + h + dy;
  const xC = x0 + ins, xF2 = xC + breite + gg, xD = xF2 + breite + gg;
  const xE = x0 + B - breite;

  function kasten(x, y, w, hh, fest, text, farbe){
    const d = document.createElement('div');
    d.className = 'kettenteil';
    Object.assign(d.style, {position:'absolute', pointerEvents:'none',
      left:x + 'px', top:y + 'px', width:w + 'px', height:hh + 'px',
      borderRadius:'9px', zIndex:1,
      border:(fest ? '2px solid ' + F.fest() : '1.5px dashed ' + farbe),
      background: fest ? F.fuell() : 'transparent'});
    if (text){
      const t = document.createElement('span');
      t.textContent = text;
      Object.assign(t.style, {position:'absolute', inset:'0', display:'flex',
        alignItems:'center', justifyContent:'center', fontSize:'10px',
        color:farbe, textAlign:'center', padding:'0 3px'});
      d.appendChild(t);
    }
    tisch.appendChild(d);
  }

  // ---- die vier Figurenfelder ----
  [[x0, yU, true, 'Start'], [xC, yO, false, ''],
   [xD, yO, false, ''], [xE, yU, true, 'Ende']].forEach(([x, y, fest, lab]) => {
    KETTE.slots.push({x:x, y:y, w:breite, h:h, art:'figur',
                      fest:fest, karte:null});
    kasten(x, y, breite, h, fest, lab, fest ? F.fest() : F.rand());
  });

  // ---- die drei Faktorfelder auf den Umwegpfeilen ----
  // Alle drei heissen gleich. Ein Feld «k» neben Feldern «k1, k2, k3»
  // verriete die Beziehung, bevor sie gefunden ist.
  const yF = yO + h + dy / 2 - h / 2;
  [[x0 + ins / 2, yF], [xF2, yO], [xD + ins / 2, yF]].forEach(([x, y]) => {
    KETTE.slots.push({x:x, y:y, w:breite, h:h, art:'faktor',
                      fest:false, karte:null});
    kasten(x, y, breite, h, false, 'Faktor', F.akzent());
  });

  // ---- die Pfeile ----
  const sv = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  sv.setAttribute('class', 'kettenteil');
  Object.assign(sv.style, {position:'absolute', left:'0', top:'0',
    width:W + 'px', height:(yU + h + 10) + 'px', pointerEvents:'none',
    zIndex:0});
  sv.innerHTML = '<defs><marker id="sp" markerWidth="7" markerHeight="7" ' +
    'refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="' +
    F.matt() + '"/></marker></defs>';
  const pfeil = (x1, y1, x2, y2) => {
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1);
    l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('stroke', F.matt());
    l.setAttribute('stroke-width', '1.6');
    l.setAttribute('marker-end', 'url(#sp)');
    sv.appendChild(l);
  };
  pfeil(x0 + breite * 0.8, yU, xC + breite * 0.2, yO + h);           // Start -> oben
  pfeil(xC + breite, yO + h / 2, xD, yO + h / 2);                    // oben -> oben
  pfeil(xD + breite * 0.8, yO + h, xE + breite * 0.2, yU);           // oben -> Ende
  pfeil(x0 + breite, yU + h / 2, xE, yU + h / 2);                    // Start -> Ende
  tisch.appendChild(sv);

  // ---- das Schreibfeld auf dem direkten Pfeil ----
  const fw = Math.max(58, breite * 0.9), fh = Math.max(26, h * 0.44);
  const e = document.createElement('input');
  e.className = 'kettenteil direktfeld';
  e.type = 'text'; e.value = KETTE.direkt;
  e.placeholder = 'Faktor';
  Object.assign(e.style, {position:'absolute',
    left:(x0 + B / 2 - fw / 2) + 'px', top:(yU + h / 2 - fh / 2) + 'px',
    width:fw + 'px', height:fh + 'px', pointerEvents:'auto', zIndex:2});
  e.oninput = () => { KETTE.direkt = e.value; loeschenMarken(); };
  tisch.appendChild(e);
  KETTE.feld = e;

  // ---- Vorraete darunter ----
  const trenn = yU + h + 22;
  const beschriften = (links, weite, text, farbe) => {
    const d = document.createElement('div');
    d.className = 'kettenteil';
    Object.assign(d.style, {position:'absolute', pointerEvents:'none',
      left: links + 'px', top: trenn + 'px', width: weite + 'px',
      height: Math.max(40, H - trenn - 8) + 'px', borderRadius:'10px',
      border:'1.5px solid ' + F.linie(), background:'transparent'});
    const t = document.createElement('span');
    t.textContent = text;
    Object.assign(t.style, {position:'absolute', left:'10px', top:'6px',
      fontSize:'11px', color: farbe});
    d.appendChild(t);
    tisch.appendChild(d);
  };
  KETTE.figuren = [8, Math.round(W * 0.70) - 16];
  KETTE.faktoren = [Math.round(W * 0.70), W - 16];
  KETTE.oben = trenn + 24;
  beschriften(KETTE.figuren[0], KETTE.figuren[1] - KETTE.figuren[0],
              'Figuren', F.matt());
  beschriften(KETTE.faktoren[0], KETTE.faktoren[1] - KETTE.faktoren[0],
              'Streckfaktoren', F.akzent());
}

function kettenStreuen(){
  const h = breite * 0.844;
  const lege = (liste, x0, x1) => {
    const w = breite, hh = h;
    const nx = Math.max(1, Math.floor((x1 - x0) / (w * 0.72)));
    const plaetze = [];
    const ny = Math.max(1, Math.floor((tisch.clientHeight - KETTE.oben - 8) / (hh * 0.6)));
    for (let r = 0; r < ny; r++)
      for (let c = 0; c < nx; c++)
        plaetze.push([x0 + c * ((x1 - x0 - w) / Math.max(1, nx - 1) || 0),
                      KETTE.oben + r * ((tisch.clientHeight - KETTE.oben - hh - 8)
                                        / Math.max(1, ny - 1) || 0)]);
    for (let i = plaetze.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [plaetze[i], plaetze[j]] = [plaetze[j], plaetze[i]];
    }
    liste.forEach((k, i) => {
      const p = plaetze[i % plaetze.length] || [x0, KETTE.oben];
      k._rot = 0;
      aufTisch(k, Math.max(x0, Math.min(x1 - w - 2, p[0])), p[1]);
      k.style.zIndex = ++z;
    });
  };
  const frei = karten.filter(k => !KETTE.slots.some(s => s.karte === k));
  lege(frei.filter(k => k.dataset.faktor === undefined),
       KETTE.figuren[0] + 6, KETTE.figuren[1] - 6);
  lege(frei.filter(k => k.dataset.faktor !== undefined),
       KETTE.faktoren[0] + 6, KETTE.faktoren[1] - 6);
}

async function kettenBild(){
  const belegt = KETTE.slots.filter(s => s.karte);
  if (belegt.length < 3 && !KETTE.direkt) return;   // nichts Nennenswertes
  const h = Math.round(breite * 0.844);
  let x0 = 1e9, y0 = 1e9, x1 = 0, y1 = 0;
  KETTE.slots.forEach(s => {
    x0 = Math.min(x0, s.x); y0 = Math.min(y0, s.y);
    x1 = Math.max(x1, s.x + s.w); y1 = Math.max(y1, s.y + s.h);
  });
  const s2 = 2, c = document.createElement('canvas');
  const cw = x1 - x0 + 24, ch = y1 - y0 + 40;
  c.width = cw * s2; c.height = ch * s2;
  const g = c.getContext('2d'); g.scale(s2, s2);
  g.fillStyle = F.karte(); g.fillRect(0, 0, cw, ch);
  g.fillStyle = F.matt(); g.font = '13px "Source Sans 3", Helvetica, sans-serif';
  g.fillText('Runde ' + KETTE.nr, 12, 18);
  for (const sl of KETTE.slots){
    if (!sl.karte) continue;
    const b = sl.karte.querySelector('img');
    await b.decode().catch(() => {});
    g.drawImage(b, sl.x - x0 + 12, sl.y - y0 + 26, breite, h);
  }
  // Das Schreibfeld gehoert mit aufs Bild - es ist der Teil, den die
  // Gruppe selbst gefunden hat.
  if (KETTE.feld){
    const fx = parseFloat(KETTE.feld.style.left) - x0 + 12;
    const fy = parseFloat(KETTE.feld.style.top) - y0 + 26;
    const fw = parseFloat(KETTE.feld.style.width);
    const fh = parseFloat(KETTE.feld.style.height);
    g.strokeStyle = F.akzent(); g.lineWidth = 1.5;
    g.strokeRect(fx, fy, fw, fh);
    if (KETTE.direkt){
      g.fillStyle = farbe('--tinte');
      g.font = '15px "Patrick Hand", cursive';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(KETTE.direkt, fx + fw / 2, fy + fh / 2, fw - 8);
      g.textAlign = 'start'; g.textBaseline = 'alphabetic';
    }
  }
  await new Promise(f => c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'kette-' + String(KETTE.nr).padStart(2, '0') + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    f();
  }));
}

function kettenRunde(){
  if (!RUNDEN || !RUNDEN.length) return;
  KETTE.nr++;
  const klassen = [...new Set(RUNDEN.map(r => r.klasse))];
  const kl = klassen[Math.floor(Math.random() * klassen.length)];
  let pool = RUNDEN.filter(r => r.klasse === kl);
  if (KETTE.nr % 4 === 0 && pool.some(r => r.monoton))
    pool = pool.filter(r => r.monoton);          // ab und zu eine monotone
  const r = pool[Math.floor(Math.random() * pool.length)];
  KETTE.runde = r;
  KETTE.slots.forEach(s => { s.karte = null; });
  KETTE.direkt = '';
  if (KETTE.feld) KETTE.feld.value = '';
  loeschenMarken();
  const hol = c => karten.find(k => k.dataset.code === c);
  let start = hol(r.weg[0]), ende = hol(r.weg[3]);
  if (KETTE.nr % 5 === 0){                       // jede fuenfte Runde geht nicht auf
    const fremd = karten.filter(k => k.dataset.klasse &&
                                     k.dataset.klasse !== kl);
    if (fremd.length) ende = fremd[Math.floor(Math.random() * fremd.length)];
    KETTE.runde = null;
  }
  kettenStreuen();
  [[K_START, start], [K_ENDE, ende]].forEach(([i, k]) => {
    if (!k) return;
    const s = KETTE.slots[i];
    s.karte = k; k._rot = 0; aufTisch(k, s.x, s.y); k.classList.add('rastet');
  });
  meldung.textContent = 'Runde ' + KETTE.nr +
    ': Sucht zwei Figuren f\u00fcr die oberen Felder und f\u00fcllt alle vier ' +
    'Felder an den Pfeilen.';
}

function kettenEinrasten(k){
  const istFaktor = k.dataset.faktor !== undefined;
  const mx = k._x + breite / 2, my = k._y + breite * 0.844 / 2;
  for (let i = 0; i < KETTE.slots.length; i++){
    const s = KETTE.slots[i];
    if (s.fest) continue;
    if ((s.art === 'faktor') !== istFaktor) continue;
    if (Math.abs(mx - (s.x + s.w / 2)) < s.w * 0.9 &&
        Math.abs(my - (s.y + s.h / 2)) < s.h * 1.1){
      KETTE.slots.forEach(a => { if (a.karte === k) a.karte = null; });
      if (s.karte) s.karte.classList.remove('rastet');
      s.karte = k; k._rot = 0; k.classList.add('rastet');
      setzen(k, s.x, s.y);
      return true;
    }
  }
  KETTE.slots.forEach(a => { if (a.karte === k) a.karte = null; });
  k.classList.remove('rastet');
  return false;
}

function _alsZahl(t){
  if (!t) return NaN;
  const r = t.trim().replace(',', '.');
  const p = r.split('/');
  if (p.length === 2) return (+p[0]) / (+p[1]);
  return +r;
}

function kettePruefen(){
  const fig = [K_START, K_C, K_D, K_ENDE].map(i => KETTE.slots[i].karte);
  const fak = [K_F1, K_F2, K_F3].map(i => KETTE.slots[i].karte);
  if (fig.some(k => !k) || fak.some(k => !k)){
    meldung.textContent = 'Es fehlen noch Karten im Trapez.'; return;
  }
  let richtig = 0;
  loeschenMarken();
  for (let i = 0; i < 3; i++){
    const a = +fig[i].dataset.groesse, b = +fig[i + 1].dataset.groesse;
    const soll = _alsZahl(fak[i].dataset.faktor);
    const ok = fig[i].dataset.klasse === fig[i + 1].dataset.klasse &&
               Math.abs(b / a - soll) < 0.01;
    [fig[i], fak[i], fig[i + 1]].forEach(k =>
      k.classList.add(ok ? 'richtig' : 'falsch'));
    if (ok) richtig++;
  }
  // Der direkte Weg wird gegen die beiden gegebenen Figuren geprueft. Die
  // Meldung nennt die vier Felder getrennt und sagt nichts darueber, wie
  // sie zusammenhaengen - das steht auch im Quelltext nirgends.
  let satz = richtig === 3
    ? 'Alle drei Schritte des Umwegs passen.'
    : richtig + ' von 3 Schritten des Umwegs passen.';
  if (KETTE.direkt.trim()){
    const soll = +fig[3].dataset.groesse / +fig[0].dataset.groesse;
    const ok = Math.abs(_alsZahl(KETTE.direkt) - soll) < 0.01 &&
               fig[0].dataset.klasse === fig[3].dataset.klasse;
    if (KETTE.feld)
      KETTE.feld.style.borderColor = ok ? F.richtig() : F.falsch();
    satz += ok ? '  Der direkte Streckfaktor stimmt.'
               : '  Der direkte Streckfaktor stimmt noch nicht.';
  } else {
    satz += '  Das Feld auf dem direkten Pfeil ist noch leer.';
  }
  meldung.textContent = satz;
}

function auslegen(){
  if (FLAECHE === 'buendel'){ buendelAufbau(); buendelLegen(); return; }
  if (FLAECHE === 'kette'){ kettenAufbau(); kettenStreuen(); return; }
  const h = Math.round(breite * 0.844);
  const zu = karten.filter(k => k.dataset.rolle !== 'ablage');
  const bereiche = [];
  if (!BRETT){
    const grenze = HAELFTEN ? tisch.clientWidth * HAELFTEN.teiler : tisch.clientWidth;
    bereiche.push([4, Math.max(60, grenze - 10)]);
  } else {
    const bx = parseFloat(brett.style.left) || 0, bw = brett.offsetWidth;
    const by = parseFloat(brett.style.top) || 0, bh = brett.offsetHeight;
    const luft = Math.max(8, breite * 0.35);   // Abstand zum Brett, mitwachsend
    if (BRETT.unten){
      // Breites Brett: die Karten gehoeren unter die Felder, nicht an den
      // Rand gequetscht. Der dritte Wert eines Bereichs ist seine Oberkante.
      bereiche.push([4, Math.max(60, tisch.clientWidth - 6), by + bh + luft]);
    } else {
      if (bx - luft > breite * 0.8) bereiche.push([4, bx - luft]);
      const rechts = bx + bw + luft;
      if (tisch.clientWidth - rechts > breite * 0.8)
        bereiche.push([rechts, tisch.clientWidth - 6]);
    }
    if (!bereiche.length) bereiche.push([4, Math.max(60, tisch.clientWidth - 6)]);
  }
  // Plaetze auf einem versetzten Gitter verteilen und mischen: die Karten
  // liegen durcheinander, verdecken sich aber nicht gegenseitig.
  const hoch = Math.max(20, tisch.clientHeight - 16);
  if (SORTIERT && bereiche.length === 1){
    nachSorten(zu, bereiche[0][0], bereiche[0][1], hoch, h);
    return;
  }
  const plaetze = [];
  bereiche.forEach(([x0, x1, oben]) => {
    const y0 = (oben === undefined) ? KOPF : oben;
    const nx = Math.max(1, Math.floor((x1 - x0) / (breite * 0.62)));
    const ny = Math.max(1, Math.floor((hoch - y0) / (h * 0.52)));
    for (let r = 0; r < ny; r++)
      for (let c = 0; c < nx; c++)
        plaetze.push([x0 + c * ((x1 - x0 - breite) / Math.max(1, nx - 1) || 0),
                      y0 + r * ((hoch - y0 - h) / Math.max(1, ny - 1) || 0), x1]);
  });
  for (let i = plaetze.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [plaetze[i], plaetze[j]] = [plaetze[j], plaetze[i]];
  }
  zu.forEach((k, i) => {
    const p = plaetze[i % plaetze.length] || [8, 8, tisch.clientWidth];
    k._rot = GEDREHT ? (Math.random() * 12 - 6).toFixed(1) : 0;
    const xmax = Math.min(tisch.clientWidth, p[2] === undefined
                          ? tisch.clientWidth : p[2]) - breite - 4;
    aufTisch(k,
      Math.max(2, Math.min(xmax,
                           p[0] + (Math.random() * breite * 0.22 - breite * 0.11))),
      Math.max(2, Math.min(tisch.clientHeight - h - 4,
                           p[1] + (Math.random() * h * 0.20 - h * 0.10))));
    k.style.zIndex = ++z;
  });
  loeschenMarken();
}

function zurueck(){
  // Stellt den Zustand vom Oeffnen wieder her.
  const heim = k => {
    k.style.transform = ''; k._x = k._y = 0; k.style.zIndex = '';
    k._rot = 0; k._feld = undefined; k.classList.remove('rastet');
    k._heim.appendChild(k);
  };
  if (FLAECHE === 'tisch' || FLAECHE === 'runden'){
    karten.filter(k => k.dataset.rolle === 'ablage').forEach(heim);
    auslegen(); meldung.textContent = ''; return;
  }
  karten.forEach(heim);
  loeschenMarken(); meldung.textContent = '';
}

function loeschenMarken(){
  if (typeof KETTE !== 'undefined' && KETTE.feld)
    KETTE.feld.style.borderColor = '';
  karten.forEach(k => k.classList.remove('falsch', 'richtig'));
  pruefstufe = 0;
}

/* ---------- Ziehen: über transform, damit nichts neu umbricht ---------- */
karten.forEach(lupeAnhaengen);

karten.forEach(k => {
  let ax = 0, ay = 0;
  k.addEventListener('pointerdown', e => {
    if (k.parentElement !== tisch){
      const r = k.getBoundingClientRect(), t = tisch.getBoundingClientRect();
      aufTisch(k, r.left - t.left + tisch.scrollLeft, r.top - t.top + tisch.scrollTop);
    }
    k.setPointerCapture(e.pointerId);
    k.classList.add('aktiv');
    k._z = k.style.zIndex;
    lupe(k, true);
    k.style.zIndex = ++z;
    ax = e.clientX - k._x; ay = e.clientY - k._y;
    e.preventDefault();
  });
  k.addEventListener('pointermove', e => {
    if (!k.classList.contains('aktiv')) return;
    setzen(k, e.clientX - ax, e.clientY - ay);
  });
  ['pointerup','pointercancel'].forEach(t =>
    k.addEventListener(t, () => {
      k.classList.remove('aktiv'); lupe(k, false); einrasten(k); }));
});

/* ---------- Prüfen auf dem Brett: Bereich statt Häufchen ---------- */
function gewaehlteBausteine(){
  const aus = [];
  for (let i = 0; i < BRETT.felder.length; i++){
    const k = karten.find(a => a._feld === i);
    aus.push(k ? (k.dataset.baustein || '') : '');
  }
  return aus;
}

function inKreis(k, i){
  const bw = brett.offsetWidth, bh = brett.offsetHeight;
  const bx = parseFloat(brett.style.left) || 0, by = parseFloat(brett.style.top) || 0;
  const [cx, cy, r] = BRETT.kreise[i];
  const mx = k._x + breite / 2, my = k._y + breite * 0.844 / 2;
  const dx = mx - (bx + cx * bw), dy = my - (by + cy * bh);
  return Math.hypot(dx, dy) <= r * bw;
}

function pruefeBrett(){
  const gewaehlt = gewaehlteBausteine();
  if (!gewaehlt.some(Boolean)){
    meldung.textContent = 'Legt zuerst Bausteinkarten in die Kreise.';
    return null;
  }
  const auf = karten.filter(k => k.parentElement === tisch &&
                                 k.dataset.rolle !== 'ablage' &&
                                 k.dataset.faktoren !== undefined);
  let richtig = 0, falsch = 0;
  const marken = [];
  auf.forEach(k => {
    const hat = k.dataset.faktoren.split(' ').filter(Boolean);
    let ok = true;
    for (let i = 0; i < gewaehlt.length; i++){
      if (!gewaehlt[i]) continue;
      const soll = hat.indexOf(gewaehlt[i]) >= 0;
      if (soll !== inKreis(k, i)) ok = false;
    }
    marken.push([k, ok]);
    ok ? richtig++ : falsch++;
  });
  return {marken, richtig, falsch, gesamt: auf.length};
}

/* ---------- Prüfen: Häufchen erkennen, nicht Felder vorgeben ---------- */
function pruefeRunde(){
  const gew = [];
  for (let i = 0; i < aktiveFelder; i++){
    const k = karten.find(a => a._feld === i);
    if (k && k.dataset.baustein) gew.push(k.dataset.baustein);
  }
  if (gew.length < aktiveFelder){
    meldung.textContent = 'Legt zuerst ' + aktiveFelder + ' ' +
      (aktiveFelder > 1 ? RTEXT.mehrzahl : RTEXT.einheit) + ' in die Felder.';
    return null;
  }
  const bw = brett.offsetWidth, bh = brett.offsetHeight;
  const bx = parseFloat(brett.style.left) || 0, by = parseFloat(brett.style.top) || 0;
  const [sx, sy, sw, sh] = BRETT.sammel;
  const marken = []; let richtig = 0, fehlt = 0;
  karten.filter(k => k.dataset.faktoren !== undefined).forEach(k => {
    const mx = k._x + breite / 2, my = k._y + breite * 0.844 / 2;
    const drin = k.parentElement === tisch &&
                 mx > bx + sx * bw && mx < bx + (sx + sw) * bw &&
                 my > by + sy * bh && my < by + (sy + sh) * bh;
    const hat = k.dataset.faktoren.split(' ');
    const soll = gew.every(b => hat.indexOf(b) >= 0);
    if (drin || soll) marken.push([k, drin === soll]);
    if (drin && soll) richtig++;
    if (!drin && soll) fehlt++;
  });
  return {marken, richtig, fehlt,
          gesamt: marken.filter(([, ok]) => ok).length +
                  marken.filter(([, ok]) => !ok).length};
}

function pruefen(){
  if (FLAECHE === 'buendel'){ buendelPruefen(); return; }
  if (FLAECHE === 'kette'){ kettePruefen(); return; }
  if (FLAECHE === 'runden'){
    const e = pruefeRunde();
    if (!e) return;
    document.getElementById('pruefen')._brett = e;
    pruefstufe = 1;
    meldung.textContent = e.richtig + ' Karten liegen richtig in der Sammelfläche' +
      (e.fehlt ? ', ' + e.fehlt + ' fehlen noch' : '') +
      '.  Nochmals drücken zeigt, welche.';
    return;
  }
  if (BRETT){
    const e = pruefeBrett();
    if (!e) return;
    document.getElementById('pruefen')._brett = e;
    pruefstufe = 1;
    meldung.textContent = e.richtig + ' von ' + e.gesamt +
      ' Karten liegen richtig.  Nochmals drücken zeigt, welche.';
    return;
  }
  const auf = karten.filter(k => k.parentElement === tisch);
  if (auf.length < 2){ meldung.textContent = 'Auf der Fläche liegt noch nichts.'; return; }
  if (pruefstufe === 1){                       // zweiter Druck: markieren
    pruefstufe = 2; return;
  }
  loeschenMarken();
  const h = breite * 0.844, dx = breite * 0.55, dy = h * 0.55;
  const vater = auf.map((_, i) => i);
  const finde = i => vater[i] === i ? i : (vater[i] = finde(vater[i]));
  for (let i = 0; i < auf.length; i++)
    for (let j = i + 1; j < auf.length; j++){
      const a = auf[i], b = auf[j];
      const lx = Math.max(0, Math.max(a._x, b._x) - Math.min(a._x, b._x) - breite);
      const ly = Math.max(0, Math.max(a._y, b._y) - Math.min(a._y, b._y) - h);
      if (lx < dx && ly < dy) vater[finde(i)] = finde(j);
    }
  const haufen = {};
  auf.forEach((k, i) => { const w = finde(i); (haufen[w] = haufen[w] || []).push(k); });

  const gesamt = {};
  karten.forEach(k => { const g = k.dataset.gruppe;
                        if (g) gesamt[g] = (gesamt[g] || 0) + 1; });

  let stimmt = 0, gruppen = 0, rest = 0;
  Object.values(haufen).forEach(gr => {
    if (gr.length < 2) return;
    const marken = [...new Set(gr.map(k => k.dataset.gruppe))];
    if (marken.length === 1 && marken[0] === ''){ rest++; return; }
    gruppen++;
    const ok = marken.length === 1 && marken[0] !== '' &&
               gr.length === gesamt[marken[0]];
    if (ok){ stimmt++; gr.forEach(k => k.classList.add('richtig')); }
    else   { gr.forEach(k => k.classList.add('falsch')); }
  });
  karten.forEach(k => k.classList.remove('falsch', 'richtig'));  // Stufe 1: nur zählen
  pruefstufe = 1;
  meldung.textContent = gruppen + ' Gruppe' + (gruppen === 1 ? '' : 'n') +
    ' erkannt, ' + stimmt + ' davon vollständig' +
    (rest ? ' · dazu ' + rest + ' Reststapel' : '') +
    '.  Nochmals drücken zeigt, welche.';
  document.getElementById('pruefen')._merk = haufen;
}

function markieren(){
  const e = document.getElementById('pruefen')._brett;
  if (BRETT && e){
    e.marken.forEach(([k, ok]) => k.classList.add(ok ? 'richtig' : 'falsch'));
    meldung.textContent = 'Grün liegt richtig, Rot nicht. ' +
                          'Nochmals drücken blendet es aus.';
    return;
  }
  const haufen = document.getElementById('pruefen')._merk;
  if (!haufen) return;
  const gesamt = {};
  karten.forEach(k => { const g = k.dataset.gruppe;
                        if (g) gesamt[g] = (gesamt[g] || 0) + 1; });
  Object.values(haufen).forEach(gr => {
    if (gr.length < 2) return;
    const marken = [...new Set(gr.map(k => k.dataset.gruppe))];
    if (marken.length === 1 && marken[0] === '') return;
    const ok = marken.length === 1 && marken[0] !== '' && gr.length === gesamt[marken[0]];
    gr.forEach(k => k.classList.add(ok ? 'richtig' : 'falsch'));
  });
  meldung.textContent = 'Grün stimmt, Rot nicht. Nochmals drücken blendet es aus.';
}

/* ---------- Bild speichern ---------- */
async function bild(still){
  const auf = karten.filter(k => k.parentElement === tisch);
  if (!auf.length){ meldung.textContent = 'Auf der Fläche liegt noch nichts.'; return; }
  const h = Math.round(breite * 0.844);
  let bx = 0, by = 0;
  auf.forEach(k => { bx = Math.max(bx, k._x + breite); by = Math.max(by, k._y + h); });
  document.querySelectorAll('.rasterfeld').forEach(d => {
    if (d.classList.contains('neu')) return;
    bx = Math.max(bx, parseFloat(d.style.left) + parseFloat(d.style.width));
    by = Math.max(by, parseFloat(d.style.top) + parseFloat(d.style.height));
  });
  const s = 2, c = document.createElement('canvas');
  c.width = (bx + 24) * s; c.height = (by + 24) * s;
  const g = c.getContext('2d'); g.scale(s, s);
  g.fillStyle = F.karte(); g.fillRect(0, 0, bx + 24, by + 24);
  // Die Felder gehoeren mit aufs Bild. Bei den frei beschrifteten ist der
  // selbst geschriebene Titel das Ergebnis - die Kartenlage allein sagt
  // ohne ihn nichts.
  document.querySelectorAll('.rasterfeld').forEach(d => {
    if (d.classList.contains('neu')) return;   // Bedienelement, kein Ergebnis
    const x = parseFloat(d.style.left) + 12, y = parseFloat(d.style.top) + 12;
    const w = parseFloat(d.style.width), hh = parseFloat(d.style.height);
    g.save();
    g.strokeStyle = d.style.borderColor || F.rand();
    g.lineWidth = 1.5;
    if (!d.classList.contains('fest')) g.setLineDash([6, 4]);
    g.strokeRect(x, y, w, hh);
    g.setLineDash([]);
    const e = d.querySelector('input.titel'), t = d.querySelector('span');
    const txt = e ? e.value : (t ? t.textContent : '');
    if (txt){
      g.fillStyle = e ? farbe('--tinte') : F.matt();
      g.font = '15px "Patrick Hand", cursive';
      g.textAlign = 'center'; g.textBaseline = 'top';
      g.fillText(txt, x + w / 2, y + 6, w - 16);
    }
    g.restore();
  });
  const sortiert = auf.slice().sort((a, b) => (+a.style.zIndex || 0) - (+b.style.zIndex || 0));
  for (const k of sortiert){
    const b = k.querySelector('img');
    await b.decode().catch(() => {});
    const kw = k.classList.contains('ablage') ? breite * ABL : breite;
    const kh = k.classList.contains('ablage') ? h * ABL : h;
    const w = parseFloat(k._rot || 0);
    if (w){
      g.save();
      g.translate(k._x + 12 + kw / 2, k._y + 12 + kh / 2);
      g.rotate(w * Math.PI / 180);
      g.drawImage(b, -kw / 2, -kh / 2, kw, kh);
      g.restore();
    } else {
      g.drawImage(b, k._x + 12, k._y + 12, kw, kh);
    }
  }
  await new Promise(f => c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = still ? ('runde-' + rundeNr + '.png') : 'sortierergebnis.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    f();
  }));
}

document.getElementById('kleiner').onclick   = () => zoom(-22);
document.getElementById('groesser').onclick  = () => zoom(22);
document.getElementById('zurueck').onclick   = zurueck;
document.getElementById('bild').onclick      = () => bild(false);
document.getElementById('drucken').onclick   = () => window.print();
function haelftenZeichnen(){
  document.querySelectorAll('#teiler,.haelfte').forEach(e => e.remove());
  if (!HAELFTEN) return;
  const x = tisch.clientWidth * HAELFTEN.teiler;
  const l = document.createElement('div'); l.id = 'teiler';
  l.style.left = x + 'px'; tisch.appendChild(l);
  [[HAELFTEN.links, 14], [HAELFTEN.rechts, x + 14]].forEach(([t, px]) => {
    const d = document.createElement('div');
    d.className = 'haelfte'; d.style.left = px + 'px'; d.textContent = t;
    tisch.appendChild(d);
  });
}

function zone(){
  // Bereich, in dem das Raster liegt: rechte Haelfte, sonst der ganze Tisch.
  return HAELFTEN ? [tisch.clientWidth * HAELFTEN.teiler + 10, tisch.clientWidth]
                  : [8, tisch.clientWidth];
}

// Anzahl und Beschriftung der Felder sind Zustand, nicht Vorlage: Die Felder
// werden bei jedem Zoom und jeder Fenstergroesse neu gezeichnet, das selbst
// Geschriebene muss das ueberleben. Deshalb steht es hier und nicht im DOM.
let feldAnzahl = RASTER ? RASTER.anzahl : 0;
const feldTitel = [];

function rasterZeichnen(an){
  document.querySelectorAll('.rasterfeld').forEach(e => e.remove());
  if (!an || !RASTER) return;
  const fw = breite * RASTER.breite, fh = breite * 0.844 * RASTER.hoehe;
  const [zx0, zx1] = zone();
  const spalten = Math.max(1, Math.floor((zx1 - zx0 - 6) / (fw + 10)));

  function feld(x, y, w, hh, text, zusatz, nr){
    const d = document.createElement('div');
    d.className = 'rasterfeld';
    Object.assign(d.style, {left:x + 'px', top:y + 'px', width:w + 'px',
      height:hh + 'px', borderColor: zusatz ? F.akzent() : F.rand()});
    if (RASTER.frei && !zusatz){
      const e = document.createElement('input');
      e.className = 'titel'; e.type = 'text';
      e.placeholder = text; e.value = feldTitel[nr] || '';
      e.oninput = () => { feldTitel[nr] = e.value; };
      d.appendChild(e);
    } else {
      const t = document.createElement('span');
      t.textContent = text; d.appendChild(t);
    }
    tisch.insertBefore(d, tisch.firstChild);
  }

  let r = 0, n = 0;
  for (n = 0; n < feldAnzahl; n++){
    r = Math.floor(n / spalten);
    feld(zx0 + (n % spalten) * (fw + 10), 26 + r * (fh + 10), fw, fh,
         RASTER.beschriftung, false, n);
  }
  if (RASTER.erweiterbar){
    // Steht dort, wo das nächste Feld entsteht - so ist ohne Erklärung
    // sichtbar, was der Klick bewirkt.
    r = Math.floor(n / spalten);
    const d = document.createElement('div');
    d.className = 'rasterfeld neu';
    Object.assign(d.style, {left:(zx0 + (n % spalten) * (fw + 10)) + 'px',
      top:(26 + r * (fh + 10)) + 'px', width:fw + 'px', height:fh + 'px'});
    const t = document.createElement('span');
    t.textContent = '+  ' + (RASTER.neu_text || 'noch eine Gruppe');
    d.appendChild(t);
    d.onclick = () => { feldAnzahl++; rasterZeichnen(true); };
    tisch.insertBefore(d, tisch.firstChild);
  }
  if (RASTER.extra){
    const y = 26 + (r + 1) * (fh + 10);
    const hh = breite * 0.844 * (RASTER.extra.hoehe || RASTER.hoehe);
    feld(zx0, y, zx1 - zx0 - 8, hh, RASTER.extra.beschriftung, true, -1);
  }
}

const rasterKnopf = document.getElementById('raster');
if (!RASTER) rasterKnopf.style.display = 'none';

// «zwingend» heisst: Die Felder gehoeren zur Aufgabe und sind nicht
// Hilfestellung. Dann gibt es nichts zu schalten - der Knopf verschwindet,
// die Klasse `an` bleibt gesetzt, damit Zoom und Groessenaenderung sie
// weiterhin neu zeichnen.
if (RASTER && RASTER.zwingend){
  rasterKnopf.classList.add('an');
  rasterKnopf.style.display = 'none';
}

function rasterBeschriften(){
  if (!rasterKnopf) return;
  rasterKnopf.textContent = rasterKnopf.classList.contains('an')
    ? 'Felder ausblenden' : 'Felder einblenden';
}
rasterKnopf.onclick = e => {
  e.target.classList.toggle('an');
  const an = e.target.classList.contains('an');
  rasterZeichnen(an);
  meldung.textContent = an
    ? 'Die Felder sind eine Hilfe \u2014 ihre Anzahl verr\u00e4t, wie viele Gruppen es gibt.'
    : '';
  rasterBeschriften();
};
const pk = document.getElementById('pruefen');
if (pk) pk.onclick = () => {
  if (pruefstufe === 0) pruefen();
  else if (pruefstufe === 1){ markieren(); pruefstufe = 2; }
  else { loeschenMarken(); meldung.textContent = ''; }
};
// Leere Vorratsfaecher ausblenden - eine Ueberschrift ohne Karten irritiert.
['vorratBild','vorratTerm'].forEach(id => {
  const f = document.getElementById(id);
  if (f && !f.querySelector('.karte')) f.closest('.fach').style.display = 'none';
});
const saeule = document.querySelector('.saeule');
if (saeule && !saeule.querySelector('.karte')) saeule.style.display = 'none';
if (FLAECHE === 'tisch' || FLAECHE === 'runden'){
  const zweite = document.getElementById('vorratTerm').closest('.fach');
  if (zweite) zweite.style.display = 'none';
  // Karten, die schon im Tisch stehen, haben dort ihr Zuhause.
  karten.filter(k => k.parentElement === tisch).forEach(k => k._heim = tisch);
}
/* ---------- Variante mit Runden: Steuerung, Zufall, neue Runde ---------- */
// Wie viele Felder beim Oeffnen aktiv sind. Bei einem Venn-Diagramm sind
// drei der Gegenstand der Aufgabe; wo weniger sinnvoll ist, sagt es das Thema.
let aktiveFelder = (RTEXT && RTEXT.standard) || 1;

function felderZeichnen(){
  if (FLAECHE !== 'runden') return;
  document.querySelectorAll('.slot').forEach(e => e.remove());
  const bw = brett.offsetWidth, bh = brett.offsetHeight;
  const bx = parseFloat(brett.style.left) || 0, by = parseFloat(brett.style.top) || 0;
  for (let i = 0; i < aktiveFelder; i++){
    const f = BRETT.felder[i];
    const d = document.createElement('div');
    d.className = 'slot';
    Object.assign(d.style, {position:'absolute', pointerEvents:'none',
      left:(bx + f[0]*bw) + 'px', top:(by + f[1]*bh) + 'px',
      width:(breite*0.62) + 'px',
      height:(breite*0.844*0.62) + 'px',
      border:'2px solid ' + F.akzent(), borderRadius:'0',
      background:F.fuell()});
    const t = document.createElement('span');
    t.textContent = RTEXT.einheit;
    Object.assign(t.style, {position:'absolute', inset:'0',
      display:'flex', alignItems:'center', justifyContent:'center',
      fontSize:'11px', color:F.akzent()});
    d.appendChild(t);
    tisch.appendChild(d);
  }
}

function neueRunde(){
  // Erst sichern, dann raeumen: Der Zwischenstand ist das Ergebnis der
  // Runde und waere sonst mit dem Aufraeumen weg.
  bild(true).then(() => {
    rundeNr++;
    karten.filter(k => k.dataset.rolle === 'ablage').forEach(k => {
      k._feld = undefined; k.classList.remove('rastet');
      k.style.transform = ''; k._x = k._y = 0; k._heim.appendChild(k);
    });
    loeschenMarken(); auslegen();
    meldung.textContent = 'Runde ' + rundeNr + '. W\u00e4hlt ' + aktiveFelder
      + ' neue ' + (aktiveFelder > 1 ? RTEXT.mehrzahl : RTEXT.einheit)
      + ' \u2014 selbst oder mit \u00abZuf\u00e4llig f\u00fcllen\u00bb.';
  });
}

function zufaellig(){
  const frei = karten.filter(k => k.dataset.rolle === 'ablage' &&
                                  k.dataset.leer !== 'ja');
  const misch = frei.sort(() => Math.random() - 0.5).slice(0, aktiveFelder);
  karten.filter(k => k.dataset.rolle === 'ablage').forEach(k => {
    k._feld = undefined; k.classList.remove('rastet');
  });
  misch.forEach((k, i) => { aufTisch(k, ...feldpunkt(i)); k._feld = i;
                            k.classList.add('rastet'); });
  loeschenMarken();
  // Der Name der Karte, nicht ihr Code - «M1 und M4» sagt niemandem etwas.
  meldung.textContent = 'Gesucht: ' +
    misch.map(k => k.dataset.name || k.dataset.baustein).join(' \u00b7 ');
}

if (FLAECHE === 'runden'){
  document.getElementById('steuerung').style.display = 'block';
  document.getElementById('steuertitel').textContent =
    'Wie viele ' + RTEXT.mehrzahl + '?';
  const feldRahmen = document.getElementById('anzahlknoepfe');
  for (let i = 1; i <= (RTEXT.hoechstens || 3); i++){
    const b = document.createElement('button');
    b.className = 'anzahl' + (i === aktiveFelder ? ' an' : '');
    b.dataset.n = i; b.textContent = i;
    feldRahmen.appendChild(b);
  }
  document.getElementById('zufall').textContent = 'Zufällig füllen';
  document.querySelectorAll('.anzahl').forEach(b => b.onclick = () => {
    document.querySelectorAll('.anzahl').forEach(a => a.classList.remove('an'));
    b.classList.add('an');
    aktiveFelder = +b.dataset.n;
    karten.filter(k => k._feld >= aktiveFelder).forEach(k => {
      k._feld = undefined; k.classList.remove('rastet');
    });
    felderZeichnen(); loeschenMarken();
  });
  document.getElementById('zufall').onclick = zufaellig;
  document.getElementById('runde').onclick = neueRunde;
}

function ketteStarten(){
  document.getElementById('raster').style.display = 'none';
  kettenAufbau(); kettenRunde();
  const kn = document.createElement('button');
  kn.textContent = 'Neue Runde';
  kn.onclick = () => {
    kettenBild().then(() => {
      KETTE.slots.forEach(s => {
        if (s.karte) s.karte.classList.remove('rastet'); });
      kettenRunde();
    });
  };
  document.getElementById('zurueck').after(kn);
  window.addEventListener('resize', () => {
    einpassen(); kettenAufbau(); kettenStreuen();
    KETTE.slots.forEach(s => { if (s.karte) setzen(s.karte, s.x, s.y); });
  });
}

einpassen();
haelftenZeichnen();
if (FLAECHE === 'kette') ketteStarten();
if (FLAECHE === 'buendel'){
  document.getElementById('raster').style.display = 'none';
  const knB = document.createElement('button');
  knB.id = 'buendelrunde'; knB.textContent = 'Neue Runde';
  knB.onclick = () => {
    buendelBild().then(() => {
      BU.seite = (BU.seite + 1) % BU.seiten;
      loeschenMarken(); buendelLegen();
    });
  };
  document.getElementById('zurueck').after(knB);
  buendelAufbau(); buendelLegen();
  window.addEventListener('resize', () => {
    einpassen(); buendelAufbau(); buendelLegen();
  });
}
if (RASTER && (RASTER.an || RASTER.zwingend) && rasterKnopf){
  rasterKnopf.classList.add('an');
  rasterZeichnen(true);
}
rasterBeschriften();
window.addEventListener('resize', () => {
  einpassen();
  haelftenZeichnen();
  rasterZeichnen(rasterKnopf.classList.contains('an'));
});
if (FLAECHE === 'tisch' || FLAECHE === 'runden'){
  // Die Sortierkarten liegen von Anfang an auf dem Tisch, wie im Klassenzimmer.
  // Links bleibt nur die Ablage fuer die Bausteine.
  setTimeout(() => { auslegen(); meldung.textContent = ''; }, 60);
}
