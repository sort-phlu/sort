/* ---------- Variante mit Runden: Steuerung, Zufall, neue Runde ---------- */
// Wie viele Felder beim Oeffnen aktiv sind. Bei einem Venn-Diagramm sind
// drei der Gegenstand der Aufgabe; wo weniger sinnvoll ist, sagt es das Thema.
let aktiveFelder = (RTEXT && RTEXT.standard) || 1;

/* Die Kreise des Venn - so viele, wie gewaehlt sind.

   NEU (2026-08-21, Rikes Entscheidung): «Die Wahl der Kreiszahl bleibt,
   und das Hintergrundbild zieht mit.» Bisher zog es nicht mit: Die
   Kreise steckten in einem fest eingebetteten SVG, das immer DREI
   zeigte. Wer «1» waehlte, sah ein aktives Feld und drei Kreise - die
   Hinweise der Variante nennen zwei Kreise «einen guten Einstieg» und
   drei «die eigentliche Aufgabe», und genau diese Abstufung war nicht
   zu sehen.

   Gezeichnet wird jetzt aus BRETT.kreise. Die Geometrie lag dort
   ohnehin - inKreis() prueft damit, ob eine Karte in einem Kreis
   liegt. Sie war nur nie gezeichnet worden.

   Nebengewinn: Zeichnung und Pruefung benutzen dieselben Zahlen. Vorher
   konnten Bild und Pruefung auseinanderlaufen, ohne dass es auffiel. */
const KREISFARBE = ['#E66C26', '#3C7DC7', '#1D7A45'];
const KREISSTRICH = ['none', '9 4', '3 3'];

function kreiseZeichnen(){
  document.querySelectorAll('.venkreis').forEach(e => e.remove());
  if (!BRETT || !BRETT.kreise) return;
  const bw = brett.offsetWidth, bh = brett.offsetHeight;
  const bx = parseFloat(brett.style.left) || 0, by = parseFloat(brett.style.top) || 0;
  const wieviele = (FLAECHE === 'runden') ? aktiveFelder : BRETT.kreise.length;
  for (let i = 0; i < Math.min(wieviele, BRETT.kreise.length); i++){
    const [cx, cy, r] = BRETT.kreise[i];
    const d = document.createElement('div');
    d.className = 'venkreis';
    const dm = 2 * r * bw;
    Object.assign(d.style, {position:'absolute', pointerEvents:'none',
      left:(bx + cx * bw - r * bw) + 'px',
      top:(by + cy * bh - r * bw) + 'px',
      width:dm + 'px', height:dm + 'px',
      borderRadius:'50%',
      border:'2px ' + (i === 0 ? 'solid' : i === 1 ? 'dashed' : 'dotted')
             + ' ' + KREISFARBE[i % 3],
      background:KREISFARBE[i % 3] + '14',
      zIndex:0});
    tisch.appendChild(d);
  }
}

/* Das Aussenfeld - «hier gehoert hin, was in keinen Kreis passt».

   NEU (2026-08-21): Es stand bisher nur im HINTERGRUNDBILD. Damit hing
   es an einer Datei vom 16. August, deren Erzeuger es nicht mehr gibt -
   und die noch in DejaVu Sans gesetzt war, waehrend alle Karten darauf
   Fira Sans tragen. BRETT.aussen traegt seine Masse laengst; es war nur
   nie gezeichnet worden. Dieselbe Geschichte wie bei den Kreisen. */
function aussenZeichnen(){
  document.querySelectorAll('.aussenfeld').forEach(e => e.remove());
  if (!BRETT || !BRETT.aussen) return;
  const [fx, fy, fw, fh] = BRETT.aussen;
  const bw = brett.offsetWidth, bh = brett.offsetHeight;
  const bx = parseFloat(brett.style.left) || 0, by = parseFloat(brett.style.top) || 0;
  const d = document.createElement('div');
  d.className = 'aussenfeld';
  Object.assign(d.style, {position:'absolute', pointerEvents:'none',
    left:(bx + fx * bw) + 'px', top:(by + fy * bh) + 'px',
    width:(fw * bw) + 'px', height:(fh * bh) + 'px',
    border:'1.5px dashed ' + F.rand(), borderRadius:'10px', zIndex:0});
  const t = document.createElement('span');
  t.textContent = 'Aussenfeld';
  Object.assign(t.style, {position:'absolute', left:'0', right:'0', top:'7px',
    textAlign:'center', fontSize:'11px', color:F.matt()});
  d.appendChild(t);
  tisch.appendChild(d);
}

/* Die Ablagefelder des Bretts - dort, wo eine Karte hingehoert.

   FEHLERBEHOBEN (2026-08-21): Sie standen ebenfalls nur im
   Hintergrundbild. Als ich das Bild abschaltete, verschwanden die drei
   Felder in den Kreisen, in die die Bausteinkarten gelegt werden - die
   Flaeche sah aufgeraeumt aus und war unbedienbar geworden.
   BRETT.felder und BRETT.feldbreite tragen ihre Masse; sie waren nur nie
   gezeichnet worden.

   Bei FLAECHE 'runden' zeichnet felderZeichnen() sie selbst und in
   waehlbarer Zahl - dort nicht doppelt. */
function brettfelderZeichnen(){
  document.querySelectorAll('.brettfeld').forEach(e => e.remove());
  if (!BRETT || !BRETT.felder || FLAECHE === 'runden') return;
  const bw = brett.offsetWidth, bh = brett.offsetHeight;
  const bx = parseFloat(brett.style.left) || 0, by = parseFloat(brett.style.top) || 0;
  const fb = (BRETT.feldbreite || 0.06) * bw;
  BRETT.felder.forEach(([fx, fy]) => {
    const d = document.createElement('div');
    d.className = 'brettfeld';
    Object.assign(d.style, {position:'absolute', pointerEvents:'none',
      left:(bx + fx * bw) + 'px', top:(by + fy * bh) + 'px',
      width:fb + 'px', height:(fb * 0.844) + 'px',
      border:'1.5px dashed ' + F.akzent(), borderRadius:'7px',
      background:'rgba(255,255,255,.55)', zIndex:1});
    tisch.appendChild(d);
  });
}

function felderZeichnen(){
  kreiseZeichnen();
  aussenZeichnen();
  brettfelderZeichnen();
  if (FLAECHE !== 'runden') return;
  document.querySelectorAll('.slot').forEach(e => e.remove());
  const bw = brett.offsetWidth, bh = brett.offsetHeight;
  const bx = parseFloat(brett.style.left) || 0, by = parseFloat(brett.style.top) || 0;
  for (let i = 0; i < aktiveFelder; i++){
    const f = BRETT.felder[i];
    const d = document.createElement('div');
    d.className = 'slot';
    Object.assign(d.style, {position:'absolute', pointerEvents:'none',
      left:(bx + f[0]*bw) + 'px', top:(by + f[1]*bh) + 'px',
      width:(breite*0.62) + 'px',
      height:(breite*0.844*0.62) + 'px',
      border:'2px solid ' + F.akzent(), borderRadius:'0',
      background:F.fuell()});
    const t = document.createElement('span');
    t.textContent = RTEXT.einheit;
    Object.assign(t.style, {position:'absolute', inset:'0',
      display:'flex', alignItems:'center', justifyContent:'center',
      fontSize:'11px', color:F.akzent()});
    d.appendChild(t);
    tisch.appendChild(d);
  }
}

function neueRunde(){
  // Erst sichern, dann raeumen: Der Zwischenstand ist das Ergebnis der
  // Runde und waere sonst mit dem Aufraeumen weg.
  bild(true).then(() => {
    rundeNr++;
    karten.filter(k => k.dataset.rolle === 'ablage').forEach(k => {
      k._feld = undefined; k.classList.remove('rastet');
      k.style.transform = ''; k._x = k._y = 0; k._heim.appendChild(k);
    });
    loeschenMarken(); auslegen();
    meldung.textContent = 'Runde ' + rundeNr + '. W\u00e4hlt ' + aktiveFelder
      + ' neue ' + (aktiveFelder > 1 ? RTEXT.mehrzahl : RTEXT.einheit)
      + ' \u2014 selbst oder mit \u00abZuf\u00e4llig f\u00fcllen\u00bb.';
  });
}

function zufaellig(){
  const frei = karten.filter(k => k.dataset.rolle === 'ablage' &&
                                  k.dataset.leer !== 'ja');
  const misch = frei.sort(() => Math.random() - 0.5).slice(0, aktiveFelder);
  karten.filter(k => k.dataset.rolle === 'ablage').forEach(k => {
    k._feld = undefined; k.classList.remove('rastet');
  });
  misch.forEach((k, i) => { aufTisch(k, ...feldpunkt(i)); k._feld = i;
                            k.classList.add('rastet'); });
  loeschenMarken();
  // Der Name der Karte, nicht ihr Code - «M1 und M4» sagt niemandem etwas.
  meldung.textContent = 'Gesucht: ' +
    misch.map(k => k.dataset.name || k.dataset.baustein).join(' \u00b7 ');
}

if (FLAECHE === 'runden'){
  document.getElementById('steuerung').style.display = 'block';
  document.getElementById('steuertitel').textContent =
    'Wie viele ' + RTEXT.mehrzahl + '?';
  const feldRahmen = document.getElementById('anzahlknoepfe');
  for (let i = 1; i <= (RTEXT.hoechstens || 3); i++){
    const b = document.createElement('button');
    b.className = 'anzahl' + (i === aktiveFelder ? ' an' : '');
    b.dataset.n = i; b.textContent = i;
    // Gleiche Anteile statt Eigenbreite - sonst passt die Reihe nicht
    // in die schmale Spalte. min-width:0 ist noetig, sonst weigert
    // sich ein flex-Kind, unter seine Inhaltsbreite zu schrumpfen.
    b.style.flex = '1 1 0'; b.style.minWidth = '0';
    b.style.paddingLeft = '0'; b.style.paddingRight = '0';
    feldRahmen.appendChild(b);
  }
  document.getElementById('zufall').textContent = 'Zufällig füllen';
  document.querySelectorAll('.anzahl').forEach(b => b.onclick = () => {
    document.querySelectorAll('.anzahl').forEach(a => a.classList.remove('an'));
    b.classList.add('an');
    aktiveFelder = +b.dataset.n;
    karten.filter(k => k._feld >= aktiveFelder).forEach(k => {
      k._feld = undefined; k.classList.remove('rastet');
    });
    felderZeichnen(); loeschenMarken();
  });
  document.getElementById('zufall').onclick = zufaellig;
  document.getElementById('runde').onclick = neueRunde;
}

function ketteStarten(){
  document.getElementById('raster').style.display = 'none';
  kettenAufbau(); kettenRunde();
  const kn = document.createElement('button');
  kn.textContent = 'Neue Runde';
  kn.onclick = () => {
    kettenBild().then(() => {
      KETTE.slots.forEach(s => {
        if (s.karte) s.karte.classList.remove('rastet'); });
      kettenRunde();
    });
  };
  document.getElementById('zurueck').after(kn);
  window.addEventListener('resize', () => {
    einpassen(); kettenNeuZeichnen();
  });
}

einpassen();
haelftenZeichnen();
if (FLAECHE === 'kette') ketteStarten();
if (FLAECHE === 'buendel'){
  document.getElementById('raster').style.display = 'none';
  const knB = document.createElement('button');
  knB.id = 'buendelrunde'; knB.textContent = 'Neue Runde';
  knB.onclick = () => {
    buendelBild().then(() => {
      BU.seite = (BU.seite + 1) % BU.seiten;
      loeschenMarken(); buendelLegen();
    });
  };
  document.getElementById('zurueck').after(knB);
  buendelAufbau(); buendelLegen();
  window.addEventListener('resize', () => {
    einpassen(); buendelAufbau(); buendelLegen();
  });
}
if (RASTER && (RASTER.an || RASTER.zwingend) && rasterKnopf){
  rasterKnopf.classList.add('an');
  rasterZeichnen(true);
}
rasterBeschriften();
window.addEventListener('resize', () => {
  einpassen();
  haelftenZeichnen();
  rasterZeichnen(rasterKnopf.classList.contains('an'));
});
if (FLAECHE === 'tisch' || FLAECHE === 'runden'){
  // Die Sortierkarten liegen von Anfang an auf dem Tisch, wie im
  // Klassenzimmer. Links bleibt nur die Ablage fuer die Bausteine.
  //
  // FEHLERBEHOBEN (2026-08-21): Hier stand setTimeout(…, 60). Solange
  // die Buehne eine feste Hoehe hatte, reichte das - sie kannte ihre
  // Groesse sofort. Seit sie den Rest der Seite bekommt (Flex), steht
  // die Hoehe nach 60 ms noch nicht fest: auslegen() rechnete mit null
  // und legte ALLE 23 Karten punktgenau uebereinander. Gemessen: 23 von
  // 23 auf derselben Stelle, x 25, y 173.
  //
  // Statt einer laengeren Frist - die waere nur ein anderer geratener
  // Wert - wird auf das Ereignis gewartet, das es wirklich sagt.
  const legen = () => { auslegen(); meldung.textContent = ''; };
  const start = () => requestAnimationFrame(legen);
  if (document.readyState === 'complete') start();
  else window.addEventListener('load', start);
}
