/* ---------- Grad und Runde waehlt die GRUPPE -----------------------
   NEU (2026-09-13, Rikes Auftrag): Bisher stellte die Lehrperson vor dem
   Erzeugen ein, welcher Kartensatz erscheint. Das ist eine
   Vorbereitungseinstellung und keine Bedienung waehrend der Arbeit -
   genau die Unterscheidung, die in AUFTRAGSLISTE_sort.md unter B2 steht.

   Jetzt liegen ALLE Saetze in der Seite. Traegt eine Karte data-satz in
   der Form "grad|nummer", erscheint oben eine Gradwahl und «Neue
   Runde». Das gilt fuer JEDE Flaechenform, nicht nur fuer die Reihe.

   Beim Rundenwechsel wird der Stand als Bild gesichert - sonst waere die
   Runde weg, bevor jemand sie angeschaut hat (agent/04: «Beim
   Rundenwechsel automatisch ein Bild sichern»).

   Die Bezeichnungen nennen die Zahlengroesse und bewerten nicht. «Klein»
   ist nicht die leichte Fassung: Dort liegen die vollstaendigen Reihen
   und damit die Nullkarten. */
/* Ein Knopf, der nichts tut, gehoert weg - nicht gestumpft, nicht mit
   einer Meldung versehen. Bei der Reihe richtet sich die Kartengroesse
   nach den Feldern, also gibt es hier nichts zu zoomen. Zum Lesen
   genuegt das Antippen einer einzelnen Karte. */
if (FLAECHE === 'reihe' && RASTER){
  ['kleiner', 'groesser'].forEach(id => {
    const b = document.getElementById(id);
    if (b) b.style.display = 'none';
  });
  const tr = document.querySelector('.leiste .trenner');
  if (tr) tr.style.display = 'none';
}

const SATZKARTEN = karten.filter(k => k.dataset.satz);
if (SATZKARTEN.length){
  const schluessel = [];
  SATZKARTEN.forEach(k => { if (!schluessel.includes(k.dataset.satz))
                              schluessel.push(k.dataset.satz); });
  const grade = [];
  schluessel.forEach(s => { const g = s.split('|')[0];
                            if (!grade.includes(g)) grade.push(g); });
  const NAME = {klein: 'kleine Zahlen', gross: 'grosse Zahlen',
                sehrgross: 'sehr grosse Zahlen'};
  let grad = schluessel[0].split('|')[0], runde = 0;
  const versteck = document.createElement('div');
  versteck.style.display = 'none';
  document.body.appendChild(versteck);

  /* Bild sichern, aber nie darauf haengen bleiben.

     FEHLERBEHOBEN (2026-09-13, beim Ausprobieren gefunden): «Neue Runde»
     und «Aufloesen» warteten auf bild(). Das endet in c.toBlob(), und
     der Rueckruf kommt nicht, wenn der Browser den Download unterbindet -
     auf einem verwalteten Tablet ist das der Regelfall. Dann wechselt
     die Runde NIE, ohne jede Meldung.

     Also: hoechstens drei Sekunden warten, Fehler schlucken, weitermachen.
     Ein verlorenes Bild ist aergerlich, eine tote Flaeche ist schlimmer. */
  async function bildSicher(){
    try {
      await Promise.race([
        bild(true),
        new Promise(f => setTimeout(f, 3000))
      ]);
    } catch (e) { /* Bild konnte nicht gesichert werden - weiter im Text */ }
  }

  function aktiverSatz(){
    const der = schluessel.filter(s => s.split('|')[0] === grad);
    return der[runde % der.length];
  }
  // Karten mit negativem Exponenten sind abschaltbar. Ob eine Klasse
  // sie schon hat, ist eine Lehrplanfrage - deshalb entscheidet es die
  // Lehrperson an der Flaeche und nicht der Generator.
  let negativAn = false;
  const gibtNegativ = SATZKARTEN.some(k => k.dataset.negativ);

  function zeigbar(k, key){
    if (k.dataset.satz !== key) return false;
    return negativAn || !k.dataset.negativ;
  }
  function aktiveKarten(){
    const key = aktiverSatz();
    return SATZKARTEN.filter(k => zeigbar(k, key));
  }

  /* ---------- Die Gegenüberstellung ----------

     NEU (2026-10-12, Rikes Befund und Rikes Idee): «Das Coole wäre
     natürlich, wenn man am Ende die drei Einteilungen gegenüberstellen
     kann und dann sieht, ob man die gleichen passenden Terme hat.»

     Das Problem war, dass jede Runde die vorige löschte. Was die
     Aufgabe trägt - dass dieselben Funktionen in jeder Darstellung
     dieselbe Reihe ergeben -, sah die Gruppe nie nebeneinander.

     WARUM EINE EIGENE ANSICHT und nicht drei Zeilen auf dem Tisch:
     Lägen alle drei offen da, könnte eine Gruppe die zweite Zeile
     unter die erste sortieren, ohne die zweite Darstellung zu lesen -
     sie ordnete dann nach der Karte darüber. Die Frage «wo sieht man
     es am besten?» fiele aus. Hier ist die vorige Reihe erst zu sehen,
     wenn die neue steht: Sie ist Probe, nicht Abkürzung.

     Und sie ist NICHT anfassbar. Die Ansicht liegt über der Fläche,
     zeigt Bilder und sonst nichts; der Tisch darunter bleibt, wie er
     war. Damit kann sie weder das Prüfen noch das Legen stören.

     WAS SIE NICHT SAGT: ob die Reihen übereinstimmen. «In sieben von
     sieben Spalten steht dieselbe Funktion» wäre genau die Einsicht,
     die die Gruppe selbst machen soll (agent/02). Sie stellt
     nebeneinander und schweigt. */
  const LAGEN = {};              // Satzschlüssel -> {Kartencode: Feld}

  function lageSichern(){
    const key = aktiverSatz();
    const lage = {};
    karten.forEach(k => {
      if (k.dataset.satz === key && k._feld !== undefined)
        lage[k.dataset.code] = k._feld;
    });
    if (Object.keys(lage).length) LAGEN[key] = lage;
    if (window.vergleichStand) window.vergleichStand();
  }

  function vergleichbar(){
    return schluessel.filter(sl => sl.split('|')[0] === grad && LAGEN[sl]);
  }

  function vergleichZeigen(){
    lageSichern();
    const sl = vergleichbar();
    if (!sl.length) return;
    const schau = document.createElement('div');
    schau.id = 'vergleichschau';
    const zu = document.createElement('button');
    zu.textContent = 'schliessen';
    zu.className = 'zuknopf';
    zu.onclick = () => schau.remove();
    const kopf = document.createElement('div');
    kopf.className = 'kopf';
    kopf.textContent = grad;
    schau.append(kopf, zu);

    sl.forEach((key, i) => {
      const lage = LAGEN[key];
      const felder = Math.max(0, ...Object.values(lage).map(Number)) + 1;
      const zeile = document.createElement('div');
      zeile.className = 'vzeile';
      const marke = document.createElement('span');
      marke.className = 'vmarke';
      marke.textContent = (RUNDENNAMEN && RUNDENNAMEN[i]) || ('Runde ' + (i + 1));
      zeile.appendChild(marke);
      for (let f = 0; f < felder; f++){
        const zelle = document.createElement('div');
        zelle.className = 'vzelle';
        Object.keys(lage).forEach(code => {
          if (Number(lage[code]) !== f) return;
          const k = karten.find(a => a.dataset.code === code);
          const img = k && k.querySelector('img');
          if (img) zelle.appendChild(img.cloneNode(true));
        });
        zeile.appendChild(zelle);
      }
      schau.appendChild(zeile);
    });
    document.body.appendChild(schau);
  }

  function satzZeigen(){
    const key = aktiverSatz();
    loeschenMarken();
    /* NEU (2026-09-18, Rikes Entscheidung): Die GRUPPENNAMEN gehen mit
       der Runde.

       Der Befund, der dahintersteht: Nach «Neue Runde» blieb der alte
       Name im Feld stehen - feldTitel wurde nie geleert. Zwei Dinge
       waren daran falsch. Erstens verlangt der zweite Durchgang «ein
       Kriterium, das ganz anders ordnet», und die Gruppe schaute dabei
       auf ihre eigene alte Antwort. Zweitens hing der Anregungsknopf
       daran: Er war wach, weil ein Name von vorhin uebrig war, nicht
       weil in DIESER Runde jemand gearbeitet hatte.

       Beides mit einer Regel erledigt, statt mit einer zweiten
       Buchfuehrung neben feldTitel. Verloren geht nichts: Vor jedem
       Rundenwechsel wird das Bild gesichert, und die Karten werden
       ohnehin neu ausgelegt - die Namen gehoeren zu der Sortierung,
       die dabei verschwindet.

       Die Eingabefelder werden gleich mitgeleert: rasterZeichnen()
       laeuft nur, wenn das Raster eingeschaltet ist, und ohne das
       stuenden die alten Namen noch da, waehrend feldTitel schon leer
       waere - Anzeige und Stand wuerden einander widersprechen. */
    feldTitel.length = 0;
    document.querySelectorAll('.rasterfeld input.titel')
            .forEach(e => { e.value = ''; });
    meldung.textContent = '';
    echteRuefung = false;
    reiheTiefe = 0; rasterTiefe = 0;
    SATZKARTEN.forEach(k => {
      if (zeigbar(k, key)){
        k.style.display = '';
        if (k.parentElement !== tisch) tisch.appendChild(k);
        k._heim = tisch;
        k._gelegt = false;
      } else {
        k.style.display = 'none';
        if (k.parentElement !== versteck) versteck.appendChild(k);
      }
    });
    feldAnzahl = RASTER ? RASTER.anzahl : 0;
    einpassen();
    if (RASTER && rasterKnopf && rasterKnopf.classList.contains('an'))
      rasterZeichnen(true);
    auslegen(aktiveKarten());
    knopfStand();
    knopfWirkung();
  }

  // Eingefuegt wird immer direkt nach «Zurueck zum Ursprung», also
  // erscheint das ZULETZT Eingefuegte zuerst. Deshalb erst «Aufloesen»,
  // dann «Neue Runde», dann die Grade rueckwaerts - am Ende steht die
  // sachliche Folge da: klein, gross, sehr gross, Neue Runde, Aufloesen.
  const leiste = document.getElementById('zurueck');
  const knoepfe = {};
  // Die Wahl der Zahlengroesse als EIN Bedienelement.
  const wahl = document.createElement('div');
  wahl.className = 'wahl';
  const marke = document.createElement('span');
  /* Die Beschriftung der Wahl gehoert der VARIANTE, nicht der Vorlage.
     Bis zum 2026-10-12 stand hier fest «Zahlen» - richtig fuer Potenzen,
     wo die Saetze sich in der Zahlengroesse unterscheiden, und falsch
     fuer jede andere Aufgabe, die dieselbe Mechanik braucht. «Lineare
     Funktionen» waehlt hier die DARSTELLUNG. Ohne Angabe bleibt es bei
     «Zahlen», damit Potenzen unveraendert laeuft. */
  marke.className = 'marke'; marke.textContent = WAHLMARKE;
  wahl.appendChild(marke);

  /* «Aufloesen» - und wann es erscheinen darf.
     Es gibt Aufgaben mit genau einer richtigen Loesung (die Reihe, die
     Wertfamilien) und solche ohne (die offene Sortierung). Nur wo es
     eine gibt, kann man sie zeigen.

     ENTSCHEIDUNG (2026-09-13): Der Knopf ist von Anfang an DA, aber
     stumpf - er wirkt erst, wenn die Gruppe mindestens einmal geprueft
     hat. Zwei Gruende: Ein Knopf, der ploetzlich auftaucht, erschreckt
     und wird uebersehen; und die Aufloesung soll etwas kosten, naemlich
     den eigenen Versuch. Wer ohne Prueflauf drueckt, bekommt den
     Hinweis statt der Loesung. */
  const istGeprueft = () => echteRuefung;

  /* Woran man sieht, ob ein Knopf schon wirkt.

     Rikes Einwand (2026-09-13): «Der Pruefknopf ist immer noch da.»
     Er WAR schon gesperrt - er meldete nur, wie viele Karten fehlen -,
     aber man sah es ihm nicht an. Jetzt ist er blass, solange er nicht
     wirkt, und wird kraeftig, sobald alle Karten liegen. Dasselbe fuer
     «Aufloesen», das erst nach dem Pruefen wirkt. */
  function knopfWirkung(){
    const pk = document.getElementById('pruefen');
    // NUR WO ALLE KARTEN IN FELDER MUESSEN. Beim Fundsuchen ist genau
    // das nicht der Fall: Zwei Karten bleiben immer uebrig, und der
    // Knopf waere nie zu druecken gewesen.
    if (pk && RASTER && RASTER.einrasten
        && PRUEFART !== 'fund' && PRUEFART !== 'reihen'){
      const offen = karten.filter(k => k.style.display !== 'none'
                                    && k.dataset.rolle !== 'ablage'
                                    && k._feld === undefined).length;
      // Der Knopf sagt selbst, woran es liegt. Vorher stand das erst
      // nach einem Druck in der Meldezeile - und wer nicht drueckt,
      // erfaehrt nie, warum der Knopf blass ist.
      pk.classList.toggle('stumpf', offen > 0);
      pk.textContent = offen > 0 ? ('Prüfen — noch ' + offen) : 'Prüfen';
      pk.title = offen > 0
        ? 'Erst wenn alle Karten in Feldern liegen'
        : 'Prüft die Reihe';
    }
    if (LOESBAR) aufloesen.classList.toggle('stumpf', !istGeprueft());
  }
  window.knopfWirkung = knopfWirkung;
  const aufloesen = document.createElement('button');
  // «Aufloesen» war missverstaendlich - es klingt nach «wegraeumen».
  // (Rikes Rueckmeldung, 2026-09-13: «was heisst aufloesen, das
  // verstehe ich auch nicht».)
  aufloesen.textContent = 'Lösung zeigen';
  aufloesen.title = 'erst nach dem Prüfen';
  aufloesen.onclick = async () => {
    if (!istGeprueft()){
      meldung.textContent = 'Erst prüfen — dann könnt ihr die Lösung sehen.';
      return;
    }
    await bildSicher();                // eigener Versuch bleibt erhalten
    loesungLegen(aktiveKarten());
    meldung.textContent = 'So wäre es richtig. Euer Versuch ist als Bild gesichert.';
  };
  if (LOESBAR && document.getElementById('pruefen')) leiste.after(aufloesen);

  if (gibtNegativ){
    /* «auch negative» allein sagt nicht, WAS negativ ist.
       (Rikes Einwand, 2026-09-13.) Also dieselbe Bauart wie bei den
       Zahlen: eine benannte Wahl mit zwei Stellungen, bei der beide
       Moeglichkeiten dastehen. Dann muss niemand raten, was der
       Gegenzustand waere. */
    const eg = document.createElement('div');
    eg.className = 'wahl';
    const em = document.createElement('span');
    em.className = 'marke'; em.textContent = 'Exponenten';
    eg.appendChild(em);
    const stellungen = [['nur positive', false], ['auch negative', true]];
    const eknoepfe = [];
    stellungen.forEach(([text, an]) => {
      const b = document.createElement('button');
      b.textContent = text;
      b.onclick = () => {
        negativAn = an;
        eknoepfe.forEach(([bb, aa]) => bb.classList.toggle('an', aa === negativAn));
        reiheTiefe = 0;
        satzZeigen();
      };
      eg.appendChild(b);
      eknoepfe.push([b, an]);
    });
    eknoepfe.forEach(([bb, aa]) => bb.classList.toggle('an', aa === negativAn));
    leiste.after(eg);
  }
  /* NEU (2026-09-17, Rikes Entscheidung): Die Rechenart als Wahl.

     WARUM SIE NICHTS KOSTET: `a · b = c` ist genau dann wahr, wenn
     `c : a = b` wahr ist - es sind dieselben drei Karten. Die
     Divisionsfassung findet also kein neues Tripel und verliert keines.
     Alles, was an den Saetzen eingestellt ist, bleibt gueltig: die Zahl
     der Funde, die Sackgassen, die Packung, der eine Stolperstein.

     WARUM SIE TROTZDEM ETWAS BRINGT: Die Regel dahinter ist eine
     andere - a^m · a^n = a^(m+n) gegen a^m : a^n = a^(m-n).

     DER SATZ BLEIBT STEHEN, wie bei «auch negative» und anders als beim
     Grad-Knopf: kein `runde = 0`. Rikes Begruendung: «Eigentlich waere
     es ja auch eine Erkenntnis, wenn sie am Ende feststellen, hups, wir
     haben genau die gleichen Kaertchen zusammengebaut.» Dass die Karten
     dabei neu durcheinanderfliegen, besorgt `auslegen()` von selbst -
     es mischt die Plaetze bei jedem Aufruf. */
  if (RASTER && RASTER.rechnung){
    const zg = document.createElement('div');
    zg.className = 'wahl';
    const zm = document.createElement('span');
    zm.className = 'marke'; zm.textContent = 'Rechenart';
    zg.appendChild(zm);
    // Beide Stellungen stehen da, wie bei den Exponenten - sonst muesste
    // jemand raten, was der Gegenzustand waere.
    const arten = [['mal', '\u00b7'], ['geteilt durch', ':']];
    const zknoepfe = [];
    arten.forEach(([text, zz]) => {
      const b = document.createElement('button');
      b.textContent = text;
      b.onclick = () => {
        ZEICHEN = zz;
        zknoepfe.forEach(([bb, z2]) => bb.classList.toggle('an', z2 === ZEICHEN));
        satzZeigen();
      };
      zg.appendChild(b);
      zknoepfe.push([b, zz]);
    });
    zknoepfe.forEach(([bb, z2]) => bb.classList.toggle('an', z2 === ZEICHEN));
    leiste.after(zg);
  }
  /* NEU (2026-10-12, Rikes Befund «Reiht sie ein ist so unuebersichtlich»).

     URSACHE, und sie ist eine Anzeigefrage, keine Aufgabenfrage: Die
     Flaeche fuehrt ZWEI Achsen - die Knoepfe oben und die Runden
     darin -, aber nur die erste war benannt. Die zweite stand als
     «Neue Runde (2 von 3)» da. Eine Gruppe sieht damit, DASS sie in
     der zweiten von drei Runden ist, und nirgends, WAS die zweite
     Runde ist. Bei «Potenzen», wo die Runden dasselbe in anderen
     Zahlen sind, geht das; wo sie etwas Verschiedenes sind, geht es
     nicht.

     `rundennamen` benennt sie. Dann steht statt eines Zaehlknopfes
     eine zweite benannte Reihe da, und beide Achsen sind zu lesen.
     Ohne die Angabe bleibt alles, wie es war - «Potenzen» ruehrt das
     nicht an.

     Gesichert wird beim Wechsel wie bisher: Das Bild der Runde geht
     verloren, sobald neu ausgelegt wird, und das gilt fuer den
     benannten Wechsel genauso. */
  const neu = document.createElement('button');
  neu.textContent = 'Neue Runde';
  neu.onclick = async () => {
    // ERST PRUEFEN, DANN WEITER (Rikes Vorgabe, 2026-09-13): «Bevor sie
    // in eine neue Runde gehen, sollen sie ihre Sachen ueberpruefen und
    // noch mal diskutieren.» Der Knopf verweigert nicht - er erinnert
    // einmal. Beim zweiten Druck geht es weiter, auch ungeprueft; eine
    // Gruppe, die abbrechen will, soll das koennen.
    if (LOESBAR && !istGeprueft() && !neu._gewarnt){
      neu._gewarnt = true;
      meldung.textContent = 'Prüft zuerst — dann nochmals drücken.';
      return;
    }
    neu._gewarnt = false;
    await bildSicher();
    runde++; satzZeigen();
  };
  if (!RUNDENNAMEN || !RUNDENNAMEN.length) leiste.after(neu);

  let vergleichknopf = null;
  if (VERGLEICH){
    vergleichknopf = document.createElement('button');
    vergleichknopf.id = 'vergleichen';
    vergleichknopf.textContent = 'Gegenüberstellen';
    vergleichknopf.title = 'legt die Runden dieses Kriteriums nebeneinander';
    vergleichknopf.onclick = vergleichZeigen;
    leiste.after(vergleichknopf);
    // Stumpf, solange nur die laufende Runde vorliegt: Eine einzelne
    // Reihe gegenueberzustellen ergibt nichts.
    window.vergleichStand = () => {
      const n = vergleichbar().length
              + (karten.some(k => k.dataset.satz === aktiverSatz()
                                && k._feld !== undefined) ? 1 : 0);
      vergleichknopf.classList.toggle('stumpf', n < 2);
    };
    window.vergleichStand();
  }

  // Die zweite Achse als benannte Reihe, wenn die Variante sie benennt.
  let rknoepfe = [];
  if (RUNDENNAMEN && RUNDENNAMEN.length){
    const rw = document.createElement('div');
    rw.className = 'wahl';
    const rm = document.createElement('span');
    rm.className = 'marke'; rm.textContent = RUNDENMARKE;
    rw.appendChild(rm);
    RUNDENNAMEN.forEach((name, i) => {
      const b = document.createElement('button');
      b.textContent = name;
      b.onclick = async () => {
        if (i === runde) return;
        lageSichern();              // sonst ist die Runde weg, bevor sie
        await bildSicher();         // sich vergleichen laesst
        runde = i;
        satzZeigen();
      };
      rw.appendChild(b);
      rknoepfe.push(b);
    });
    leiste.after(rw);
  }

  /* ---------- Die Anregung ----------

     NEU (2026-09-18, Rikes Entscheidung zu Maurus' «Evtl. zu offen?»
     an der offenen Sortierung). Die Offenheit bleibt; wer auf gar
     keine Idee kommt, bekommt einen Anstoss.

     Drei Dinge, die der Knopf ABSICHTLICH nicht tut:

     1. Er NENNT das Kriterium nicht. Ein Wort waere schon die Antwort
        (agent/13). Er zeigt zwei Karten, die zusammenpassen, und
        fragt nach dem Namen der Gruppe - das Benennen ist der Ertrag
        der Aufgabe, nicht die Zuordnung.
     2. Er VERSCHIEBT nichts. Eine Gruppe, die schon halb sortiert hat,
        darf ihre Haufen nicht verlieren. Er markiert nur.
     3. Er ZAEHLT nicht. Es gibt ein Paar je Satz und keine Anzeige
        «1 von 3» - eine Zahl luede dazu ein, alle abzuholen.

     ER SCHLIEF BIS ZUM 2026-09-20, bis mindestens eine Gruppe einen
     Namen trug - «sonst holt man die Pointe in Minute zwei ab, ohne
     gesucht zu haben». Rike hat das aufgehoben: «das macht ja keinen
     Sinn hier. Wenn man schon einen Namen gefunden hat...»

     Sie hat recht, und der Einwand trifft die Sperre an der Wurzel: Die
     Hilfe hing an genau dem, was sie erst hervorbringen soll. Wer schon
     eine Gruppe benannt hatte, brauchte den Fingerzeig nicht mehr; wer
     feststeckte, kam nicht an ihn heran. Der Satz des Knopfes passt
     ohne einen einzigen Namen sogar besser - er laedt zum ERSTEN ein.

     Die alte Sorge bleibt unbeantwortet, ist aber die kleinere: Eine
     Gruppe kann jetzt zuerst druecken. Sie sieht dann zwei Karten und
     hat immer noch keinen Namen. */
  let anregung = null;
  if (ANREGUNG){
    anregung = document.createElement('button');
    anregung.id = 'anregung';
    anregung.textContent = ANREGUNGTEXTE.knopf;
    function anregungZeigen(){
      const paar = ANREGUNG[aktiverSatz()] || [];
      const gezeigt = paar
        .map(c => karten.find(k => k.dataset.code === c))
        .filter(k => k && k.style.display !== 'none');
      // Ein Paar, dessen Karten nicht auf dem Tisch liegen, waere ein
      // Fingerzeig ins Leere. Lieber nichts sagen als daneben zeigen.
      if (gezeigt.length < 2) return false;
      gezeigt.forEach(k => {
        k.classList.add('anregung');
        /* NEU (2026-09-18, beim Messen gesehen): Die gezeigte Karte lag
           halb UNTER einer anderen - der Rahmen war da, die Karte nicht
           zu lesen. Sie kommt deshalb nach VORN, aber sie bleibt, wo sie
           liegt. Das ist kein Verschieben: Ort und Nachbarschaft aendern
           sich nicht, nur die Lage im Stapel. Eine Gruppe, die schon
           sortiert hat, verliert dadurch nichts. */
        k.style.zIndex = ++z;
      });
      return true;
    }
    anregung.onclick = () => {
      // Zweiter Druck nimmt sie wieder weg. Die Anregung ist ein
      // Hinweis, kein Zustand, in dem die Flaeche steckenbleibt.
      const liegt = karten.some(k => k.classList.contains('anregung'));
      karten.forEach(k => k.classList.remove('anregung'));
      if (liegt){ meldung.textContent = ''; return; }
      meldung.textContent = anregungZeigen() ? ANREGUNGTEXTE.text : '';
    };
    leiste.after(anregung);
  }
  /* Bis zum 2026-09-20 stand hier `anregungStand()`: Es machte den Knopf
     blass, solange keine Gruppe einen Namen trug, und fuenf Stellen
     riefen es. Mit der Sperre faellt auch die Buchhaltung dahinter weg -
     ein halb gebauter Sonderfall ist schlimmer als keiner
     (Regelwerkskandidat 16). */
  if (anregung) anregung.title = ANREGUNGTEXTE.text;

  const KURZ = {klein: 'klein', gross: 'gross', sehrgross: 'sehr gross'};
  grade.forEach(g => {
    const b = document.createElement('button');
    b.textContent = KURZ[g] || g;
    b.title = NAME[g] || g;
    b.onclick = () => { lageSichern(); grad = g; runde = 0; satzZeigen(); };
    wahl.appendChild(b);
    knoepfe[g] = b;
  });
  leiste.after(wahl);

  function knopfStand(){
    if (window.vergleichStand) window.vergleichStand();
    Object.entries(knoepfe).forEach(([g, b]) => b.classList.toggle('an', g === grad));
    const der = schluessel.filter(s => s.split('|')[0] === grad);
    neu.textContent = der.length > 1
      ? 'Neue Runde (' + ((runde % der.length) + 1) + ' von ' + der.length + ')'
      : 'Neue Runde';
    rknoepfe.forEach((b, i) => b.classList.toggle('an', i === (runde % der.length)));
  }
  // Zweimal: Im ersten Bild steht die Hoehe der Flaeche noch nicht fest
  // (Flex), im zweiten schon. Ohne den zweiten Lauf sind die Felder
  // fuer die endgueltige Hoehe falsch gerechnet.
  const ersteLage = () => {
    satzZeigen();
    requestAnimationFrame(satzZeigen);
  };
  if (document.readyState === 'complete') requestAnimationFrame(ersteLage);
  else window.addEventListener('load', () => requestAnimationFrame(ersteLage));
}

if (RASTER && (RASTER.an || RASTER.zwingend) && rasterKnopf){
  rasterKnopf.classList.add('an');
  rasterZeichnen(true);
}
rasterBeschriften();
window.addEventListener('resize', () => {
  einpassen();
  haelftenZeichnen();
  rasterZeichnen(rasterKnopf.classList.contains('an'));
});
if (FLAECHE === 'tisch' || FLAECHE === 'runden' || FLAECHE === 'reihe'){
  // Die Sortierkarten liegen von Anfang an auf dem Tisch, wie im
  // Klassenzimmer. Links bleibt nur die Ablage fuer die Bausteine.
  //
  // FEHLERBEHOBEN (2026-08-21): Hier stand setTimeout(…, 60). Solange
  // die Buehne eine feste Hoehe hatte, reichte das - sie kannte ihre
  // Groesse sofort. Seit sie den Rest der Seite bekommt (Flex), steht
  // die Hoehe nach 60 ms noch nicht fest: auslegen() rechnete mit null
  // und legte ALLE 23 Karten punktgenau uebereinander. Gemessen: 23 von
  // 23 auf derselben Stelle, x 25, y 173.
  //
  // Statt einer laengeren Frist - die waere nur ein anderer geratener
  // Wert - wird auf das Ereignis gewartet, das es wirklich sagt.
  // FEHLERBEHOBEN (2026-09-13, Rike beim Ausprobieren): Liegen mehrere
  // Saetze in der Datei, legt satzZeigen() die Karten aus - und dieser
  // Block tat es GLEICHZEITIG. Zwei Auslegungen im selben Bild, und die
  // zweite rechnete mit Massen, die die erste gerade geaendert hatte.
  // Ergebnis: Die Karten sassen schief, bis man eine anfasste - dann
  // rechnete das Einrasten alles neu, und ploetzlich passte es.
  //
  // Wer die Saetze fuehrt, legt auch aus. Dieser Block haelt sich dann
  // heraus.
  // Kein `return` hier - dieser Block steht nicht in einer Funktion,
  // und ein `return` auf oberster Ebene ist ein Syntaxfehler. Dann
  // laedt das ganze Skript nicht mehr, und die Flaeche bleibt tot.
  if (!karten.some(k => k.dataset.satz)){
    const legen = () => { auslegen(); meldung.textContent = ''; };
    const start = () => requestAnimationFrame(legen);
    if (document.readyState === 'complete') start();
    else window.addEventListener('load', start);
  }
}

/* ---------- Die Beispielschau ----------

   Ein Beispiel gibt es nur, wo die Variante eines mitbringt; sonst
   steht hier nichts und der Knopf existiert gar nicht erst. */
(function(){
  const knopf  = document.getElementById('beispielknopf');
  const inhalt = document.getElementById('beispielinhalt');
  if (!knopf || !inhalt) return;

  let offen = null;
  function zu(){ if (offen){ offen.remove(); offen = null; } }

  function zeigen(){
    if (offen) return;
    const schau = document.createElement('div');
    schau.id = 'beispielschau';
    const kopf = document.createElement('div');
    kopf.className = 'kopf';
    kopf.textContent = knopf.dataset.marke || 'Beispiel';
    const zuk = document.createElement('button');
    zuk.className = 'zuknopf'; zuk.type = 'button';
    zuk.textContent = 'schliessen';
    zuk.onclick = zu;
    /* Der Auftrag gehoert mit hinein. Die Schau geht ungefragt auf und
       deckt die Kopfzeile zu - ohne den Auftrag stuende das Beispiel
       dann vor einer Frage, die man noch gar nicht gelesen hat. */
    const auf = document.querySelector('header .auftrag');
    if (auf){
      const z = document.createElement('p');
      z.className = 'auftragzeile';
      z.textContent = auf.textContent;
      schau.appendChild(z);
    }
    schau.append(kopf, zuk);
    // Der Inhalt wird GEKLONT, nicht verschoben: Wer die Schau zumacht
    // und wieder aufmacht, soll dasselbe sehen.
    [...inhalt.children].forEach(k => schau.appendChild(k.cloneNode(true)));
    document.body.appendChild(schau);
    offen = schau;
    zuk.focus();
  }

  knopf.onclick = zeigen;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') zu(); });

  /* Einmal von selbst auf, beim Oeffnen der Flaeche. Rikes Auftrag war
     «ein Beispiel am Anfang, damit die SuS sehen, worauf es hinausläuft»
     - das trifft nur zu, wenn es ungefragt dasteht. Danach holt es, wer
     es nochmals braucht. */
  if (document.readyState === 'complete') zeigen();
  else window.addEventListener('load', zeigen);
})();
