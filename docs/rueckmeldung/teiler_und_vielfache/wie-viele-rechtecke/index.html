<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wie viele Rechtecke hat eine Zahl?</title>

<!-- Schriften liegen bei, nichts wird nachgeladen. -->
<style>
@font-face{font-family:'Fira Sans';font-style:normal;font-weight:400;src:url('../../../schriften/FiraSans-Regular.woff') format('woff')}
@font-face{font-family:'Fira Sans';font-style:italic;font-weight:400;src:url('../../../schriften/FiraSans-Italic.woff') format('woff')}
@font-face{font-family:'Fira Sans';font-style:normal;font-weight:600;src:url('../../../schriften/FiraSans-SemiBold.woff') format('woff')}
@font-face{font-family:'Fira Sans';font-style:normal;font-weight:700;src:url('../../../schriften/FiraSans-Bold.woff') format('woff')}
@font-face{font-family:'Patrick Hand';font-style:normal;font-weight:400;src:url('../../../schriften/PatrickHand-Regular.woff') format('woff')}
</style>


<!-- ============================ Gestaltung ============================ -->
<style>
/* Die Farben und Schriften sind dieselben wie auf den Projektseiten.
   Wer sie dort ändert, ändert sie hier mit - deshalb stehen sie
   vollständig in diesem einen Block und nirgendwo sonst. Auch das
   JavaScript weiter unten liest von hier (siehe die Funktion `farbe`);
   fest verdrahtete Farbwerte gibt es in dieser Datei keine mehr.

   #d3a03f setzt die Themenfarbe: Ähnlichkeit lila, Faktorisieren rot,
   und so weiter wie auf der Klassenseite. Die Fläche trägt damit die
   Farbe der Tür, durch die man gekommen ist. */
:root{
  --w:170px; --h:143px;

  /* Zwei Werte weichen bewusst von den Projektseiten ab: Der Grund ist
     eine Spur tiefer und die Fläche eine Spur heller, damit sich Tisch,
     Fächer und Knöpfe deutlicher abheben. Auf einer Textseite braucht es
     das nicht - hier liegt Arbeitsfläche auf Hintergrund, und die Kante
     dazwischen muss man sehen. Der Unterschied wächst damit von 4 % auf
     9 %; das ist der «Tick», nicht mehr. Projektwerte: #fbf8f3 / #fffdf9. */
  --papier:#f8f4ec; --creme:#f6ecdf; --karte:#fffefb;
  --tinte:#2d2924;  --tinte-hell:#6c6357;
  --braun:#935100;  --braun-hell:#b07c3c;
  --linie:#e4d9c7;  --fliess:#463f36;
  --akzent:#d3a03f;

  --druck:'Fira Sans','Segoe UI',sans-serif;
  --sans:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --hand:'Patrick Hand',"Bradley Hand","Segoe Print",cursive;

  /* Für das JavaScript. Nur lesen, nicht anwenden. */
  --feld-rand:#c9bda6;
  --feld-fest:#935100;
  --feld-fuell:rgba(147,81,0,.045);
  --richtig:#4f7a3a;
  --falsch:#b4474f;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{background:var(--papier);color:var(--tinte);overflow:hidden;
     font-family:var(--druck);font-size:17px;
     display:flex;flex-direction:column;}
/* Kopf und Leiste nehmen, was sie brauchen; die Buehne bekommt den Rest.
   Ohne flex-shrink:0 wuerde ein langer Auftrag gestaucht statt der
   Buehne Platz zu lassen. */
body > header, body > .leiste{flex:0 0 auto;}

/* ---- Kopf: wie .kopfklein auf den Projektseiten ------------------- */
header{padding:16px 22px 6px;}
/* Patrick Hand gibt es nur in einem Schnitt. Überall, wo sie steht,
   muss font-weight:400 stehen - sonst rechnet der Browser einen fetten
   Schnitt aus, und der sieht aus wie mit dem Filzstift nachgezogen.
   Dafür darf sie einen Tick grösser sein: die Versalhöhe liegt tiefer
   als bei Fira Sans, sonst wirkt sie daneben zu klein. */
h1{font-family:var(--hand);font-weight:400;font-size:1.75rem;line-height:1.2;
   margin:0 0 5px;color:var(--tinte);}
p.auftrag{font-size:.95rem;color:var(--fliess);margin:0;max-width:95ch;
          line-height:1.5;}

/* ---- Leiste ------------------------------------------------------- */
.leiste{display:flex;flex-wrap:wrap;gap:7px;align-items:center;
        padding:12px 22px 13px;}
/* Auch die Knöpfe. Damit sie trotzdem als Knöpfe zu erkennen sind,
   bleiben Rahmen und Fläche kräftig - die Schrift allein trägt bei einer
   Handschrift die Bedienbarkeit nicht. Und sie braucht mehr Grösse als
   Source Sans, sonst wird sie dünn. */
button{font-family:var(--hand);font-size:1.08rem;font-weight:400;
       padding:5px 14px 6px;border:1px solid var(--linie);border-radius:0;
       background:var(--karte);color:var(--tinte);cursor:pointer;
       line-height:1.3;
       transition:background .2s ease,border-color .2s ease;}
button:hover{background:var(--creme);border-color:var(--braun-hell);}
button:focus-visible{outline:2px solid var(--braun);outline-offset:2px;}
button.an{background:var(--braun);color:#fff;border-color:var(--braun);}
/* Ein Knopf, der da ist, aber noch nicht wirkt. Nicht `disabled`: Ein
   abgeschalteter Knopf sagt beim Druck gar nichts, und die Gruppe raet,
   warum. So bleibt er anklickbar und erklaert sich selbst. */
button.stumpf{opacity:.45;}

/* Der Beispielstreifen (2026-10-13, Rikes Auftrag «damit die SuS sehen,
   worauf es hinausläuft»). Bis dahin stand das Beispiel als SATZ im
   Auftrag - richtig, aber man muss es lesen und sich vorstellen. Hier
   steht es als BILD.

   GEAENDERT (2026-10-13, Rike): nicht mehr als Streifen unter dem
   Auftrag, sondern als SCHAU - sie geht beim Oeffnen der Flaeche einmal
   von selbst auf und laesst sich jederzeit wieder holen. Der Streifen
   stand dauernd da und nahm der Flaeche eine Zeile; gesehen werden muss
   das Beispiel aber nur am Anfang. Gross genug zum Hinschauen ist es
   jetzt auch: 132px statt 62px.

   Sie sieht bewusst anders aus als der Tisch. Sonst sucht eine Gruppe
   die Beispielkarten im eigenen Satz - und findet sie nicht, denn sie
   gehören nicht dazu. Anfassen kann man sie nicht. */
.beispielknopf{margin:10px 0 0;padding:7px 13px;border-radius:7px;
  font:inherit;font-size:.82rem;letter-spacing:.04em;cursor:pointer;
  color:var(--fliess);
  background:color-mix(in srgb, var(--akzent) 7%, transparent);
  border:1px dashed color-mix(in srgb, var(--akzent) 45%, transparent)}
.beispielknopf:hover{background:color-mix(in srgb, var(--akzent) 14%, transparent)}

/* Die Beispielschau liegt UEBER der Flaeche, wie die Gegenueberstellung,
   und aus demselben Grund undurchsichtig: Was durchscheint, wird
   angeklickt. */
#beispielschau{position:fixed; inset:0; z-index:45; overflow:auto;
  background:#faf7f1; padding:26px 18px 30px;
  display:flex; flex-direction:column; align-items:center; gap:14px;}
#beispielschau .kopf{font-size:19px; color:#333; letter-spacing:.01em;
  text-align:center;}
#beispielschau .karten{display:flex; align-items:center; gap:10px;
  flex-wrap:wrap; justify-content:center;}
#beispielschau img{height:132px; width:auto; display:block;
  pointer-events:none; border-radius:5px;}
#beispielschau .dazu{font-size:.95rem; color:var(--fliess);
  max-width:46ch; text-align:center;}
#beispielschau .auftragzeile{margin:0; font-size:.9rem; color:var(--fliess);
  opacity:.8; max-width:56ch; text-align:center;}
#beispielschau .zuknopf{position:absolute; top:14px; right:16px;}
@media (max-width:620px){ #beispielschau img{height:94px;} }

/* Die Gegenueberstellung. Sie liegt UEBER der Flaeche und ist nicht
   anfassbar - der Tisch darunter bleibt, wie er war. */
#vergleichschau{position:fixed; inset:0; z-index:40; overflow:auto;
  /* Undurchsichtig: Durchscheinende Knoepfe der Flaeche darunter
     laden zum Klicken ein, und geklickt wird dann die Ansicht. */
  background:#faf7f1; padding:18px 16px 28px;
  display:flex; flex-direction:column; gap:10px;}
#vergleichschau .kopf{font-size:19px; color:#333; letter-spacing:.01em;}
#vergleichschau .zuknopf{position:absolute; top:14px; right:16px;}
#vergleichschau .vzeile{display:flex; align-items:flex-start; gap:6px;}
#vergleichschau .vmarke{flex:0 0 7.2em; font-size:12px; color:#777;
  padding-top:6px;}
#vergleichschau .vzelle{flex:1 1 0; min-width:0; display:flex;
  flex-direction:column; gap:3px; padding:4px;
  border:1px dashed #d8cfbe; border-radius:6px;}
#vergleichschau .vzelle img{width:100%; display:block;}

/* Eine WAHL ist ein Bedienelement, nicht drei.
   (Rikes Einwand, 2026-09-13: «sehr sehr unübersichtlich mit vielen
   Buttons».) Die drei Zahlengrössen gehören zusammen und sehen jetzt
   auch so aus: ein Rahmen, innen die drei Möglichkeiten ohne eigene
   Rahmen. Das liest sich als ein Knopf mit drei Stellungen. */
.wahl{display:inline-flex;align-items:stretch;border:1px solid var(--linie);
      border-radius:0;overflow:hidden;}
.wahl > .marke{font-family:var(--druck);font-size:.78rem;letter-spacing:.04em;
      text-transform:uppercase;color:var(--tinte-hell);align-self:center;
      padding:0 9px 0 11px;white-space:nowrap;}
.wahl button{border:none;border-left:1px solid var(--linie);border-radius:0;}
.wahl button:first-of-type{border-left:1px solid var(--linie);}
.trenner{width:1px;height:20px;background:var(--linie);margin:0 4px;}
#meldung{font-family:var(--hand);font-size:1.04rem;color:var(--braun);
         margin-left:8px;}

/* ---- Bühne -------------------------------------------------------- */
/* FEHLERBEHOBEN (2026-08-21, Rikes Befund «das ist zu gross gebaut, die
   Kaertchen liegen teilweise unten und man kann sie nicht sehen»):
   Hier stand height:calc(100% - 136px) - eine feste Annahme darueber,
   wie hoch Kopf und Leiste zusammen sind. Bei «Der Umweg» ist der
   Auftrag vier Zeilen lang; gemessen wurden 152 + 90 = 242 px statt
   136. Die Buehne ragte dadurch 106 px unter den Koerper hinaus, der
   Tisch endete bei y 806 in einem 720 px hohen Fenster, und die
   unterste Karte lag 76 px unter dem sichtbaren Rand.
   Der Koerper ist jetzt eine Flex-Spalte: Kopf und Leiste nehmen, was
   sie brauchen, die Buehne bekommt den Rest - ohne Zahl im Quelltext.
   min-height:0 ist noetig, damit die Buehne kleiner werden darf als
   ihr Inhalt; sonst waechst sie wieder ueber den Rand. */
#buehne{display:flex;gap:16px;padding:0 22px 20px;flex:1 1 auto;min-height:0;}
.saeule{display:flex;flex-direction:column;gap:16px;
        width:calc(var(--w) + 42px);flex:0 0 auto;}
.fach{background:var(--karte);border:1px solid var(--linie);
      border-top:4px solid var(--akzent);border-radius:0;
      display:flex;flex-direction:column;min-height:0;flex:1 1 0;}
.fach h2{font-family:var(--hand);font-weight:400;font-size:1.12rem;
         letter-spacing:0;text-transform:none;color:var(--tinte-hell);
         margin:0;padding:10px 13px 6px;}
.stapel{overflow-y:auto;overflow-x:hidden;padding:0 13px 13px;
        display:flex;flex-direction:column;gap:8px;align-items:center;}
#tisch{flex:1 1 auto;background:var(--karte);border:1px solid var(--linie);
       border-top:4px solid var(--akzent);border-radius:0;
       position:relative;overflow:auto;}
#brett{position:absolute;left:0;top:0;pointer-events:none;}
#teiler{position:absolute;top:0;bottom:0;
        border-left:1.5px dashed var(--linie);pointer-events:none;}
/* Quer geteilter Tisch: Brett oben, Vorrat unten. Die Linie laeuft
   ueber die ganze Breite; `top` setzt das JavaScript. */
#teiler_quer{position:absolute;left:0;right:0;
        border-top:1.5px dashed var(--linie);pointer-events:none;}
.haelfte{position:absolute;top:8px;font-family:var(--hand);font-weight:400;
  font-size:1.1rem;color:var(--tinte-hell);letter-spacing:0;
  text-transform:none;pointer-events:none;}

/* Die Felder sind Struktur der Aufgabe, nicht Schmuck: durchgezogen,
   wenn sie von Anfang an dazugehören, gestrichelt, wenn die Lehrperson
   sie zugeschaltet hat. Die Klasse `fest` setzt das JavaScript. */
.rasterfeld{position:absolute;border:1.5px dashed var(--feld-rand);
  border-radius:0;background:transparent;pointer-events:none;
  display:flex;align-items:flex-start;justify-content:center;}
.rasterfeld.fest{border-style:solid;border-color:var(--akzent);
  background:var(--feld-fuell);}
.rasterfeld span{font-family:var(--hand);font-size:1.02rem;
  color:var(--tinte-hell);margin-top:5px;}

/* Rechenfeld: drei Plaetze, dazwischen · und =. Die Zeichen stehen fest
   im Feld, nicht auf den Karten - so sieht man, welche zwei Karten
   multipliziert werden und welche das Ergebnis ist. */
.rasterfeld span.rechenzeichen{position:absolute;margin-top:0;
  text-align:center;font-family:var(--hand);color:var(--tinte-hell);
  pointer-events:none;}

/* Frei beschriftbares Feld: Die Gruppe schreibt selbst hin, wonach sie
   geordnet hat. Das Feld selbst laesst Klicks durch (die Karten liegen
   darunter), die Schreiblinie nimmt sie an. */
.rasterfeld input.titel{font-family:var(--hand);font-size:1.02rem;
  color:var(--tinte);margin-top:5px;width:calc(100% - 18px);
  border:none;border-bottom:1.5px solid var(--feld-rand);
  background:transparent;text-align:center;padding:1px 0 2px;
  pointer-events:auto;}
.rasterfeld input.titel::placeholder{color:var(--tinte-hell);opacity:.75;}

/* Die Vorratsfelder im unsortierten Teil - je Kartensorte eines.
   Bewusst schwaecher als die Rasterfelder rechts: Das hier ist die
   Ablage, aus der geholt wird, nicht das Ergebnis, das entsteht. Der
   Name steht oben LINKS und nicht mittig, damit er nicht mit den
   Feldbeschriftungen der Ergebnisseite verwechselt wird. */
.vorratsfeld{position:absolute;border:1.5px dotted var(--feld-rand);
  border-radius:0;background:transparent;pointer-events:none;
  display:flex;align-items:flex-start;justify-content:flex-start;}
.vorratsfeld span{font-family:var(--hand);font-size:.94rem;
  color:var(--tinte-hell);margin:3px 0 0 8px;letter-spacing:.02em;}
.rasterfeld input.titel:focus{outline:none;border-bottom-color:var(--akzent);}

/* Das Feld, das ein weiteres Feld anlegt. Es steht dort, wo das nächste
   Feld entstehen wird - ein Knopf in der Leiste sagt nicht, was er tut. */
.einfuegen{position:absolute;border-radius:4px;cursor:pointer;
   background:transparent;transition:background .15s ease;z-index:2;}
.einfuegen:hover{background:var(--creme);}
.einfuegen span{font-family:var(--hand);color:var(--tinte-hell);
   font-size:1.0rem;opacity:0;transition:opacity .15s ease;
   position:absolute;left:50%;top:6px;transform:translateX(-50%);}
.einfuegen:hover span{opacity:1;color:var(--akzent);}
.rasterfeld.neu{border-style:dashed;border-color:var(--feld-rand);
  opacity:.55;align-items:center;cursor:pointer;pointer-events:auto;
  transition:opacity .12s;}
.rasterfeld.neu:hover{opacity:1;border-color:var(--akzent);}
.rasterfeld.neu span{font-family:var(--hand);font-size:1.02rem;
  color:var(--tinte-hell);margin-top:0;text-align:center;padding:0 6px;}
.rasterfeld.neu:hover span{color:var(--akzent);}

/* Das Schreibfeld auf dem direkten Pfeil der Kette. Es sieht aus wie die
   Faktorfelder daneben, nur wird hineingeschrieben statt hineingelegt. */
.direktfeld{font-family:var(--hand);font-size:1.16rem;color:var(--tinte);
  border:1.5px dashed var(--akzent);border-radius:9px;background:var(--karte);
  text-align:center;padding:0 6px;}
.direktfeld::placeholder{color:var(--akzent);opacity:.55;font-size:.86em;}
.direktfeld:focus{outline:none;border-style:solid;}

/* ---- Karten ------------------------------------------------------- */
.karte{width:var(--w);height:var(--h);border-radius:0;background:transparent;
       filter:drop-shadow(0 1px 2px rgba(90,70,35,.22));
       cursor:grab;touch-action:none;user-select:none;flex:0 0 auto;}
#tisch .karte{position:absolute;left:0;top:0;}
.karte img{width:100%;height:100%;display:block;pointer-events:none;
           -webkit-user-drag:none;}
.karte.aktiv{cursor:grabbing;will-change:transform;
             filter:drop-shadow(0 12px 26px rgba(90,70,35,.30));}
.karte.ablage{width:calc(var(--w) * var(--abl));
              height:calc(var(--h) * var(--abl));}
.karte.rastet{filter:drop-shadow(0 0 0 var(--akzent))
              drop-shadow(0 1px 3px rgba(90,70,35,.24));}
.karte.falsch{outline:3px solid var(--falsch);outline-offset:2px;}
.karte.richtig{outline:3px solid var(--richtig);outline-offset:2px;}
/* Die Anregung markiert, sie urteilt nicht: GESTRICHELT und in der
   Akzentfarbe, also weder gruen noch rot. Dieselbe Sprache wie in
   Kapitel 2, wo die Vorratskarte beim Pruefen einen gestrichelten
   Rahmen bekommt - ein Fingerzeig, kein Befund. */
.karte.anregung{outline:3px dashed var(--akzent);outline-offset:3px;}
.karte:focus-visible{outline:2px solid var(--braun);outline-offset:3px;}

@media print{
  body{overflow:visible;background:#fff;}
  .leiste,.fach h2{display:none;}
  #buehne{display:block;height:auto;}
  .fach,#tisch{border:none;}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>

function feldpunkt(i){

  const bx = parseFloat(brett.style.left) || 0, by = parseFloat(brett.style.top) || 0;

    if (e.pointerType === 'mouse') return;

                 Math.abs(e.clientY - (k._tippY || 0)) > 5;
    if (weit) return;                       // war ein Ziehen, kein Tippen
    if (angetippt === k){ tippLoesen(); return; }
    tippLoesen();
    k._z = k.style.zIndex;
    angetippt = k;
    lupe(k, true);
  });
}

// Tippen neben die Karten loest die Vergroesserung wieder.
tisch.addEventListener('pointerdown', e => {
  if (!e.target.closest('.karte')) tippLoesen();
});

function einrasten(k){
  if (FLAECHE === 'buendel') return buendelEinrasten(k);
  if (FLAECHE === 'kette') return kettenEinrasten(k);
  if (FLAECHE === 'reihe') return reiheEinrasten(k);
  if (RASTER && RASTER.einrasten) return rasterEinrasten(k);
  if (!BRETT || !BRETT.felder.length || k.dataset.rolle !== 'ablage') return false;
  const w = breite * ABL, h = breite * 0.844 * ABL;
  const mx = k._x + w / 2, my = k._y + h / 2;
  const n = (FLAECHE === 'runden') ? aktiveFelder : BRETT.felder.length;
  for (let i = 0; i < n; i++){
    const [fx, fy] = feldpunkt(i);
    if (Math.abs(mx - (fx + w / 2)) < w * 0.9 &&
        Math.abs(my - (fy + h / 2)) < h * 1.1){
      const belegt = karten.find(a => a !== k && a._feld === i);
      if (belegt){ belegt._feld = undefined; belegt.classList.remove('rastet'); }
      k._feld = i; k.classList.add('rastet'); k._rot = 0;
      setzen(k, fx, fy);
      return true;
    }
  }
  k._feld = undefined; k.classList.remove('rastet');
  return false;
}
function zoom(d){
  // Bei der Reihe bestimmt die ZAHL DER FELDER die Kartenbreite: Alle
  // Felder stehen in einer Zeile, und die Karte muss hineinpassen. Ein
  // Zoom wuerde die Karten aus ihren Feldern treiben. Die Lupe auf der
  // einzelnen Karte (Antippen) bleibt - zum Lesen genuegt sie.
  if (FLAECHE === 'reihe' && RASTER) return;   // Knoepfe sind ausgeblendet
  breite = Math.max(50, Math.min(320, breite + d));
  breiteVonHand = true;
  masse();
  // Die Rasterfelder sind Vielfache der Kartenbreite - sie muessen
  // mitwachsen, sonst passen die Karten irgendwann nicht mehr hinein.
  haelftenZeichnen();
  rasterZeichnen(rasterKnopf && rasterKnopf.classList.contains('an'));
  rasterBeschriften();
  // FEHLERBEHOBEN (2026-09-14, Maurus' Rueckmeldung zu Potenzen V1, V2,
  // V5, V6: «Beim Vergroessern sind die Kaertchen nicht mehr am
  // richtigen Ort»): Das Raster wurde neu gezeichnet, die eingerasteten
  // Karten aber nicht mit umgesetzt. Sie blieben auf ihren alten
  // Bildpunkten liegen, waehrend ihr Feld woanders hinwanderte.
  //
  // Gemessen an «Wonach kann man diese Karten ordnen?»: Bei breite 156
  // brechen die vier Gruppenfelder aus EINER Zeile in eine SPALTE um
  // (Feld 1 auf y 378, Feld 2 auf 731, Feld 3 auf 1083). Die vier
  // Karten standen weiter alle auf y 122 - drei von vier lagen ausserhalb
  // der Gruppe, zu der `_feld` sie weiterhin zaehlte.
  //
  // Dieselbe Lehre steht schon bei «Gruppe hinzufuegen» (siehe dort):
  // erst rechnen, dann zeichnen, dann die Karten in ihre Felder
  // zuruecksetzen. Sie tragen ihre Feldnummer, also findet jede zurueck.
  if (RASTER && RASTER.einrasten){
    alleRasterfelder().forEach(f => {
      if (Number.isFinite(parseFloat(f.style.left))) feldNeuSetzen(feldKennung(f));
    });
  }
  // FEHLERBEHOBEN (2026-08-21, Rikes Befund «wenn man auf Groesser
  // klickt, werden nur die Karten groesser»): Das Brett von «kette» und
  // «buendel» wird aus der Kartenbreite GERECHNET - Felder, Pfeile,
  // Abstaende. Es wurde beim Zoomen aber nicht neu gezeichnet.
  // Gemessen: Karte 56 -> 78, Feld blieb bei 56. Die Karte passte dann
  // nicht mehr in ihr eigenes Feld.
  // Die belegten Felder behalten dabei ihre Karten: kettenAufbau()
  // leert KETTE.slots, deshalb werden sie vorher gemerkt.
  if (FLAECHE === 'kette'){
    kettenNeuZeichnen();
  } else if (FLAECHE === 'buendel'){
    buendelAufbau(); buendelLegen();
  }
}

function anteilBrett(){
  // Ein breites, niedriges Brett (drei Spalten über die ganze Fläche) darf
  // fast die volle Breite nehmen - die Karten liegen dann darunter, nicht
  // daneben. Sagt das Brett nichts, bleibt es bei den bisherigen Werten.
  if (BRETT && BRETT.anteil) return BRETT.anteil;
  return FLAECHE === 'runden' ? 0.34 : 0.52;
}

/* FEHLERBEHOBEN (2026-09-14, Maurus' Rueckmeldung zu Potenzen V1 und V5:
   «Zudem springt der Zoom wieder auf Klein, wenn man ein Kaertchen
   platziert»).

   Ursache: Wird ein Feld voller als jedes bisherige, rechnen
   rasterEinrasten() und reiheEinrasten() die Kartengroesse neu - damit
   die unterste Karte nicht verdeckt wird. `einpassen()` rechnet sie
   aber von Grund auf aus der freien Flaeche und der Kartenzahl. Eine
   von Hand gestellte Groesse war damit weg. Gemessen an «Wonach kann
   man diese Karten ordnen?»: breite 156 -> 46, sobald die zweite Karte
   in eine Gruppe kam.

   Die Regel, die jetzt gilt: Wer die Groesse selbst gestellt hat,
   behaelt sie. Das Raster wird trotzdem neu gezeichnet, die Felder
   wachsen also weiter mit der Tiefe; nur die KARTE bleibt, wie sie
   gewuenscht war. Wird es zu eng, stellt dieselbe Hand sie wieder
   kleiner - das ist eine Zeile weniger Bevormundung, nicht mehr.

   Nur hier, nicht in einpassen() selbst: Beim ersten Aufbau und beim
   Aendern der Fenstergroesse SOLL gerechnet werden. */
function einpassenWennAutomatisch(){
  if (breiteVonHand) return;
  einpassen();
}

function einpassen(){
  const anz0 = karten.filter(k => k.dataset.rolle !== 'ablage').length || 1;
  // Bei der Reihe richtet sich die KARTE nach dem Feld, nicht umgekehrt:
  // Alle Felder stehen in einer Zeile, also wird die Karte schmaler,
  // sobald ein Feld dazukommt. Sonst ragt sie hinaus.
  if (FLAECHE === 'reihe' && RASTER){
    const n = feldAnzahl + (RASTER.erweiterbar ? 1 : 0);
    const [rx0, rx1] = zone();
    const proFeld = ((rx1 - rx0 - 6) - 10 * (n - 1)) / n;
    // Die Hoehe richtet sich nach dem VOLLSTEN Feld. Entworfen sind
    // hoechstens drei Karten untereinander, aber eine Gruppe kann beim
    // Arbeiten mehr in ein Feld legen - dann ragte die unterste bisher
    // heraus (gemessen: ab fuenf Karten). Statt sie abzuschneiden oder
    // uebereinanderzuschieben werden ALLE Karten kleiner, genau wie sie
    // es in der Breite schon tun, wenn ein Feld dazukommt.
    const belegung = {};
    karten.forEach(k => { if (k._feld !== undefined && k.style.display !== 'none')
                            belegung[k._feld] = (belegung[k._feld] || 0) + 1; });
    const tiefstes = Math.max(1, ...Object.values(belegung));
    const noetig = Math.max(RASTER.hoehe, tiefstes * 1.08);
    const nachHoehe = (tisch.clientHeight * 0.52 - 16) / (noetig * 0.844);
    // GEAENDERT (2026-09-14, Rikes Beobachtung): Vorher nahm die Karte
    // IMMER den ganzen Platz, den die Feldzahl hergab - bei fuenf
    // Feldern also ein Sechstel der Flaeche, und das waren riesige
    // Felder mit einer kleinen Zahl darin. Und jedes neue Feld machte
    // alles kleiner, auch wenn noch Platz gewesen waere.
    //
    // Jetzt hat die Karte eine ZIELGROESSE (agent/05: rund 110 px auf
    // dem Tablet quer), und geschrumpft wird erst, wenn die Felder
    // sonst nicht mehr in eine Zeile passen. Die Felder sind damit von
    // Anfang an so breit, wie die Zahlen es brauchen, und sie bleiben
    // es, solange Platz ist.
    const ZIEL = 110;
    breite = Math.max(34, Math.min(ZIEL, Math.floor(
      Math.min(proFeld / RASTER.breite, nachHoehe))));
    masse(); return;
  }
  if (FLAECHE === 'buendel'){
    const n = BUENDEL.plaetze;
    const nachReihe = (tisch.clientWidth - 60) / (n + 1.6);
    const nachHoehe = (tisch.clientHeight / BUENDEL.reihen - 12) / 0.844;
    breite = Math.max(46, Math.min(150,
               Math.floor(Math.min(nachReihe, nachHoehe))));
    masse(); return;
  }
  if (FLAECHE === 'kette'){
    // Oben muss das Trapez passen: fuenf Kartenbreiten quer, gut drei
    // Kartenhoehen hoch. Darunter bleiben die Vorraete.
    const nachReihe = (tisch.clientWidth - 80) / 7.0;
    const nachHoehe = (tisch.clientHeight * 0.58) / (3.6 * 0.844);
    const frei = tisch.clientWidth * (tisch.clientHeight * 0.38);
    const nachZahl = Math.sqrt(frei * 0.42 / (anz0 * 0.844));
    breite = Math.max(46, Math.min(150,
               Math.floor(Math.min(nachReihe, nachHoehe, nachZahl))));
    masse(); return;
  }
  if (!BRETT){
    // Ohne Brett zaehlt nur, dass die Karten nebeneinander Platz finden.
    // Quer geteilt gehoert dem Vorrat die ganze BREITE und der Rest der
    // HOEHE; laengs geteilt ist es umgekehrt.
    const frei0 = QUER
      ? tisch.clientWidth * tisch.clientHeight * (1 - HAELFTEN.teiler)
      : tisch.clientWidth * (HAELFTEN ? HAELFTEN.teiler : 1) * tisch.clientHeight;
    breite = Math.max(46, Math.min(200,
               Math.floor(Math.sqrt(frei0 * (SORTIERT ? 0.78 : 0.55)
                                    / (anz0 * 0.844)))));
    // NEU (2026-08-31): Die freie Flaeche ist nicht mehr die einzige
    // Schranke. Seit der Vorrat in SPALTEN liegt und die Gruppenfelder
    // ZEILEN sind, geben zwei Strukturen die Kartengroesse vor - und
    // beide waren beim ersten Ausprobieren verletzt: Die sechs
    // Termkarten stapelten sich in einer einzigen Spalte, und eine
    // Zeile von 4,5 Kartenbreiten passte nicht in die rechte Haelfte.
    //
    // Zwei Obergrenzen also, und die schaerfere gewinnt:
    //   links   der Vorrat soll mindestens ZWEI Spalten zeigen
    //   rechts  eine ganze Gruppenzeile muss hineinpassen
    if (HAELFTEN && !QUER){
      const linksBreit = tisch.clientWidth * HAELFTEN.teiler - 20;
      const rechtsBreit = tisch.clientWidth * (1 - HAELFTEN.teiler) - 24;
      const grenzen = [];
      if (VORRATSPALTEN) grenzen.push(linksBreit / 2.2);
      if (RASTER && RASTER.breite){
        // Die Spalte am rechten Rand belegt Breite, die den Zeilen
        // fehlt - sonst waere die Gruppenzeile zu breit fuer ihre
        // Haelfte, sobald das Feld «weiss ich noch nicht» daneben steht.
        const ex = !RASTER.extra ? []
          : (Array.isArray(RASTER.extra) ? RASTER.extra : [RASTER.extra]);
        const spalte = ex.filter(e => e.wie === 'spalte')
                         .reduce((a, e) => a + (e.breite || 1.2), 0);
        grenzen.push(rechtsBreit / (RASTER.breite + spalte + 0.4));
      }
      // NEU (2026-09-23, SORT, Viola Niederberger: «nicht mehr als 5
      // Dreiergruppen pro Bildschirmseite ... alle untereinander noch
      // ersichtlich»). Dritte Obergrenze, nur wo eine Variante sie
      // verlangt: RASTER.sichtbar Felder muessen ohne Scrollen
      // Platz haben. Gerechnet mit den Massen aus rasterZeichnen(): Kopf
      // 38, je Feld mindestens eine Kartenreihe samt Titel (0,844 · b +
      // 40) oder RASTER.hoehe, dazu 10 Abstand - und so viele Spalten,
      // wie bei dieser Kartenbreite nebeneinander gehen. Gesucht wird
      // von oben die groesste Breite, bei der es aufgeht.
      //
      // Untergrenze 100 px: Darunter faellt der Hauptinhalt unter die
      // Lesbarkeitsschwelle aus agent/05 (7,3 px bei 110 px Karte, Schwelle
      // 6,7 px). Gemessen am Tablet quer (1024 x 768): Fuer vier sichtbare
      // Felder haette die Karte auf 80 px schrumpfen muessen. Lesbarkeit
      // geht vor - dort wird lieber ein Stueck gescrollt.
      //
      // Noetig, weil die Kartengroesse sonst an der KARTENZAHL haengt:
      // Weniger Gruppen gaben groessere Karten (159 statt 110 px) - und
      // damit wieder nur drei Felder auf dem Schirm.
      if (RASTER && RASTER.sichtbar && RASTER.breite){
        const passt = b => {
          const fh = Math.max(0.844 * b * (RASTER.hoehe || 1), 0.844 * b + 40);
          const sp = Math.max(1, Math.floor((rechtsBreit - 6) / (b * RASTER.breite + 10)));
          return Math.ceil(RASTER.sichtbar / sp) * (fh + 10) + 38 <= tisch.clientHeight;
        };
        let b = breite;
        const LESBAR = 100;
        while (b > LESBAR && !passt(b)) b--;
        if (b < breite) grenzen.push(b);
      }
      if (grenzen.length)
        breite = Math.max(40, Math.min(breite, Math.floor(Math.min(...grenzen))));
    }
    masse(); return;
  }
  const nachBreite = (tisch.clientWidth * anteilBrett()) / BRETT.breite;
  // Liegen die Karten unter dem Brett, bekommt das Brett nur einen Teil der
  // Hoehe und der Rest gehoert den Karten. Sonst nimmt das Brett die Hoehe
  // und die Karten den Platz daneben.
  const hAnteil = BRETT.unten ? (BRETT.hoehenanteil || 0.56) : 1.0;
  const nachHoehe  = ((tisch.clientHeight - 20) * hAnteil) / (BRETT.hoehe * 0.844);
  // Dritte Schranke: die Karten muessen neben oder unter dem Brett Platz
  // finden, sonst wird das Auslegen zum Stapel.
  const anz = karten.filter(k => k.dataset.rolle !== 'ablage').length || 1;
  const frei = BRETT.unten
      ? tisch.clientWidth * tisch.clientHeight * (1 - hAnteil)
      : tisch.clientWidth * (1 - anteilBrett()) * tisch.clientHeight;
  const nachZahl = Math.sqrt(frei * 0.50 / (anz * 0.844));
  breite = Math.max(46, Math.min(200,
             Math.floor(Math.min(nachBreite, nachHoehe, nachZahl))));
  masse();
}

function setzen(k, x, y){
  k._x = Math.max(0, x); k._y = Math.max(0, y);
  const w = (k._rot || 0);
  // Die Lupe vergroessert nur die Darstellung. Die gespeicherte Lage
  // (_x/_y) bleibt unveraendert, damit Ablage und Protokoll stimmen.
  const l = k._lupe || 1;
  k.style.transform = 'translate3d(' + k._x + 'px,' + k._y + 'px,0)' +
                      (w ? ' rotate(' + w + 'deg)' : '') +
                      (l !== 1 ? ' scale(' + l + ')' : '');
}

/* Karte zum Lesen kurz vergroessern. Damit muss nicht die ganze Flaeche
   aufgezoomt werden, nur um eine einzelne Karte zu entziffern. */
const LUPE = 1.45;
function lupe(k, an){
  k._lupe = an ? LUPE : 1;
  k.style.zIndex = an ? 9999 : (k._z || k.style.zIndex);
  setzen(k, k._x, k._y);
}

function aufTisch(k, x, y){
  if (k.parentElement !== tisch) tisch.appendChild(k);
  setzen(k, x, y);
}

function streuen(liste, streifen, h){
  // Versetztes Raster: durcheinander, aber jede Karte bleibt lesbar und im Bild.
  const platz = streifen.reduce((a, s) => a + Math.max(0, s[1] - s[0]), 0);
  const spaltenBreite = breite * 0.66;                 // etwas Ueberlappung
  const spalten = Math.max(1, Math.floor(platz / spaltenBreite));
  const zeilen = Math.max(1, Math.ceil(liste.length / spalten));
  const hoehe = Math.max(h * 0.42,
                Math.min(h * 0.72, (tisch.clientHeight - h - 16) / zeilen));
  const felder = [];
  streifen.forEach(s => {
    const n = Math.max(1, Math.floor((s[1] - s[0]) / spaltenBreite));
    for (let c = 0; c < n; c++) felder.push(s[0] + c * spaltenBreite);
  });
  const misch = liste.slice().sort(() => Math.random() - 0.5);
  misch.forEach((k, i) => {
    const c = i % felder.length, r = Math.floor(i / felder.length);
    k._rot = DREHUNG ? (Math.random() * 2 * DREHUNG - DREHUNG).toFixed(1) : 0;
    aufTisch(k,
      felder[c] + (Math.random() - 0.5) * spaltenBreite * 0.35,
      10 + r * hoehe + (Math.random() - 0.5) * hoehe * 0.30);
    k.style.zIndex = ++z;
  });
}


function nachSorten(zu, x0, x1, hoch, h, oben){
  // Ein Bereich je Kartensorte, untereinander und der Kartenzahl entsprechend
  // hoch. Innerhalb eines Bereichs wird genauso gestreut wie sonst auf dem
  // ganzen Tisch: viele Plaetze, gemischt, mit Zittern - also unregelmaessig.
  //
  // FEHLERBEHOBEN (2026-08-31, beim Einbau der Vorratsfelder): Der
  // Zuschnitt der Baender kam bisher aus `zu`. Solange auslegen() immer
  // ALLE Karten neu verteilte, war das dasselbe. Seit dem Nachlegen vom
  // 2026-08-27 bekommt auslegen() aber nur die NEUEN Karten - und dann
  // haette der Vorrat sich auf sie zusammengezogen: drei frische
  // Termkarten, und das Band «TERM» waere ueber die zwoelf schon
  // liegenden hinweggezeichnet worden.
  //
  // Der Zuschnitt richtet sich deshalb nach dem BESTAND: alles, was
  // gerade im Vorratsteil liegt, plus die neuen. Verschoben wird
  // weiterhin nur `zu`.
  const y0 = (oben === undefined) ? KOPF + (HAELFTEN && !QUER ? 12 : 0) : oben;
  // FEHLERBEHOBEN (2026-08-31, Rikes Befund «wenn man eine Figur dazu
  // tut, gehen die alten Sortierungen wieder verloren»): Diese Pruefung
  // las die Lage aus `style.left`. Dort steht sie nicht - `setzen()`
  // schreibt eine `transform` und merkt sich die Werte in `_x`/`_y`.
  // `parseFloat(k.style.left)` ergab also fuer JEDE Karte 0, damit galt
  // jede als Vorrat, und das Nachlegen ordnete den ganzen Tisch neu.
  //
  // Zwei Aenderungen, und die zweite ist die wichtigere:
  //   1. `_x`/`_y` lesen statt `style.left`.
  //   2. `_gelegt` ausschliessen. Eine von Hand bewegte Karte wird nie
  //      wieder automatisch verschoben - unabhaengig davon, WO sie
  //      liegt. Ein reiner Koordinatentest wuerde eine Karte, die
  //      jemand bewusst links geparkt hat, weiterhin wegraeumen.
  const drin = k => {
    if (k._gelegt) return false;
    if (zu.includes(k)) return true;
    if (k.dataset.rolle === 'ablage') return false;
    if (QUER) return (k._y || 0) >= grenzeY() - h * 0.4;
    const x = k._x || 0;
    return x >= x0 - breite * 0.5 && x <= x1 + breite * 0.5;
  };
  const bestand = karten.filter(drin);
  // Die Reihenfolge der Baender kommt aus dem GESAMTEN Kartensatz, nicht
  // aus dem gerade liegenden Bestand. Sonst wechselt sie beim Nachlegen:
  // Wer zuerst eine Termkarte im Bestand hatte, bekam TERM links - und
  // nach dem naechsten Klick stand es rechts. Eine Spalte, die den Platz
  // wechselt, muss man jedes Mal neu suchen.
  // GEAENDERT (2026-08-31, Rikes Wunsch «oben ein Teil fuer die Figuren
  // und unten einer fuer die Terme»): Gebuendelt wird nach BILD gegen
  // NICHT-BILD, nicht mehr nach einzelner Kartensorte. Sonst bekommen
  // Geometrie und Figurenfolge je ein eigenes Band, und statt der zwei
  // Teile, die sie wollte, stehen drei da - beim Ausprobieren rutschte
  // die erste Figurenfolge prompt unter die Terme.
  //
  // Die Zweiteilung ist nicht neu erfunden: Das Thema fuehrt sie in
  // VORRAT_LINKS und SPALTEN, bisher nur fuer die Druckvorlage.
  const istBild = k => VORRATLINKS.includes(k.dataset.typ || '?');
  // NEU (2026-09-23, SORT, Viola Niederberger): Eine Variante kann statt
  // «Bilder / Rest» ein Band JE KARTENSORTE verlangen, in fester
  // Reihenfolge (VORRATBAENDER, z. B. "TBS"). Ohne den Schluessel bleibt
  // alles wie am 31.08. entschieden - die Zweiteilung gilt weiter.
  const sorteVon = k => VORRATBAENDER ? (k.dataset.typ || '?')
                                      : (istBild(k) ? 'B' : 'R');
  const rang = t => VORRATBAENDER
        ? (VORRATBAENDER.includes(t) ? VORRATBAENDER.indexOf(t) : 99)
        : (t === 'B' ? 0 : 1);
  const sorten = [];
  bestand.forEach(k => { const t = sorteVon(k);
                         if (!sorten.includes(t)) sorten.push(t); });
  sorten.sort((a, b) => rang(a) - rang(b));
  const gruppen = sorten.map(t =>
        bestand.filter(k => sorteVon(k) === t));
  const luft = 10;
  const frei = Math.max(h, hoch - y0 - luft * (gruppen.length - 1));

  // FEHLERBEHOBEN (2026-08-31, beim Ausprobieren des Nachlegens): Die
  // Bandhoehe kam aus dem ANTEIL an den Karten - vier Bildkarten neben
  // sechzehn Termkarten bekamen ein Fuenftel der Hoehe. Fuer EINE Reihe
  // Karten reichte das, fuer zwei nicht, und die vierte Figur legte
  // sich auf die dritte.
  //
  // Jetzt zaehlt der PLATZBEDARF: Wie viele Reihen braucht das Band bei
  // vorgegebener Spaltenzahl? Danach wird die Hoehe verteilt. Bei
  // gleicher Kartengroesse laeuft das auf dasselbe hinaus wie vorher -
  // aber nur dann, und genau das war die stille Annahme.
  // Zwei Gitter, und die Wahl dazwischen ist die eigentliche Frage:
  //
  //   LOCKER  volle Kartenbreite je Spalte - nichts ueberdeckt sich.
  //   DICHT   0,62 · Breite quer, 0,42 · Hoehe hoch. Die Karten liegen
  //           uebereinander wie ein echter Vorrat auf dem Tisch.
  //
  // Genommen wird locker, solange es aufgeht. Erst wenn der Vorrat
  // dafuer zu gross ist, wird gestapelt - dann ist die Ueberdeckung
  // eine Aussage ueber die Menge und kein Versehen. Vor dem
  // 2026-08-31 gab es nur das dichte Gitter, auch fuer sieben Karten.
  //
  // QUER geteilt liegen die Baender NEBENEINANDER, nicht untereinander.
  // Rikes Bild ist die Kombinatorik: oben ein breites Brett, unten die
  // Quellflaechen in einer Reihe. Untereinander waeren sie im unteren
  // Drittel je ein paar Dutzend Pixel hoch - unbrauchbar.
  //
  // Die Breite je Band richtet sich nach dem Platzbedarf: Ein Band mit
  // vier Bildkarten braucht weniger als eines mit dreissig Termkarten.
  // Gerechnet wird ueber die FLAECHE, die die Karten fuellen, nicht
  // ueber ihre Zahl allein - sonst bekaeme ein Band mit wenigen Karten
  // eine Spalte, in die keine einzige Karte passt.
  const bandLuft = 10;
  const gesamtB = (x1 - x0) - bandLuft * (gruppen.length - 1);

  // FEHLERBEHOBEN (2026-08-31, beim Ausprobieren des Querbretts): Die
  // Bandbreite kam zuerst aus dem ANTEIL an den Karten - vier
  // Bildkarten neben achtzehn Termkarten bekamen ein Fuenftel der
  // Breite. Das klingt fair und ist es nicht: In ein Fuenftel passt
  // vielleicht EINE Spalte, und dann brauchen die vier Bildkarten vier
  // Reihen, waehrend die Termkarten mit einer auskommen. Das ganze Band
  // fiel damit ins dichte Gitter, und die Figuren lagen uebereinander.
  //
  // Gerechnet wird deshalb ueber die SPALTEN: Wie viele Reihen R
  // braucht es, damit alle Baender nebeneinander in die Breite passen?
  // R wird von eins an hochgezaehlt, bis es aufgeht; jedes Band bekommt
  // dann so viele Spalten, wie es bei diesem R braucht. Danach sind
  // alle Baender gleich hoch, und keines muss stapeln, solange die
  // Hoehe reicht.
  const schritt = breite * 1.02;
  const SPALTIG = QUER || VORRATSPALTEN;
  let bandSpalten = gruppen.map(() => 1), reihenQuer = gruppen.map(() => 1);
  if (SPALTIG){
    for (let R = 1; R <= 12; R++){
      const cols = gruppen.map(g => Math.max(1, Math.ceil(g.length / R)));
      const braucht = cols.reduce((a, b) => a + b, 0) * schritt;
      bandSpalten = cols;
      reihenQuer = gruppen.map(g => Math.max(1, Math.ceil(g.length / cols[gruppen.indexOf(g)])));
      if (braucht <= gesamtB) break;
    }
    reihenQuer = gruppen.map((g, i) => Math.max(1, Math.ceil(g.length / bandSpalten[i])));
  }
  const spaltenSumme = bandSpalten.reduce((a, b) => a + b, 0) || 1;
  const bandBreite = SPALTIG
    ? bandSpalten.map(c => Math.max(breite * 1.06, gesamtB * c / spaltenSumme))
    : gruppen.map(() => x1 - x0);

  // Zwei Gitter, und die Wahl dazwischen ist die eigentliche Frage:
  //
  //   LOCKER  volle Kartenbreite je Spalte - nichts ueberdeckt sich.
  //   DICHT   0,62 · Breite quer, 0,42 · Hoehe hoch. Die Karten liegen
  //           uebereinander wie ein echter Vorrat auf dem Tisch.
  //
  // Genommen wird locker, solange es aufgeht. Erst wenn der Vorrat
  // dafuer zu gross ist, wird gestapelt - dann ist die Ueberdeckung
  // eine Aussage ueber die Menge und kein Versehen. Vor dem
  // 2026-08-31 gab es nur das dichte Gitter, auch fuer sieben Karten.
  const spalten = (bw, faktor) => Math.max(1, Math.floor(bw / (breite * faktor)));
  const reihenBei = faktor => gruppen.map((g, i) =>
        Math.max(1, Math.ceil(g.length / spalten(bandBreite[i], faktor))));

  const reihenLocker = SPALTIG ? reihenQuer : reihenBei(1.02);
  // Quer stehen die Baender nebeneinander - dann zaehlt die HOECHSTE
  // Reihenzahl, nicht ihre Summe. Laengs stehen sie untereinander.
  const brauchtLocker = (SPALTIG ? Math.max(...reihenLocker)
                              : reihenLocker.reduce((a, b) => a + b, 0)) * (h + 6);
  const locker = brauchtLocker <= frei;
  const faktor = locker ? 1.02 : 0.62;

  const reihen = locker ? reihenLocker : reihenBei(0.62);
  const reihenGesamt = SPALTIG ? Math.max(...reihen)
                            : (reihen.reduce((a, b) => a + b, 0) || 1);

  // NEU (2026-08-31, Rikes Auftrag): Die Baender bekommen sichtbare
  // Felder mit Beschriftung. «Bitte mach mal die Sortierflaechen zu den
  // Vorratsstapel, wo sie rausholen, der unsortierte Teil, so
  // aufgeteilt, wie wir's bei Daten und Zufall gemacht haben - mit so
  // einem Feld fuer die Figuren, ein Feld fuer die anderen.»
  //
  // Getrennt lagen sie schon (nachSorten() gibt es seit laengerem), nur
  // sah man die Trennung nicht: zwei Haufen ohne Rand und ohne Namen,
  // die je nach Kartenzahl mal enger, mal weiter beieinanderlagen. Der
  // Rahmen macht aus dem Nebeneinander eine Ablage.
  document.querySelectorAll('.vorratsfeld').forEach(e => e.remove());
  // Platz fuer die Beschriftung der Tischhaelfte darueber. Ohne den
  // Absatz stand «GEOMETRIE» auf «noch nicht zugeordnet».
  let y = y0 + 16, x = x0;
  gruppen.forEach((gruppe, gi) => {
    // Quer: alle Baender gleich hoch, nebeneinander. Laengs: volle
    // Breite, Hoehe nach Platzbedarf, untereinander.
    const bh = SPALTIG ? Math.max(h + 4, frei - 16)
                    : Math.max(h + 4, frei * reihen[gi] / reihenGesamt);
    const bw = bandBreite[gi];
    const rahmen = document.createElement('div');
    rahmen.className = 'vorratsfeld';
    Object.assign(rahmen.style, {
      left: (x - 6) + 'px', top: (y - 16) + 'px',
      width: (bw + 12) + 'px', height: (bh + 22) + 'px'});
    const t = document.createElement('span');
    // Klartext, wo es ihn gibt - sonst der Buchstabe. Ein Feld ohne
    // Namen waere ein Rahmen ohne Aussage.
    t.textContent = VORRATBAENDER
      ? bandName(sorten[gi])
      : (sorten[gi] === 'B' ? VORRATNAMEN[0] : VORRATNAMEN[1]);
    rahmen.appendChild(t);
    tisch.insertBefore(rahmen, tisch.firstChild);
    // Das Gitter richtet sich nach der ZAHL der Karten im Band, nicht
    // nach dem, was hineinpasst.
    //
    // FEHLERBEHOBEN (2026-08-31): Bisher wurde das dichtestmoegliche
    // Gitter gebaut (Schritt 0,62 · Breite quer, 0,42 · Hoehe hoch) und
    // daraus zufaellig gezogen. Bei vielen Karten fuellt das die Flaeche
    // und sieht nach Vorrat aus - genau so war es gedacht. Seit dem
    // Einstieg mit sieben Karten (Rikes Kuerzung vom 2026-08-31) zog es
    // sechs Plaetze aus ueber hundert, und die lagen zufaellig
    // nebeneinander: Die Karten stapelten sich in einer Ecke, waehrend
    // das halbe Band leer blieb.
    //
    // Jetzt bekommt jede Karte ihre eigene Zelle. Ueberdeckung gibt es
    // nur noch, wenn wirklich mehr Karten da sind als Zellen - dann ist
    // sie unvermeidlich und gehoert zum Vorrat.
    const n = Math.max(1, gruppe.length);
    const ny = reihen[gi];
    const nx = Math.max(1, Math.min(spalten(bw, faktor), Math.ceil(n / ny)));
    const plaetze = [];
    for (let r = 0; r < ny; r++)
      for (let c = 0; c < nx; c++)
        plaetze.push([x + c * ((bw - breite) / Math.max(1, nx - 1) || 0),
                      y + r * ((bh - h) / Math.max(1, ny - 1) || 0)]);
    const mischen = () => {
      for (let i = plaetze.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [plaetze[i], plaetze[j]] = [plaetze[j], plaetze[i]];
      }
    };
    mischen();

    /* NEU (2026-08-31, Rikes Verdacht «nicht dass die oben die richtigen
       und unten die falschen sind»): Nachgemessen an zwoelf Auslegungen
       ist die Mischung in Ordnung - das Auslegen weiss nichts ueber
       richtig und falsch, und die Plaetze werden sauber durchgemischt.
       Aber in EINER der zwoelf lagen tatsaechlich die drei richtigen
       oben und die drei falschen unten. Das ist kein Fehler, sondern
       Zufall: Bei sechs Karten in zwei Dreierreihen trifft es eine von
       zwanzig Auslegungen.

       Nur hilft das der Gruppe nicht, die genau diese eine erwischt -
       fuer sie steht die Loesung auf dem Tisch. Deshalb wird eine
       Auslegung verworfen, in der eine ganze Reihe aus Karten DERSELBEN
       Gruppenmarke besteht, obwohl im Band mehrere vorkommen.
       Formuliert ueber die Gruppenmarke statt ueber «richtig», damit es
       fuer jedes Thema gilt: Eine Reihe, die genau eine Gruppe enthaelt,
       ist immer ein Wink.

       Hoechstens 20 Versuche - danach gibt es vermutlich gar keine
       unverfaengliche Anordnung, und eine verraeterische ist besser als
       eine Endlosschleife. */
    // Die Reihenfolge, in der die Karten die Plaetze bekommen. Sie muss
    // VOR der Pruefung feststehen - sonst pruefte man eine andere
    // Anordnung als die, die nachher liegt.
    //
    // Fisher-Yates statt `sort(() => Math.random() - 0.5)`: Der
    // Sortiertrick ist keine gleichmaessige Mischung, Elemente bleiben
    // in der Naehe ihres Platzes. Bei einem Vorrat, in dem erst die
    // richtigen und dann die falschen Terme stehen, ist das genau die
    // falsche Eigenschaft.
    const folge = gruppe.slice();
    const folgeMischen = () => {
      for (let i = folge.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [folge[i], folge[j]] = [folge[j], folge[i]];
      }
    };
    folgeMischen();

    const zeilenVerraten = () => {
      const marken = new Set(folge.map(k => k.dataset.gruppe || ''));
      if (marken.size < 2 || ny < 2) return false;
      // Die Reihe einer Karte steht in der Y-KOORDINATE ihres Platzes,
      // nicht in dessen Index: `plaetze` ist gemischt, der Index sagt
      // also nichts mehr ueber die Lage.
      const zeilen = new Map();
      folge.forEach((k, i) => {
        const pl = plaetze[i % plaetze.length];
        if (!pl) return;
        const y = Math.round(pl[1]);
        if (!zeilen.has(y)) zeilen.set(y, []);
        zeilen.get(y).push(k.dataset.gruppe || '');
      });
      for (const [, marken] of zeilen){
        if (marken.length < 2) continue;
        if (new Set(marken).size === 1) return true;
      }
      return false;
    };
    for (let versuch = 0; versuch < 20 && zeilenVerraten(); versuch++){
      mischen(); folgeMischen();
    }

    // Nur die Karten aus `zu` bekommen einen neuen Platz. Beim ersten
    // Aufbau und bei «Zurueck» ist das die ganze Gruppe; beim Nachlegen
    // nur das Neue - was schon liegt, bleibt liegen.
    // Neu geordnet wird der GANZE Vorrat des Bandes, nicht nur das
    // Neue. Der Grund ist die Geometrie: Mit jeder Figur aendern sich
    // Bandhoehe und Gitter, und die alten Karten stuenden dann auf
    // einem Gitter, das es nicht mehr gibt - beim Ausprobieren legten
    // sich die neuen Karten prompt auf die liegenden.
    //
    // Das ist KEIN Rueckfall hinter den Stand vom 2026-08-27. Dort ging
    // es darum, dass gebildete Gruppen nicht zerfallen. Die verlassen
    // den Vorratsteil, sobald sie gebildet sind, und liegen ausserhalb
    // von `bestand` - sie werden hier gar nicht angefasst. Umgeordnet
    // wird nur, was ohnehin noch unsortiert herumliegt.
    folge.forEach((k, i) => {
      const pl = plaetze[i % plaetze.length] || [x, y];
      k._rot = 0;
      // Das Zittern nimmt dem Gitter das Schematische. Beim lockeren
      // Gitter faellt es kleiner aus - dort ist gerade der Punkt, dass
      // sich nichts ueberdeckt, und ein volles Zittern haette genau das
      // wieder eingerissen.
      const zitterX = locker ? 0.06 : 0.24;
      const zitterY = locker ? 0.05 : 0.22;
      aufTisch(k,
        Math.max(x, Math.min(x + bw - breite,
                  pl[0] + (Math.random() - 0.5) * breite * zitterX)),
        Math.max(y0, Math.min(tisch.clientHeight - h - 4,
                  pl[1] + (Math.random() - 0.5) * h * zitterY)));
      k.style.zIndex = ++z;
    });
    // Quer wandert das naechste Band nach RECHTS, laengs nach unten.
    if (SPALTIG) x += bw + bandLuft; else y += bh + luft;
  });
  loeschenMarken();
}


/* ============ Buendel: geordneter Start, es wird aussortiert ============ */
const BU = {reihen: [], seite: 0, seiten: 1};

function buendelAufbau(){
  document.querySelectorAll('.buendelteil').forEach(e => e.remove());
  BU.reihen = [];
  const W = tisch.clientWidth, h = breite * 0.844;
  const n = BUENDEL.plaetze;
  const luecke = breite * 0.55;
  const gesamt = n * breite + (n - 1) * 8 + luecke + breite;
  const x0 = Math.max(6, (W - gesamt) / 2);
  const hoehe = (tisch.clientHeight - 16) / BUENDEL.reihen;
  for (let r = 0; r < BUENDEL.reihen; r++){
    const y = 8 + r * hoehe + (hoehe - h) / 2;
    const plaetze = [];
    for (let i = 0; i < n; i++)
      plaetze.push({x: x0 + i * (breite + 8), y: y, karte: null});
    const raus = {x: x0 + n * (breite + 8) + luecke, y: y, karte: null};
    BU.reihen.push({plaetze: plaetze, raus: raus});
    plaetze.concat([raus]).forEach((sl, i) => {
      const d = document.createElement('div');
      d.className = 'buendelteil';
      const ist = i === n;
      Object.assign(d.style, {position:'absolute', pointerEvents:'none',
        left: sl.x + 'px', top: sl.y + 'px', width: breite + 'px',
        height: h + 'px', borderRadius:'9px',
        border: (ist ? '2px solid ' + F.akzent() : '1.5px dashed ' + F.rand()),
        background: ist ? F.fuell() : 'transparent'});
      if (ist){
        const t = document.createElement('span');
        t.textContent = BUENDEL.rest;
        Object.assign(t.style, {position:'absolute', inset:'0', display:'flex',
          alignItems:'center', justifyContent:'center', fontSize:'11px',
          color:F.akzent(), textAlign:'center', padding:'0 6px'});
        d.appendChild(t);
      }
      tisch.appendChild(d);
    });
    const nr = document.createElement('div');
    nr.className = 'buendelteil';
    Object.assign(nr.style, {position:'absolute', pointerEvents:'none',
      left: (x0 - 26) + 'px', top: (y + h / 2 - 9) + 'px', fontSize:'13px',
      color:F.matt()});
    nr.textContent = (r + 1);
    tisch.appendChild(nr);
  }
}

function buendelLegen(){
  // Die Karten liegen von Anfang an geordnet: ein Buendel je Reihe, in der
  // Reihenfolge, die karten() geliefert hat. Aussortiert wird, nicht einsortiert.
  const zu = karten.filter(k => k.dataset.rolle !== 'ablage');
  const n = BUENDEL.plaetze;
  BU.seiten = Math.max(1, Math.ceil(zu.length / (n * BUENDEL.reihen)));
  const von = BU.seite * n * BUENDEL.reihen;
  zu.forEach((k, i) => {
    const dran = i >= von && i < von + n * BUENDEL.reihen;
    k.style.display = dran ? '' : 'none';
    if (!dran) k.classList.remove('rastet');
  });
  let i = von;
  BU.reihen.forEach(reihe => {
    reihe.plaetze.forEach(sl => {
      const k = zu[i++];
      sl.karte = k || null;
      if (!k) return;
      k._rot = 0; k.classList.add('rastet');
      aufTisch(k, sl.x, sl.y); k.style.zIndex = ++z;
    });
    reihe.raus.karte = null;
  });
  const kn = document.getElementById('buendelrunde');
  if (kn) kn.style.display = BU.seiten > 1 ? '' : 'none';
  /* NEU (2026-09-18, Rikes Entscheidung nach Maurus' Rueckmeldung):
     Die Rundenzahl gehoert auf den KNOPF, nicht nur in die Meldezeile.
     Maurus hat Runde 1 gespielt - das leichte Band - und geschrieben
     «einfach, aber ok»; dass zwei schwerere folgen, stand nur klein
     daneben. Dieselbe Schreibweise wie beim Satzknopf der anderen
     Flaechen, damit beide Knoepfe dasselbe sagen. */
  if (kn) kn.textContent = BU.seiten > 1
    ? 'Neue Runde (' + (BU.seite + 1) + ' von ' + BU.seiten + ')'
    : 'Neue Runde';
  meldung.textContent = BU.seiten > 1
    ? 'Runde ' + (BU.seite + 1) + ' von ' + BU.seiten + '.'
    : '';
}

async function buendelBild(){
  const gelegt = BU.reihen.filter(r => r.raus.karte);
  if (!gelegt.length) return;
  const h = Math.round(breite * 0.844);
  const x0 = BU.reihen[0].plaetze[0].x;
  const x1 = BU.reihen[0].raus.x + breite;
  const hoehe = (tisch.clientHeight - 16) / BUENDEL.reihen;
  const c = document.createElement('canvas'), s2 = 2;
  c.width = (x1 - x0 + 24) * s2;
  c.height = (BUENDEL.reihen * hoehe + 30) * s2;
  const g = c.getContext('2d'); g.scale(s2, s2);
  g.fillStyle = F.karte(); g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = F.matt(); g.font = '13px "Source Sans 3", Helvetica, sans-serif';
  g.fillText('Runde ' + (BU.seite + 1), 12, 18);
  for (const r of BU.reihen)
    for (const sl of r.plaetze.concat([r.raus])){
      if (!sl.karte) continue;
      const b = sl.karte.querySelector('img');
      await b.decode().catch(() => {});
      g.drawImage(b, sl.x - x0 + 12, sl.y + 22, breite, h);
    }
  await new Promise(f => c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'eindringling-' + String(BU.seite + 1).padStart(2, '0') + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    f();
  }));
}

function buendelEinrasten(k){
  const h = breite * 0.844;
  const mx = k._x + breite / 2, my = k._y + h / 2;
  for (const reihe of BU.reihen){
    for (const sl of reihe.plaetze.concat([reihe.raus])){
      if (Math.abs(mx - (sl.x + breite / 2)) < breite * 0.9 &&
          Math.abs(my - (sl.y + h / 2)) < h * 1.1){
        BU.reihen.forEach(r2 => r2.plaetze.concat([r2.raus])
          .forEach(a => { if (a.karte === k) a.karte = null; }));
        if (sl.karte && sl.karte !== k) return false;      // Platz ist belegt
        sl.karte = k; k._rot = 0; k.classList.add('rastet');
        setzen(k, sl.x, sl.y);
        return true;
      }
    }
  }
  BU.reihen.forEach(r2 => r2.plaetze.concat([r2.raus])
    .forEach(a => { if (a.karte === k) a.karte = null; }));
  k.classList.remove('rastet');
  return false;
}

function buendelPruefen(){
  loeschenMarken();
  let fertig = 0, richtig = 0;
  BU.reihen.forEach(reihe => {
    const drin = reihe.plaetze.filter(s => s.karte).map(s => s.karte);
    const raus = reihe.raus.karte;
    if (!raus) return;
    fertig++;
    const marken = [...new Set(drin.map(k => k.dataset.gruppe))];
    const ok = raus.dataset.gruppe === '' && marken.length === 1 &&
               marken[0] !== '';
    drin.concat([raus]).forEach(k => k.classList.add(ok ? 'richtig' : 'falsch'));
    if (ok) richtig++;
  });
  meldung.textContent = fertig === 0
    ? 'Legt zuerst in jeder Reihe eine Karte heraus.'
    : richtig + ' von ' + fertig + ' Reihen stimmen.';
}

/* ================= Kette: Trapez oben, Vorraete unten =================

   Vier Figurenfelder bilden ein Trapez: Start unten links, Ende unten
   rechts, dazwischen oben zwei freie Felder. Vier Pfeile verbinden sie,
   jeder traegt ein Feld:

       drei Pfeile ueber die freien Felder  -> Karte aus dem Vorrat
       ein Pfeil direkt von Start zu Ende   -> Schreibfeld

   Warum das direkte Feld beschrieben und nicht belegt wird: Der Vorrat
   haelt acht Streckfaktoren. Zwischen zwei Figuren derselben Klasse
   kommen aber 22 verschiedene Verhaeltnisse vor, und beim direkten Weg
   faellt der Wert besonders oft heraus. Als Karte waere die Aufgabe in
   zwei Dritteln der Runden unloesbar - und im Rest eindeutig.

   Auf keiner sichtbaren Beschriftung steht, in welchem Verhaeltnis die
   vier Felder zueinander stehen. Genau das soll gefunden werden.
   ===================================================================== */
/* NEU (2026-08-21, Entscheidung Kasper): die RUECKRICHTUNG.

   Die Auftragsliste verlangt sie so: «Wenn der Faktor hin 3/2 ist, muss
   er zurueck 2/3 sein - das ist die lohnende Einsicht. Umsetzung offen -
   zwei Pfeile? So bauen, dass es Diskussion erzeugt.»

   ENTSCHEIDUNG: eine ZWEITE RUNDE «Rueckweg», nicht doppelte Felder.
   Ist der Hinweg gefunden, dreht ein Knopf die Pfeile um. Die drei
   gelegten Faktorkarten gehen in den Vorrat zurueck, ihr Wert bleibt
   als kleine Beschriftung neben dem leeren Feld stehen. Gesucht ist
   jetzt der Kehrwert - und die Karte dafuer liegt schon im Vorrat, denn
   die acht Streckfaktoren sind genau vier Kehrwertpaare.

   Verworfen: sechs Faktorfelder von Anfang an, drei hin und drei
   zurueck. Zwei Gruende. Erstens wird das Brett damit zum Ausfuellen:
   sieben Felder plus Schreibfeld, und die Einsicht geht in der Arbeit
   unter. Zweitens laesst sich bei offenen Paaren der eine Wert aus dem
   anderen erraten, statt ihn zu begruenden - genau die Diskussion, um
   die es geht, faellt dann aus.

   Nebengewinn: Weil die Hinweg-Karten zurueckgehen, reichen die acht
   Karten des Vorrats. Bei sechs gleichzeitig offenen Feldern haette es
   sie doppelt gebraucht - eine Runde kann denselben Faktor hin und
   zurueck verlangen (gemessen: 3/2 auf Kante 1 hin und Kante 3 zurueck).
*/
const KETTE = {slots: [], runde: null, nr: 0, direkt: '',
               richtung: 'hin', hinwerte: [null, null, null]};

const K_START = 0, K_C = 1, K_D = 2, K_ENDE = 3;
const K_F1 = 4, K_F2 = 5, K_F3 = 6;

function kettenAufbau(){
  document.querySelectorAll('.kettenteil').forEach(e => e.remove());
  KETTE.slots = [];
  const W = tisch.clientWidth, H = tisch.clientHeight;
  const h = breite * 0.844, g = Math.max(8, Math.round(breite * 0.16));
  // Zwischen den beiden oberen Feldern braucht es mehr Luft als sonst:
  // Sonst deckt das Faktorfeld den ganzen Pfeil zu und man sieht gar keinen.
  const gg = Math.max(16, Math.round(breite * 0.42));
  // Einrueckung und Hoehe des Trapezes sind so gewaehlt, dass von jeder
  // Diagonalen links und rechts des Faktorfelds noch ein Stueck Pfeil zu
  // sehen ist. Enger, und das Feld deckt den Pfeil vollstaendig zu.
  const ins = Math.round(breite * 1.35) + g;
  const B = 3 * breite + 2 * gg + 2 * ins;   // Spannweite der unteren Reihe
  const x0 = Math.max(6, (W - B) / 2);
  const yO = 30, dy = Math.round(h * 1.60), yU = yO + h + dy;
  const xC = x0 + ins, xF2 = xC + breite + gg, xD = xF2 + breite + gg;
  const xE = x0 + B - breite;

  function kasten(x, y, w, hh, fest, text, farbe){
    const d = document.createElement('div');
    d.className = 'kettenteil';
    Object.assign(d.style, {position:'absolute', pointerEvents:'none',
      left:x + 'px', top:y + 'px', width:w + 'px', height:hh + 'px',
      borderRadius:'9px', zIndex:1,
      border:(fest ? '2px solid ' + F.fest() : '1.5px dashed ' + farbe),
      background: fest ? F.fuell() : 'transparent'});
    if (text){
      const t = document.createElement('span');
      t.textContent = text;
      Object.assign(t.style, {position:'absolute', inset:'0', display:'flex',
        alignItems:'center', justifyContent:'center', fontSize:'10px',
        color:farbe, textAlign:'center', padding:'0 3px'});
      d.appendChild(t);
    }
    tisch.appendChild(d);
  }

  // ---- die vier Figurenfelder ----
  [[x0, yU, true, 'Start'], [xC, yO, false, ''],
   [xD, yO, false, ''], [xE, yU, true, 'Ende']].forEach(([x, y, fest, lab]) => {
    KETTE.slots.push({x:x, y:y, w:breite, h:h, art:'figur',
                      fest:fest, karte:null});
    kasten(x, y, breite, h, fest, lab, fest ? F.fest() : F.rand());
  });

  // ---- die drei Faktorfelder auf den Umwegpfeilen ----
  // Alle drei heissen gleich. Ein Feld «k» neben Feldern «k1, k2, k3»
  // verriete die Beziehung, bevor sie gefunden ist.
  const yF = yO + h + dy / 2 - h / 2;
  [[x0 + ins / 2, yF], [xF2, yO], [xD + ins / 2, yF]].forEach(([x, y], i) => {
    KETTE.slots.push({x:x, y:y, w:breite, h:h, art:'faktor',
                      fest:false, karte:null});
    kasten(x, y, breite, h, false, 'Faktor', F.akzent());
    // Im Rueckweg steht der Wert des Hinwegs klein daneben. Er ist die
    // Frage, nicht die Antwort: Gesucht ist sein Kehrwert.
    if (KETTE.richtung === 'zurueck' && KETTE.hinwerte[i]){
      const b = document.createElement('div');
      b.className = 'kettenteil';
      b.textContent = 'hin: ' + KETTE.hinwerte[i];
      Object.assign(b.style, {position:'absolute', pointerEvents:'none',
        left:x + 'px', top:(y - 17) + 'px', width:breite + 'px',
        textAlign:'center', fontSize:'11px', color:F.matt(), zIndex:2});
      tisch.appendChild(b);
    }
  });

  // ---- die Pfeile ----
  const sv = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  sv.setAttribute('class', 'kettenteil');
  Object.assign(sv.style, {position:'absolute', left:'0', top:'0',
    width:W + 'px', height:(yU + h + 10) + 'px', pointerEvents:'none',
    zIndex:0});
  sv.innerHTML = '<defs><marker id="sp" markerWidth="7" markerHeight="7" ' +
    'refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="' +
    F.matt() + '"/></marker></defs>';
  const pfeil = (x1, y1, x2, y2) => {
    const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1);
    l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('stroke', F.matt());
    l.setAttribute('stroke-width', '1.6');
    l.setAttribute('marker-end', 'url(#sp)');
    sv.appendChild(l);
  };
  // Im Rueckweg zeigen die drei Umwegpfeile in die andere Richtung.
  // Der direkte Pfeil bleibt, wie er ist: Sein Feld wird geschrieben,
  // nicht belegt, und der Rueckweg dort ist dieselbe Rechnung.
  const rw = KETTE.richtung === 'zurueck';
  const kante = (ax, ay, bx, by) => rw ? pfeil(bx, by, ax, ay)
                                       : pfeil(ax, ay, bx, by);
  kante(x0 + breite * 0.8, yU, xC + breite * 0.2, yO + h);           // Start - oben
  kante(xC + breite, yO + h / 2, xD, yO + h / 2);                    // oben - oben
  kante(xD + breite * 0.8, yO + h, xE + breite * 0.2, yU);           // oben - Ende
  pfeil(x0 + breite, yU + h / 2, xE, yU + h / 2);                    // Start -> Ende
  tisch.appendChild(sv);

  // ---- das Schreibfeld auf dem direkten Pfeil ----
  const fw = Math.max(58, breite * 0.9), fh = Math.max(26, h * 0.44);
  const e = document.createElement('input');
  e.className = 'kettenteil direktfeld';
  e.type = 'text'; e.value = KETTE.direkt;
  e.placeholder = 'Faktor';
  Object.assign(e.style, {position:'absolute',
    left:(x0 + B / 2 - fw / 2) + 'px', top:(yU + h / 2 - fh / 2) + 'px',
    width:fw + 'px', height:fh + 'px', pointerEvents:'auto', zIndex:2});
  e.oninput = () => { KETTE.direkt = e.value; loeschenMarken();
                      ketteVielleichtPruefen(); };
  tisch.appendChild(e);
  KETTE.feld = e;

  // ---- Vorraete darunter ----
  const trenn = yU + h + 22;
  const beschriften = (links, weite, text, farbe) => {
    const d = document.createElement('div');
    d.className = 'kettenteil';
    Object.assign(d.style, {position:'absolute', pointerEvents:'none',
      left: links + 'px', top: trenn + 'px', width: weite + 'px',
      height: Math.max(40, H - trenn - 8) + 'px', borderRadius:'10px',
      border:'1.5px solid ' + F.linie(), background:'transparent'});
    const t = document.createElement('span');
    t.textContent = text;
    Object.assign(t.style, {position:'absolute', left:'10px', top:'6px',
      fontSize:'11px', color: farbe});
    d.appendChild(t);
    tisch.appendChild(d);
  };
  KETTE.figuren = [8, Math.round(W * 0.70) - 16];
  KETTE.faktoren = [Math.round(W * 0.70), W - 16];
  KETTE.oben = trenn + 24;
  beschriften(KETTE.figuren[0], KETTE.figuren[1] - KETTE.figuren[0],
              'Figuren', F.matt());
  beschriften(KETTE.faktoren[0], KETTE.faktoren[1] - KETTE.faktoren[0],
              'Streckfaktoren', F.akzent());
}

function kettenStreuen(){
  const h = breite * 0.844;
  const lege = (liste, x0, x1) => {
    const w = breite, hh = h;
    const nx = Math.max(1, Math.floor((x1 - x0) / (w * 0.72)));
    const plaetze = [];
    const ny = Math.max(1, Math.floor((tisch.clientHeight - KETTE.oben - 8) / (hh * 0.6)));
    for (let r = 0; r < ny; r++)
      for (let c = 0; c < nx; c++)
        plaetze.push([x0 + c * ((x1 - x0 - w) / Math.max(1, nx - 1) || 0),
                      KETTE.oben + r * ((tisch.clientHeight - KETTE.oben - hh - 8)
                                        / Math.max(1, ny - 1) || 0)]);
    for (let i = plaetze.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [plaetze[i], plaetze[j]] = [plaetze[j], plaetze[i]];
    }
    liste.forEach((k, i) => {
      const p = plaetze[i % plaetze.length] || [x0, KETTE.oben];
      k._rot = 0;
      aufTisch(k, Math.max(x0, Math.min(x1 - w - 2, p[0])), p[1]);
      k.style.zIndex = ++z;
    });
  };
  const frei = karten.filter(k => !KETTE.slots.some(s => s.karte === k));
  lege(frei.filter(k => k.dataset.faktor === undefined),
       KETTE.figuren[0] + 6, KETTE.figuren[1] - 6);
  lege(frei.filter(k => k.dataset.faktor !== undefined),
       KETTE.faktoren[0] + 6, KETTE.faktoren[1] - 6);
}

async function kettenBild(){
  const belegt = KETTE.slots.filter(s => s.karte);
  if (belegt.length < 3 && !KETTE.direkt) return;   // nichts Nennenswertes
  const h = Math.round(breite * 0.844);
  let x0 = 1e9, y0 = 1e9, x1 = 0, y1 = 0;
  KETTE.slots.forEach(s => {
    x0 = Math.min(x0, s.x); y0 = Math.min(y0, s.y);
    x1 = Math.max(x1, s.x + s.w); y1 = Math.max(y1, s.y + s.h);
  });
  const s2 = 2, c = document.createElement('canvas');
  const cw = x1 - x0 + 24, ch = y1 - y0 + 40;
  c.width = cw * s2; c.height = ch * s2;
  const g = c.getContext('2d'); g.scale(s2, s2);
  g.fillStyle = F.karte(); g.fillRect(0, 0, cw, ch);
  g.fillStyle = F.matt(); g.font = '13px "Source Sans 3", Helvetica, sans-serif';
  g.fillText('Runde ' + KETTE.nr, 12, 18);
  for (const sl of KETTE.slots){
    if (!sl.karte) continue;
    const b = sl.karte.querySelector('img');
    await b.decode().catch(() => {});
    g.drawImage(b, sl.x - x0 + 12, sl.y - y0 + 26, breite, h);
  }
  // Das Schreibfeld gehoert mit aufs Bild - es ist der Teil, den die
  // Gruppe selbst gefunden hat.
  if (KETTE.feld){
    const fx = parseFloat(KETTE.feld.style.left) - x0 + 12;
    const fy = parseFloat(KETTE.feld.style.top) - y0 + 26;
    const fw = parseFloat(KETTE.feld.style.width);
    const fh = parseFloat(KETTE.feld.style.height);
    g.strokeStyle = F.akzent(); g.lineWidth = 1.5;
    g.strokeRect(fx, fy, fw, fh);
    if (KETTE.direkt){
      g.fillStyle = farbe('--tinte');
      g.font = '15px "Patrick Hand", cursive';
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(KETTE.direkt, fx + fw / 2, fy + fh / 2, fw - 8);
      g.textAlign = 'start'; g.textBaseline = 'alphabetic';
    }
  }
  await new Promise(f => c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'kette-' + String(KETTE.nr).padStart(2, '0') + '.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    f();
  }));
}

/* Vom Hinweg zum Rueckweg. Die drei Faktorkarten gehen in den Vorrat
   zurueck, ihr Wert bleibt als Beschriftung stehen - damit reichen die
   acht Karten des Vorrats, und der Kehrwert muss gefunden werden. */
function zeigeRueckwegKnopf(){
  if (document.getElementById('rueckweg')) return;
  const kn = document.createElement('button');
  kn.id = 'rueckweg';
  kn.textContent = 'Und jetzt zurück';
  kn.onclick = () => rueckwegStarten(kn);
  const leiste0 = document.querySelector('.leiste');
  const vor0 = document.getElementById('bild');
  leiste0.insertBefore(kn, vor0 || null);
}

/* NEU (2026-08-21, Rikes Entscheidung): Der Rueckweg beginnt von SELBST,
   sobald der Hinweg vollstaendig stimmt. Rike: «Wenn alle Felder
   richtig ausgefuellt sind, dann werden automatisch die Pfeile gedreht
   und die Frage ist: und jetzt zurueck?»
   Der Knopf bleibt als Weg fuer den Fall, dass jemand ihn braucht. */
function rueckwegStarten(kn){
  // FEHLERBEHOBEN (2026-08-21, beim Vorfuehren gefunden): Ein zweiter
  // Aufruf raeumte das Trapez leer. kettenAufbau() setzt KETTE.slots
  // neu; die Figuren werden vorher gemerkt und danach zurueckgelegt -
  // beim zweiten Lauf war die Merkliste aber schon leer, und die vier
  // Figuren waren weg. Passieren konnte das, weil jeder vollstaendige
  // Hinweg einen Umschalter auf die Uhr legt: Wer nach dem Drehen noch
  // einmal alles richtig legte, bekam einen zweiten.
  if (KETTE.richtung === 'zurueck') return;
  {
    KETTE.hinwerte = [K_F1, K_F2, K_F3].map(i => {
      const k = KETTE.slots[i].karte;
      return k ? k.dataset.faktor : null;
    });
    [K_F1, K_F2, K_F3].forEach(i => {
      const k = KETTE.slots[i].karte;
      if (k){ k._feld = undefined; k.classList.remove('rastet');
              k.style.transform = ''; k._x = k._y = 0; k._heim.appendChild(k); }
      KETTE.slots[i].karte = null;
    });
    // FEHLERBEHOBEN (2026-08-21): kettenAufbau() leert KETTE.slots. Beim
    // Umschalten gingen damit auch die vier FIGUREN aus dem Trapez
    // verloren - und mit ihnen der halbe Sinn: Es sollen dieselben
    // Figuren sein, nur andersherum gelesen. Sie werden gemerkt und
    // danach an ihre Plaetze zurueckgesetzt.
    const figuren = [K_START, K_C, K_D, K_ENDE].map(i => KETTE.slots[i].karte);
    KETTE.richtung = 'zurueck';
    // Der direkte Faktor wird ebenfalls neu gesucht - auf dem Rueckweg
    // ist es sein Kehrwert. Bliebe der alte Wert stehen, meldete die
    // Pruefung sofort «stimmt noch nicht», ohne dass jemand etwas
    // falsch gemacht haette.
    KETTE.direkt = '';
    if (KETTE.feld) KETTE.feld.value = '';
    loeschenMarken();
    kettenAufbau(); kettenStreuen();
    [K_START, K_C, K_D, K_ENDE].forEach((s, j) => {
      const k = figuren[j];
      if (!k) return;
      KETTE.slots[s].karte = k;
      k._rot = 0; k.classList.add('rastet');
      // aufTisch statt setzen: kettenStreuen() hat die Figuren eben in
      // den Vorrat gelegt - sie haengen also an einem anderen Element,
      // und setzen() wuerde sie DORT verschieben statt aufs Trapez.
      aufTisch(k, KETTE.slots[s].x, KETTE.slots[s].y);
    });
    if (kn) kn.remove();
    meldung.textContent = 'Und jetzt zurück: Dieselben Figuren, dieselben '
      + 'Pfeile — nur andersherum. Welcher Faktor gehört jetzt an welchen '
      + 'Pfeil?';
  }
}

/* ───────── Vorfuehren ─────────

   NEU (2026-08-21, Rikes Bitte): «Ich sehe leider nie, was passiert,
   wenn ich alles richtig lege, weil ich nicht die Zeit habe, das selbst
   auszusuchen. Ich haette gerne mal ein Preview, wo ich nicht selbst

   Der Knopf legt die Runde richtig aus. Er erscheint NUR, wenn in der

   Er raet nichts: Die Runde steht in runden.json, mit Weg und Faktoren.
