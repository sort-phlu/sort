   damit sieht man auch, was beim vollstaendigen Hinweg passiert. */
function vorfuehrenMoeglich(){
  return new URLSearchParams(location.search).has('vorfuehren');
}

/* Das Brett neu zeichnen, ohne die Belegung zu verlieren.

   FEHLERBEHOBEN (2026-08-21, beim Vorfuehren gefunden): An zwei Stellen
   stand die Folge

       kettenAufbau(); kettenStreuen();
       KETTE.slots.forEach(s => { if (s.karte) setzen(s.karte, …); });

   kettenAufbau() setzt KETTE.slots aber NEU - mit karte:null. Die Zeile
   danach suchte die Karten also in bereits geleerten Plaetzen und fand
   nie eine. Folge: Bei jeder Aenderung der Fenstergroesse raeumte sich
   das Trapez leer, und die Karten lagen wieder im Vorrat. Gemessen:
   sieben belegte Plaetze vor dem Ereignis, null danach.

   Dazu setzen() statt aufTisch(): kettenStreuen() haengt die Karten in
   den Vorrat um, und setzen() haette sie DORT verschoben. */
function kettenNeuZeichnen(){
  const belegt = KETTE.slots.map(s => s.karte);
  kettenAufbau();
  belegt.forEach((k, i) => {
    if (!k || !KETTE.slots[i]) return;
    KETTE.slots[i].karte = k;
  });
  kettenStreuen();
  KETTE.slots.forEach(s => {
    if (s.karte){ s.karte._rot = 0; aufTisch(s.karte, s.x, s.y); }
  });
}

function kettenVorfuehren(){
  const r = KETTE.runde;
  if (!r) return;
  const hol = c => karten.find(k => k.dataset.code === c);
  // FEHLERBEHOBEN (2026-08-21, sofort beim Vorfuehren gesehen): Hier
  // stand setzen() statt aufTisch(). setzen() rechnet die Lage relativ
  // zum ELTERNELEMENT - liegt die Karte noch im Vorrat, wandert sie
  // dort umher statt auf den Tisch. Die Pruefung meldete «alles passt»,
  // waehrend im Trapez leere Felder standen und die gruen markierten
  // Karten unten im Vorrat lagen. Beim Ziehen faellt das nicht auf,
  // weil die Karte dann laengst am Tisch haengt.
  const legen = (si, k) => {
    if (!k) return;
    KETTE.slots.forEach(a => { if (a.karte === k) a.karte = null; });
    KETTE.slots[si].karte = k; k._rot = 0; k.classList.add('rastet');
    aufTisch(k, KETTE.slots[si].x, KETTE.slots[si].y);
  };
  // Die vier Figuren an ihre Plaetze.
  [K_START, K_C, K_D, K_ENDE].forEach((si, j) => legen(si, hol(r.weg[j])));
  // Die drei Faktorkarten. Im Rueckweg ist der Kehrwert gesucht.
  const rw = KETTE.richtung === 'zurueck';
  [K_F1, K_F2, K_F3].forEach((si, j) => {
    const soll = rw ? 1 / _alsZahl(r.faktoren[j]) : _alsZahl(r.faktoren[j]);
    const frei = karten.filter(k => k.dataset.faktor !== undefined
                  && !KETTE.slots.some(a => a.karte === k));
    legen(si, frei.find(x => Math.abs(_alsZahl(x.dataset.faktor) - soll) < 0.001));
  });
  // Der direkte Faktor: das Verhaeltnis der beiden Seitenlaengen.
  const a = r.groessen[0], b = r.groessen[3];
  const wert = rw ? a / b : b / a;
  KETTE.direkt = String(Math.round(wert * 1000) / 1000).replace('.', ',');
  if (KETTE.feld) KETTE.feld.value = KETTE.direkt;
  kettePruefen();
}

function kettenRunde(){
  // Eine neue Runde beginnt wieder auf dem Hinweg.
  KETTE.richtung = 'hin'; KETTE.hinwerte = [null, null, null];
  const alt = document.getElementById('rueckweg');
  if (alt) alt.remove();
  if (!RUNDEN || !RUNDEN.length) return;
  KETTE.nr++;
  const klassen = [...new Set(RUNDEN.map(r => r.klasse))];
  const kl = klassen[Math.floor(Math.random() * klassen.length)];
  let pool = RUNDEN.filter(r => r.klasse === kl);
  if (KETTE.nr % 4 === 0 && pool.some(r => r.monoton))
    pool = pool.filter(r => r.monoton);          // ab und zu eine monotone
  const r = pool[Math.floor(Math.random() * pool.length)];
  KETTE.runde = r;
  KETTE.slots.forEach(s => { s.karte = null; });
  KETTE.direkt = '';
  if (KETTE.feld) KETTE.feld.value = '';
  loeschenMarken();
  const hol = c => karten.find(k => k.dataset.code === c);
  let start = hol(r.weg[0]), ende = hol(r.weg[3]);
  if (KETTE.nr % 5 === 0){                       // jede fuenfte Runde geht nicht auf
    const fremd = karten.filter(k => k.dataset.klasse &&
                                     k.dataset.klasse !== kl);
    if (fremd.length) ende = fremd[Math.floor(Math.random() * fremd.length)];
    KETTE.runde = null;
  }
  kettenStreuen();
  [[K_START, start], [K_ENDE, ende]].forEach(([i, k]) => {
    if (!k) return;
    const s = KETTE.slots[i];
    s.karte = k; k._rot = 0; aufTisch(k, s.x, s.y); k.classList.add('rastet');
  });
  meldung.textContent = 'Runde ' + KETTE.nr +
    ': Sucht zwei Figuren f\u00fcr die oberen Felder und f\u00fcllt alle vier ' +
    'Felder an den Pfeilen.';
}

function kettenEinrasten(k){
  const istFaktor = k.dataset.faktor !== undefined;
  const mx = k._x + breite / 2, my = k._y + breite * 0.844 / 2;
  for (let i = 0; i < KETTE.slots.length; i++){
    const s = KETTE.slots[i];
    if (s.fest) continue;
    if ((s.art === 'faktor') !== istFaktor) continue;
    if (Math.abs(mx - (s.x + s.w / 2)) < s.w * 0.9 &&
        Math.abs(my - (s.y + s.h / 2)) < s.h * 1.1){
      KETTE.slots.forEach(a => { if (a.karte === k) a.karte = null; });
      if (s.karte) s.karte.classList.remove('rastet');
      s.karte = k; k._rot = 0; k.classList.add('rastet');
      setzen(k, s.x, s.y);
      ketteVielleichtPruefen();
      return true;
    }
  }
  KETTE.slots.forEach(a => { if (a.karte === k) a.karte = null; });
  k.classList.remove('rastet');
  return false;
}

function _alsZahl(t){
  if (!t) return NaN;
  const r = t.trim().replace(',', '.');
  const p = r.split('/');
  if (p.length === 2) return (+p[0]) / (+p[1]);
  return +r;
}

/* Ist alles gefuellt, was gefuellt sein muss? */
function ketteVollstaendig(){
  const fig = [K_START, K_C, K_D, K_ENDE].map(i => KETTE.slots[i].karte);
  const fak = [K_F1, K_F2, K_F3].map(i => KETTE.slots[i].karte);
  return !fig.some(k => !k) && !fak.some(k => !k) && !!KETTE.direkt.trim();
}

/* NEU (2026-08-21, Rikes Entscheidung): Kein Pruefknopf mehr.
   «Man kann gar nicht selber entscheiden, ob man prueft - aber wenn man
   alle Felder ausgefuellt hat, wird automatisch gezeigt, ob schon was
   stimmt oder nicht. Und wenn nichts stimmt, muss man's noch mal
   veraendern, so lang, bis es stimmt.»

   Vorher ist STILL: Wer noch legt, soll nicht bei jeder Karte gesagt
   bekommen, dass etwas fehlt. */
function ketteVielleichtPruefen(){
  if (!ketteVollstaendig()) return;
  kettePruefen();
}

function kettePruefen(){
  const fig = [K_START, K_C, K_D, K_ENDE].map(i => KETTE.slots[i].karte);
  const fak = [K_F1, K_F2, K_F3].map(i => KETTE.slots[i].karte);
  if (fig.some(k => !k) || fak.some(k => !k)){
    meldung.textContent = 'Es fehlen noch Karten im Trapez.'; return;
  }
  let richtig = 0;
  loeschenMarken();
  const rw = KETTE.richtung === 'zurueck';
  for (let i = 0; i < 3; i++){
    const a = +fig[i].dataset.groesse, b = +fig[i + 1].dataset.groesse;
    const soll = _alsZahl(fak[i].dataset.faktor);
    // Im Rueckweg geht der Pfeil andersherum: gesucht ist a/b statt b/a,
    // also der Kehrwert des Hinwegs. Gerechnet wird an den GROESSEN, nicht
    // am gemerkten Wert - so faellt auch auf, wenn im Hinweg etwas
    // Falsches lag.
    const verlangt = rw ? a / b : b / a;
    const ok = fig[i].dataset.klasse === fig[i + 1].dataset.klasse &&
               Math.abs(verlangt - soll) < 0.01;
    [fig[i], fak[i], fig[i + 1]].forEach(k =>
      k.classList.add(ok ? 'richtig' : 'falsch'));
    if (ok) richtig++;
  }
  // Der direkte Weg wird gegen die beiden gegebenen Figuren geprueft. Die
  // Meldung nennt die vier Felder getrennt und sagt nichts darueber, wie
  // sie zusammenhaengen - das steht auch im Quelltext nirgends.
  const wort = rw ? 'des Rückwegs' : 'des Umwegs';
  let satz = richtig === 3
    ? 'Alle drei Schritte ' + wort + ' passen.'
    : richtig + ' von 3 Schritten ' + wort + ' passen.';
  // Der Knopf fuer den Rueckweg erscheint erst, wenn der Hinweg steht.
  // Vorher waere er eine zweite Baustelle neben einer offenen ersten.
  let drehen = false;
  if (!rw && richtig === 3) zeigeRueckwegKnopf();
  if (KETTE.direkt.trim()){
    // FEHLERBEHOBEN (2026-08-21, beim Vorfuehren gefunden): Die drei
    // Umwegschritte drehten sich im Rueckweg mit, der DIREKTE Faktor
    // aber nicht - er wurde weiter gegen das Verhaeltnis des Hinwegs
    // geprueft. Eine Gruppe, die richtig gerechnet hatte, bekam auf dem
    // Rueckweg zu hoeren, ihr direkter Faktor stimme nicht.
    // Gemessen: Rueckweg mit korrekten Werten - «Alle drei Schritte des
    // Rueckwegs passen. Der direkte Streckfaktor stimmt noch nicht.»
    const soll = rw ? +fig[0].dataset.groesse / +fig[3].dataset.groesse
                    : +fig[3].dataset.groesse / +fig[0].dataset.groesse;
    const ok = Math.abs(_alsZahl(KETTE.direkt) - soll) < 0.01 &&
               fig[0].dataset.klasse === fig[3].dataset.klasse;
    if (KETTE.feld)
      KETTE.feld.style.borderColor = ok ? F.richtig() : F.falsch();
    satz += ok ? '  Der direkte Streckfaktor stimmt.'
               : '  Der direkte Streckfaktor stimmt noch nicht.';
    // Erst wenn ALLES stimmt, dreht sich der Weg - von selbst.
    if (!rw && richtig === 3 && ok) drehen = true;
  } else {
    satz += '  Das Feld auf dem direkten Pfeil ist noch leer.';
  }
  meldung.textContent = satz;
  if (drehen){
    // Einen Augenblick stehen lassen: Wer gerade fertig geworden ist,
    // soll seine gruenen Marken noch sehen, bevor sich das Bild dreht.
    setTimeout(() => {
      const kn = document.getElementById('rueckweg');
      rueckwegStarten(kn);
    }, 1200);
  }
}

function auslegen(teilmenge){
  // FEHLERBEHOBEN (2026-08-27, Maurus' Rueckmeldung ueber kasper-7b):
  // «Mehr Karten» rief bisher immer auslegen() ohne Argument auf - das
  // legt ALLE Karten neu aus und zerstoert damit jede schon gebildete
  // Gruppe. `teilmenge` laesst den Aufrufer sagen, welche Karten neu
  // verteilt werden sollen; ohne Angabe bleibt das Verhalten wie bisher
  // (voller Reset, gebraucht von zurueck() und beim ersten Aufbau).
  if (FLAECHE === 'buendel'){ buendelAufbau(); buendelLegen(); return; }
  if (FLAECHE === 'kette'){ kettenAufbau(); kettenStreuen(); return; }
  const h = Math.round(breite * 0.844);
  const zu = teilmenge || karten.filter(k => k.dataset.rolle !== 'ablage');
  const bereiche = [];
  if (!BRETT && QUER){
    // Quer geteilt: Der Vorrat hat die ganze Breite und beginnt unter
    // der Trennlinie. Der dritte Wert eines Bereichs ist seine
    // Oberkante - dieselbe Mechanik, die das breite Brett schon nutzt.
    bereiche.push([4, Math.max(60, tisch.clientWidth - 6), grenzeY() + 22]);
  } else if (!BRETT){
    const grenze = HAELFTEN ? tisch.clientWidth * HAELFTEN.teiler : tisch.clientWidth;
    bereiche.push([4, Math.max(60, grenze - 10)]);
  } else {
    const bx = parseFloat(brett.style.left) || 0, bw = brett.offsetWidth;
    const by = parseFloat(brett.style.top) || 0, bh = brett.offsetHeight;
    const luft = Math.max(8, breite * 0.35);   // Abstand zum Brett, mitwachsend
    if (BRETT.unten){
      // Breites Brett: die Karten gehoeren unter die Felder, nicht an den
      // Rand gequetscht. Der dritte Wert eines Bereichs ist seine Oberkante.
      bereiche.push([4, Math.max(60, tisch.clientWidth - 6), by + bh + luft]);
    } else {
      if (bx - luft > breite * 0.8) bereiche.push([4, bx - luft]);
      const rechts = bx + bw + luft;
      if (tisch.clientWidth - rechts > breite * 0.8)
        bereiche.push([rechts, tisch.clientWidth - 6]);
    }
    if (!bereiche.length) bereiche.push([4, Math.max(60, tisch.clientWidth - 6)]);
  }
  // Plaetze auf einem versetzten Gitter verteilen und mischen: die Karten
  // liegen durcheinander, verdecken sich aber nicht gegenseitig.
  const hoch = Math.max(20, tisch.clientHeight - 16);
  if (SORTIERT && bereiche.length === 1){
    nachSorten(zu, bereiche[0][0], bereiche[0][1], hoch, h, bereiche[0][2]);
    return;
  }
  const plaetze = [];
  bereiche.forEach(([x0, x1, oben]) => {
    const y0 = (oben === undefined) ? KOPF : oben;
    const nx = Math.max(1, Math.floor((x1 - x0) / (breite * 0.62)));
    const ny = Math.max(1, Math.floor((hoch - y0) / (h * 0.52)));
    for (let r = 0; r < ny; r++)
      for (let c = 0; c < nx; c++)
        plaetze.push([x0 + c * ((x1 - x0 - breite) / Math.max(1, nx - 1) || 0),
                      y0 + r * ((hoch - y0 - h) / Math.max(1, ny - 1) || 0), x1]);
  });
  for (let i = plaetze.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [plaetze[i], plaetze[j]] = [plaetze[j], plaetze[i]];
  }
  zu.forEach((k, i) => {
    const p = plaetze[i % plaetze.length] || [8, 8, tisch.clientWidth];
    /* FEHLERBEHOBEN (2026-09-17, Rikes Frage «gehen die Karten wieder
       zurueck auf den Durcheinanderstapel?»).

       URSACHE: auslegen() warf die Karten neu auf den Tisch, loeste sie
       aber nie aus ihrem Feld. `_feld` und `_platz` blieben stehen, die
       Karte behielt sogar die Klasse `rastet`. Die Flaeche behauptete
       danach eine Zuordnung, die nirgends zu sehen war.

       GEMESSEN an variante_5, Fund 4 · 8 = 32 im ersten Feld, danach
       «Zurueck zum Ursprung»: Die drei Karten lagen auf (7,498),
       (180,215) und (87,91) - also mitten im Vorrat, das Feld beginnt
       erst bei (814,313) -, und der Pruefknopf meldete trotzdem «1 von
       1 Feld stimmt». Dasselbe ueber den Grad-Knopf und ueber «Neue
       Runde»; alle drei laufen durch auslegen().

       Wer neu auslegt, legt lose aus. Wird eine Karte physisch auf den
       Stapel geworfen, ist sie in keinem Feld mehr - das gehoert an
       diese Stelle und nicht in jeden einzelnen Aufrufer. */
    k._feld = undefined; k.classList.remove('rastet');
    k._rot = GEDREHT ? (Math.random() * 12 - 6).toFixed(1) : 0;
    const xmax = Math.min(tisch.clientWidth, p[2] === undefined
                          ? tisch.clientWidth : p[2]) - breite - 4;
    aufTisch(k,
      Math.max(2, Math.min(xmax,
                           p[0] + (Math.random() * breite * 0.22 - breite * 0.11))),
      Math.max(2, Math.min(tisch.clientHeight - h - 4,
                           p[1] + (Math.random() * h * 0.20 - h * 0.10))));
    k.style.zIndex = ++z;
  });
  loeschenMarken();
}

function zurueck(){
  // Stellt den Zustand vom Oeffnen wieder her.
  const heim = k => {
    k.style.transform = ''; k._x = k._y = 0; k.style.zIndex = '';
    k._rot = 0; k._feld = undefined; k.classList.remove('rastet');
    k._heim.appendChild(k);
  };
  // NEU (2026-09-13): 'reihe' steht ueberall dort, wo bisher 'tisch'
  // und 'runden' standen - die Karten liegen von Anfang an offen da,
  // werden gleich ausgelegt und gleich zurueckgesetzt. Verschieden ist
  // nur das Pruefen (reihePruefen statt Gruppenvergleich). Beim ersten
  // Bauen fehlte 'reihe' in dieser Liste, und die elf Karten lagen
  // unsichtbar uebereinander in der linken oberen Ecke.
  //
  // «Zurueck zum Ursprung» hebt auch die Handmarke auf - sonst blieben
  // die einmal gelegten Karten von jedem spaeteren Ordnen ausgenommen,
  // und der Ursprung waere keiner.
  karten.forEach(k => { k._gelegt = false; });
  /* NEU (2026-09-18): Die GRUPPENNAMEN gehen hier mit, wie bei «Neue
     Runde» (siehe satzZeigen). Der Knopf verspricht den Zustand vom
     Oeffnen - und beim Oeffnen stand in keinem Feld ein Name. Blieben
     sie stehen, waere der Anregungsknopf ueber einem frisch geraeumten
     Tisch wach, weil ein Name von vorhin uebrig ist. Genau das sollte
     die Sperre verhindern.

     Die damals danebenstehende offene Frage - ob der Knopf auch die
     NACHGELEGTEN Figuren wegnimmt - ist am 2026-09-19 beantwortet:
     Er nimmt sie mit. Siehe nachschubZurueck() weiter unten. */
  if (typeof feldTitel !== 'undefined'){
    feldTitel.length = 0;
    document.querySelectorAll('.rasterfeld input.titel')
            .forEach(e => { e.value = ''; });
  }
  /* NEU (2026-09-19, Rikes Entscheidung): Der NACHSCHUB geht mit zurueck.
     Das war die offene Frage aus Uebergabe 3.2 - jetzt beantwortet:
     «nachschub zurücknehmen».

     Gemessen war 7 -> 12 -> 12: Wer nachlegen liess und danach «Zurueck
     zum Ursprung» drueckte, bekam die zwoelf Karten wieder, nicht die
     sieben vom Oeffnen. Der Knopf verspricht den Zustand vom Oeffnen
     und hielt die Haelfte davon.

     Die Umsetzung steht im NACHSCHUB-Block, weil STUFE und die
     Knopfbeschriftung dort zu Hause sind; hier wird sie nur gerufen.
     `heim` geht mit, damit die zurueckgenommenen Karten denselben Weg
     gehen wie alle anderen. */
  if (window.nachschubZurueck) window.nachschubZurueck(heim);
  if (FLAECHE === 'tisch' || FLAECHE === 'runden' || FLAECHE === 'reihe'){
    karten.filter(k => k.dataset.rolle === 'ablage').forEach(heim);
    auslegen(); meldung.textContent = ''; return;
  }
  karten.forEach(heim);
  loeschenMarken(); meldung.textContent = '';
}

// ---------------------------------------------------------------- Reihe
// NEU (2026-09-13, Rikes Auftrag «nach Groesse ordnen»): Bis hierher
// konnte die Flaeche nur GRUPPEN pruefen - sie schaut, welche Karten
// nebeneinanderliegen, und vergleicht deren data-gruppe. Eine
// Reihenfolge laesst sich damit nicht beurteilen: Ob 2^3 links von 3^2
// liegt, ist keine Frage der Gruppenzugehoerigkeit.
//
// Diese Pruefung liest data-wert und schaut auf die Uebergaenge von
// links nach rechts. Gleich grosse Karten duerfen in beliebiger
// Reihenfolge stehen - deshalb wird auf «nicht kleiner» geprueft und
// nicht auf «groesser».
//
// WAS SIE NICHT SAGT (agent/02): mit welchem Wert gerechnet wurde und
// wohin eine Karte gehoert. Sie meldet, WIE VIELE Uebergaenge stimmen,
// und markiert auf den zweiten Druck die Karten an einem Bruch. Die
// Werte stehen nirgends - sonst waere das Ordnen erledigt, bevor es
// beginnt.
// Die Reihe als SPALTEN lesen.
//
// NEU (2026-09-13, Rikes Entscheidung): Gleich grosse Karten werden
// UEBEREINANDER gelegt, nicht nebeneinander. Damit ist die Gleichheit
// sichtbar und wird zur Aussage der Gruppe - dass drei Nullkarten auf
// einem Stapel landen, ist der Ertrag der Aufgabe und soll nicht bloss
// im Pruefknopf stecken.
//
// Gelesen wird deshalb in SPALTEN: Karten, deren Mitten waagrecht nahe
// beieinanderliegen, bilden eine Spalte. Die Spalten werden von links
// nach rechts verglichen, innerhalb einer Spalte muessen alle Karten
// denselben Wert haben.
//
// Der Preis: Ein Stapel und ein Zeilenumbruch waeren beide «Karte liegt
// tiefer», also muss eine Runde in EINE Zeile passen. Deshalb haben die
// Saetze hoechstens neun verschiedene Werte.
/* Einrasten in die nummerierten Felder der Reihe.

   NEU (2026-09-13, Rikes Auftrag): Vorher lagen die Karten frei, und die
   Pruefung leitete die Spalten aus den Abstaenden ab. Das ging, war aber
   auf saubere Ablage angewiesen - eine Karte auf halbem Weg zwischen
   zwei Spalten war nicht eindeutig zuzuordnen.

   Jetzt rasten die Karten in Felder ein, und die Pruefung liest die
   FELDNUMMER. Damit ist die Zuordnung eindeutig, und ein Zeilenumbruch
   der Feldreihe spielt keine Rolle mehr - die Nummer zaehlt, nicht der
   Ort.

   Ein Feld nimmt BELIEBIG VIELE Karten auf, anders als die Felder eines
   Bretts. Gleich grosse Karten gehoeren ins selbe Feld, und wie viele
   das am Ende sind, ist Teil der Aufgabe. Sie werden untereinander
   gesetzt, vollstaendig sichtbar. */
let reiheTiefe = 0, rasterTiefe = 0;          // wie viele Karten liegen im vollsten Feld

/* Ein Feld an Stelle `i` einschieben; alles rechts davon rueckt auf. */
function feldEinschieben(i){
  karten.forEach(k => { if (k._feld !== undefined && k._feld >= i) k._feld += 1; });
  feldAnzahl += 1;
  einpassen();
  rasterZeichnen(true);
  reiheAllesSetzen();
  loeschenMarken();
  meldung.textContent = '';
}

function reiheAllesSetzen(){
  reiheFelder().forEach(f => reiheSetzen(f, Number(f.dataset.nr)));
}

function reiheFelder(){
  return [...document.querySelectorAll('.rasterfeld')]
           .filter(d => d.dataset.nr !== undefined)
           .sort((a, b) => Number(a.dataset.nr) - Number(b.dataset.nr));
}

function reiheSetzen(feld, nr){
  // Alle Karten dieses Feldes neu untereinander setzen.
  const h = Math.round(breite * 0.844);
  const x = parseFloat(feld.style.left), y = parseFloat(feld.style.top);
  const bw = parseFloat(feld.style.width), bh = parseFloat(feld.style.height);
  const drin = karten.filter(a => a._feld === nr && a.style.display !== 'none');
  const luft = Math.max(2, h * 0.08);
  const schritt = drin.length > 1
      ? Math.min(h + luft, Math.max(h * 0.5, (bh - 8 - h) / (drin.length - 1)))
      : 0;
  drin.forEach((a, i) => {
    a._rot = 0;
    a.classList.add('rastet');
    setzen(a, x + Math.max(2, (bw - breite) / 2), y + 4 + i * schritt);
  });
}

/* Einrasten in Rasterfelder, fuer die Flaechen mit Gruppen.

   NEU (2026-09-13): Dasselbe wie bei der Reihe, nur liegen die Karten
   im Feld als Gitter statt als Spalte. Der Gewinn ist derselbe: Die
   Zuordnung steht in der FELDNUMMER und nicht in den Abstaenden - die
   Pruefung haengt nicht mehr daran, wie sauber gelegt wurde.

   Zusatzfelder («passt zu keiner Gruppe») tragen keine Nummer; sie
   bekommen die Kennung 'z'. */
function alleRasterfelder(){
  return [...document.querySelectorAll('.rasterfeld')]
           .filter(d => !d.classList.contains('neu'));
}

function feldKennung(d){
  return d.dataset.zusatz === '1' ? 'z' : Number(d.dataset.nr);
}

function feldNeuSetzen(kennung){
  const d = alleRasterfelder().find(f => feldKennung(f) === kennung);
  if (!d) return;
  const drin = karten.filter(a => a._feld === kennung && a.style.display !== 'none');
  lege(drin, parseFloat(d.style.left), parseFloat(d.style.top),
       parseFloat(d.style.width), parseFloat(d.style.height));
}

function rasterEinrasten(k){
  const h = Math.round(breite * 0.844);
  const mx = k._x + breite / 2, my = k._y + h / 2;
  for (const d of alleRasterfelder()){
    const x = parseFloat(d.style.left), y = parseFloat(d.style.top);
    const bw = parseFloat(d.style.width), bh = parseFloat(d.style.height);
    if (mx >= x && mx <= x + bw && my >= y && my <= y + bh){
      const alt = k._feld;
      k._feld = feldKennung(d);
      k.classList.add('rastet');
      // Im Rechenfeld entscheidet der Ablegeort, welcher der drei
      // Plaetze gemeint ist - sonst koennte die Gruppe nicht sagen,
      // welche Karte das Ergebnis sein soll.
      if (RASTER.rechnung){
        const [px] = rechenPlaetze(bw);
        let best = 0;
        px.forEach((v, j) => {
          if (Math.abs(mx - x - v - breite / 2)
              < Math.abs(mx - x - px[best] - breite / 2)) best = j;
        });
        k._platz = best;
      }
      // Ist diese Gruppe jetzt die vollste, muessen Felder und Karten
      // neu gerechnet werden - sonst wuerde die letzte Karte verdeckt.
      const drin = karten.filter(a => a._feld === k._feld
                                   && a.style.display !== 'none').length;
      if (drin > (rasterTiefe || 0)){
        rasterTiefe = drin;
        einpassenWennAutomatisch(); rasterZeichnen(true);
        alleRasterfelder().forEach(f => feldNeuSetzen(feldKennung(f)));
        if (window.knopfWirkung) window.knopfWirkung();
        return true;
      }
      feldNeuSetzen(k._feld);
      if (alt !== undefined && alt !== k._feld) feldNeuSetzen(alt);
      if (window.knopfWirkung) window.knopfWirkung();
      return true;
    }
  }
  if (k._feld !== undefined){
    const alt = k._feld;
    k._feld = undefined;
    k.classList.remove('rastet');
    feldNeuSetzen(alt);
  }
  if (window.knopfWirkung) window.knopfWirkung();
  return false;
}

/* NEU (2026-10-12, Rikes Entscheidung «Feld hat keine»).

   Die Reihe kannte bis hierher nur ihre NUMMERIERTEN Felder. Ein
   Zusatzfeld («hat dazu keinen Wert») wurde gezeichnet und war taub:
   Die Karte lag sichtbar darin, bekam aber keine Feldkennung - und
   damit blieb der Pruefknopf fuer immer auf «noch 1». Am Bildschirm
   gemessen, bevor es gebaut wurde.

   Warum die Reihe so ein Feld ueberhaupt braucht: Es gibt Fragen, zu
   denen eine Karte keinen Wert hat - die konstante Funktion hat keine
   Nullstelle. Sie gehoert dann nicht an einen Platz der Reihe, aber
   auch nicht zurueck in den Vorrat, denn sie IST einsortiert, und zwar
   richtig. Genau dafuer ist das Zusatzfeld da.

   Die Pruefung der Reihe liest weiterhin nur `data-nr` und uebergeht
   diese Karten damit von selbst (siehe reiheFelder). Was im Zusatzfeld
   liegt, wird also NICHT geprueft - das ist eine offene Luecke und
   steht bei der Aktivitaet unter «worauf zu achten ist». */
function zusatzEinrasten(k){
  const h = Math.round(breite * 0.844);
  const mx = k._x + breite / 2, my = k._y + h / 2;
  for (const d of alleRasterfelder()){
    if (d.dataset.zusatz !== '1') continue;
    const x = parseFloat(d.style.left), y = parseFloat(d.style.top);
    const bw = parseFloat(d.style.width), bh = parseFloat(d.style.height);
    if (mx >= x && mx <= x + bw && my >= y && my <= y + bh){
      const alt = k._feld;
      k._feld = 'z';
      k.classList.add('rastet');
      feldNeuSetzen('z');
      if (alt !== undefined && alt !== 'z'){
        const af = reiheFelder().find(f => Number(f.dataset.nr) === alt);
        if (af) reiheSetzen(af, alt);
      }
      if (window.knopfWirkung) window.knopfWirkung();
      return true;
    }
  }
  return false;
}

function reiheEinrasten(k){
  const h = Math.round(breite * 0.844);
  const mx = k._x + breite / 2, my = k._y + h / 2;
  const felder = reiheFelder();
  for (const f of felder){
    const x = parseFloat(f.style.left), y = parseFloat(f.style.top);
    const bw = parseFloat(f.style.width), bh = parseFloat(f.style.height);
    if (mx >= x && mx <= x + bw && my >= y - h * 0.3 && my <= y + bh + h * 0.3){
      const alt = k._feld;
      k._feld = Number(f.dataset.nr);
      // Ist dieses Feld jetzt voller als alle bisherigen, muss die ganze
      // Reihe neu gerechnet werden - Karten und Felder werden kleiner.
      const drin = karten.filter(a => a._feld === k._feld
                                   && a.style.display !== 'none').length;
      if (drin > (reiheTiefe || 0)){
        reiheTiefe = drin;
        einpassenWennAutomatisch(); rasterZeichnen(true);
        reiheAllesSetzen();
        if (window.knopfWirkung) window.knopfWirkung();
        return true;
      }
      reiheSetzen(f, k._feld);
      if (alt !== undefined && alt !== k._feld){
        const af = felder.find(d => Number(d.dataset.nr) === alt);
        if (af) reiheSetzen(af, alt);
      }
      if (window.knopfWirkung) window.knopfWirkung();
      return true;
    }
  }
  // Kein nummeriertes Feld getroffen - vielleicht das Zusatzfeld.
  if (zusatzEinrasten(k)) return true;
  if (k._feld !== undefined){
    const alt = k._feld;
    k._feld = undefined;
    k.classList.remove('rastet');
    if (alt === 'z'){
      feldNeuSetzen('z');
    } else {
      const af = felder.find(d => Number(d.dataset.nr) === alt);
      if (af) reiheSetzen(af, alt);
    }
  }
  if (window.knopfWirkung) window.knopfWirkung();
  return false;
}

function spalten(liste){
  const nah = breite * 0.55;
  const sortiert = liste.slice().sort((a, b) => a._x - b._x);
  const aus = [];
  sortiert.forEach(k => {
    const letzte = aus[aus.length - 1];
    if (letzte && Math.abs(k._x - letzte.x) <= nah) letzte.karten.push(k);
    else aus.push({x: k._x, karten: [k]});
  });
  return aus;
}

/* Die richtige Loesung hinlegen.

   Zwei Faelle, mehr gibt es nicht:
   - Reihe:  nach Wert sortieren, Gleiches auf einen Stapel.
   - Felder: jede Gruppe in ein Rasterfeld, Karten ohne Gruppe ins
             Zusatzfeld, wenn es eines gibt.

   Gerufen wird das NUR ueber den Knopf «Aufloesen», und der wirkt erst
   nach einem Prueflauf. Die Loesung steht also nirgends, wo die Klasse
   sie liest, bevor sie gearbeitet hat (agent/02). */
function loesungLegen(liste){
  loeschenMarken();
  const h = Math.round(breite * 0.844);
  if (FLAECHE === 'reihe'){
    const nach = liste.slice().sort((a, b) => Number(a.dataset.wert) - Number(b.dataset.wert));
    // Erst die noetige Zahl Felder herstellen, dann Wert fuer Wert
    // hineinlegen. Gleich grosse Karten kommen ins selbe Feld.
    const werte = [];
    nach.forEach(k => { const v = Number(k.dataset.wert);
                        if (!werte.includes(v)) werte.push(v); });
    feldAnzahl = Math.max(feldAnzahl, werte.length);
    if (rasterKnopf){ rasterKnopf.classList.add('an'); rasterZeichnen(true); }
    const felder = reiheFelder();
    nach.forEach(k => { k._feld = werte.indexOf(Number(k.dataset.wert)); });
    werte.forEach((v, i) => { if (felder[i]) reiheSetzen(felder[i], i); });
    return;
  }
  // Felderfall: nach Gruppe sammeln, Reihenfolge wie im Kartenvorrat.
  const gruppen = [];
  liste.forEach(k => { const g = k.dataset.gruppe || '';
                       if (!gruppen.includes(g)) gruppen.push(g); });
  const mitGruppe = gruppen.filter(g => g);
  feldAnzahl = Math.max(feldAnzahl, mitGruppe.length);
  if (RASTER && rasterKnopf) { rasterKnopf.classList.add('an'); rasterZeichnen(true); }
  // Nach der Feldnummer, nicht nach der DOM-Folge - siehe feld().
  const felder = [...document.querySelectorAll('.rasterfeld')]
                   .filter(d => !d.classList.contains('neu') && d.dataset.nr !== undefined)
                   .sort((a, b) => Number(a.dataset.nr) - Number(b.dataset.nr));
  const zusatzfelder = [...document.querySelectorAll('.rasterfeld')]
                   .filter(d => d.dataset.zusatz === '1');
  mitGruppe.forEach((g, i) => {
    const f = felder[i];
    if (!f) return;
    const x = parseFloat(f.style.left), y = parseFloat(f.style.top);
    const bw = parseFloat(f.style.width);
    const bh = parseFloat(f.style.height);
    const drin = liste.filter(k => (k.dataset.gruppe || '') === g);
    drin.forEach(k => { k._feld = Number(f.dataset.nr); });
    lege(drin, x, y, bw, bh);
  });
  const ohne = liste.filter(k => !(k.dataset.gruppe || ''));
  const zusatz = zusatzfelder[0] || felder[mitGruppe.length];
  if (ohne.length && zusatz){
    ohne.forEach(k => { k._feld = zusatz.dataset.zusatz === '1'
                                  ? 'z' : Number(zusatz.dataset.nr); });
    lege(ohne, parseFloat(zusatz.style.left), parseFloat(zusatz.style.top),
         parseFloat(zusatz.style.width), parseFloat(zusatz.style.height));
  }
}

/* Karten in ein Feld legen, ohne dass sie hinausragen oder die
   Beschriftung verdecken.

   Die Beschriftung steht oben im Feld, deshalb beginnt die erste Reihe
   darunter. Passen die Karten nicht nebeneinander, ueberlappen sie -
   aber so, dass die LETZTE noch ganz im Feld liegt. Das ist die
   Bedingung aus agent/06: durcheinander ja, ueberlappend ja,
   verdeckt nein. */
/* Wie viele Karten passen nebeneinander in ein Feld dieser Breite? */
function proReihe(bw){
  return Math.max(1, Math.floor((bw - 8) / (breite + 4)));
}

/* Wie viele Zeilen braucht das vollste Feld? Danach richtet sich die
   Feldhoehe - und notfalls die Kartengroesse. */
function tiefsteBelegung(){
  const zaehl = {};
  karten.forEach(k => { if (k._feld !== undefined && k.style.display !== 'none')
                          zaehl[k._feld] = (zaehl[k._feld] || 0) + 1; });
  return Math.max(1, ...Object.values(zaehl), 1);
}

function lege(drin, x, y, bw, bh){
  if (!drin.length) return;
  const h = Math.round(breite * 0.844);
  // Die Beschriftung sitzt oben im Feld und ist rund 26 px hoch. Bei
  // 20 lag die erste Kartenreihe darauf - «gleicher Wert» war halb
  // verdeckt, und damit war der Feldname weg, der die Aufgabe stellt.
  const kopf = 30;
  // GEAENDERT (2026-09-14, Rikes Beobachtung): Vorher wurden die Karten
  // enger und enger geschoben, je mehr in ein Feld kamen - «dann kann
  // ich die Zahlen gar nicht mehr sehen». Das verstoesst gegen agent/06:
  // «Durcheinander ja, ueberlappend ja - verdeckt nein.»
  //
  // Jetzt wird NICHT mehr gestapelt. Die Karten liegen im Gitter mit
  // vollem Abstand; passt das nicht, waechst das FELD (rasterZeichnen)
  // und notfalls wird die Karte kleiner (einpassen). Das Feld richtet
  // sich nach den Karten, nicht die Karten nach dem Feld.
  // RECHENFELD (2026-09-14, Rikes Auftrag): «Man sieht nicht genau,
  // welche zwei geben die dritte.» Im Fundfeld stehen deshalb drei feste
  // Plaetze mit · und = dazwischen. Die Karte rutscht auf den naechsten
  // freien Platz, und damit steht auf dem Tisch: erstes · zweites =
  // drittes. Eine vierte Karte im selben Feld faellt darunter - sie ist
  // dann sichtbar zu viel, und genau das soll sie sein.
  if (RASTER && RASTER.rechnung){
    const [px] = rechenPlaetze(bw);
    const belegt = [null, null, null], ueber = [];
    drin.forEach(k => {
      const w = Math.min(2, Math.max(0, k._platz || 0));
      if (belegt[w] === null){ belegt[w] = k; return; }
      const frei = belegt.indexOf(null);
      if (frei >= 0){ belegt[frei] = k; k._platz = frei; } else ueber.push(k);
    });
    belegt.forEach((k, j) => {
      if (!k) return;
      k._rot = 0; aufTisch(k, x + px[j], y + kopf); k.style.zIndex = ++z;
    });
    ueber.forEach((k, j) => {
      k._rot = 0; aufTisch(k, x + px[Math.min(2, j)], y + kopf + h + 6);
      k.style.zIndex = ++z;
    });
    return;
  }
  const spalten = Math.min(drin.length, proReihe(bw));
  drin.forEach((k, j) => {
    k._rot = 0;
    aufTisch(k, x + 4 + (j % spalten) * (breite + 4),
                y + kopf + Math.floor(j / spalten) * (h + 4));
    k.style.zIndex = ++z;
  });
}

/* Die drei Plaetze im Rechenfeld: linke Kanten und die Luecke zwischen
   ihnen, in der die Zeichen stehen. */
function rechenPlaetze(bw){
  const pad = 5;
  const luecke = Math.max(14, (bw - 2 * pad - 3 * breite) / 2);
  return [[0, 1, 2].map(j => pad + j * (breite + luecke)), luecke];
}

/* Prueft Funde: In jedem belegten Feld muessen DREI Karten liegen, von
   denen eine das Produkt der beiden anderen ist.

   sein? Vielleicht nicht, das macht den Charme aus.» Also wird NICHT
   gegen eine hinterlegte Loesung geprueft - der Satz hat nnen bis
   zwanzig Funde, und welche drei eine Gruppe legt, ist ihre Sache.
   Geprueft wird gegen die Sache selbst.

/* ---------- Pruefen: Vielfachenreihen ----------

   theoretisch in mehreren Reihen vorkommen. Ziel ist, die Karten so zu
   legen, dass moeglichst wenig uebrig bleibt.»

   Eine Reihe gilt, wenn sie mindestens DREI Karten hat und jede Karte
   ein Vielfaches der kleinsten ist. Drei und nicht zwei: Zwei Karten
   sind immer eine Reihe, sobald die eine die andere teilt - damit waere
   die Aufgabe keine.

   Geprueft wird NACHGERECHNET, nicht gegen eine Loesung verglichen -
   wie beim Fundsuchen und aus demselben Grund: Es gibt mehrere beste
   Legungen, und welche eine Gruppe findet, ist ihre Antwort.

   WAS SIE NICHT SAGT: wie wenige Karten uebrig bleiben KOENNTEN. Das

   nicht in eine Meldezeile (agent/02). */
function reihenPruefen(){

                              && k.style.display !== 'none');

  if (!drin.length){
    meldung.textContent = 'Legt eine Reihe in ein Feld: eine Zahl und mindestens zwei ihrer Vielfachen.';
    return;
  }

  drin.forEach(k => { (nach[k._feld] = nach[k._feld] || []).push(k); });

  const schlecht = new Set();
  let stimmt = 0, felder = 0;
  Object.values(nach).forEach(gr => {
    felder++;
    const werte = gr.map(k => Number(k.dataset.wert));
    const klein = Math.min.apply(null, werte);
    const ok = gr.length >= 3
            && klein > 0
            && werte.every(w => w % klein === 0)
            && new Set(werte).size === werte.length;

    else gr.forEach(k => schlecht.add(k));

function reihePruefen(){
  const alle = karten.filter(k => k.dataset.wert !== undefined
                               && k.style.display !== 'none');

  // Karten im Vorrat liegen, ist jede Rueckmeldung eine Teilauskunft -

  // denken. Die Gruppe sagt mit dem letzten Ablegen selbst, dass sie

  const offen = alle.filter(k => k._feld === undefined);

      ? 'Eine Karte liegt noch nicht in einem Feld.'

    pruefstufe = 1;
    return;
  }
  if (alle.length < 2){ meldung.textContent = 'Auf der Fläche liegt noch nichts.'; return; }
  echteRuefung = true;
  if (window.knopfWirkung) window.knopfWirkung();

  // Gelesen wird ueber die FELDNUMMER, nicht ueber den Ort. Leere
  // Felder werden uebersprungen - eine Luecke ist kein Fehler, sie
  // entsteht beim Einschieben.
  const nach = {};
  alle.forEach(k => { (nach[k._feld] = nach[k._feld] || []).push(k); });
  const nummern = Object.keys(nach).map(Number).sort((x, y) => x - y);
  const w = k => Number(k.dataset.wert);

  const schlecht = new Set();
  let brueche = 0, stellen = 0;
  nummern.forEach(n => {
    stellen++;
    const werte = new Set(nach[n].map(w));
    if (werte.size > 1){ brueche++; nach[n].forEach(k => schlecht.add(k)); }
  });
  for (let i = 0; i < nummern.length - 1; i++){
    stellen++;

      brueche++;
      nach[nummern[i]].forEach(k => schlecht.add(k));
      nach[nummern[i + 1]].forEach(k => schlecht.add(k));
    }
  }

  if (pruefstufe === 1){                       // zweiter Druck: markieren
    pruefstufe = 2;
    loeschenMarken();
    alle.forEach(k => k.classList.add(schlecht.has(k) ? 'falsch' : 'richtig'));
    return;
  }
  loeschenMarken();
  pruefstufe = 1;
  meldung.textContent = brueche === 0
    ? 'Die Reihe stimmt durchgehend — alle ' + stellen + ' Stellen.'
    : (stellen - brueche) + ' von ' + stellen + ' Stellen stimmen.' +
      '  Nochmals drücken zeigt, wo es hakt.';
}

function loeschenMarken(){
  if (typeof KETTE !== 'undefined' && KETTE.feld)
    KETTE.feld.style.borderColor = '';

  // loeschenMarken() laeuft bei jedem Satzwechsel.
  karten.forEach(k => k.classList.remove('falsch', 'richtig', 'anregung'));

function kartenVerdrahten(liste){

/* ---------- Prüfen auf dem Brett: Bereich statt Häufchen ---------- */
function gewaehlteBausteine(){
  const aus = [];
  for (let i = 0; i < BRETT.felder.length; i++){
    const k = karten.find(a => a._feld === i);
    aus.push(k ? (k.dataset.baustein || '') : '');
  }
  return aus;
}

function inKreis(k, i){
  const bw = brett.offsetWidth, bh = brett.offsetHeight;
  const bx = parseFloat(brett.style.left) || 0, by = parseFloat(brett.style.top) || 0;
  const [cx, cy, r] = BRETT.kreise[i];
  const mx = k._x + breite / 2, my = k._y + breite * 0.844 / 2;
  const dx = mx - (bx + cx * bw), dy = my - (by + cy * bh);
  return Math.hypot(dx, dy) <= r * bw;
}

function pruefeBrett(){
  const gewaehlt = gewaehlteBausteine();
  if (!gewaehlt.some(Boolean)){
    meldung.textContent = 'Legt zuerst Bausteinkarten in die Kreise.';
    return null;
  }
  const auf = karten.filter(k => k.parentElement === tisch &&
                                 k.dataset.rolle !== 'ablage' &&
                                 k.dataset.faktoren !== undefined);
  let richtig = 0, falsch = 0;
  const marken = [];
  auf.forEach(k => {
    const hat = k.dataset.faktoren.split(' ').filter(Boolean);
    let ok = true;
    for (let i = 0; i < gewaehlt.length; i++){
      if (!gewaehlt[i]) continue;
      const soll = hat.indexOf(gewaehlt[i]) >= 0;
      if (soll !== inKreis(k, i)) ok = false;
    }
    marken.push([k, ok]);
    ok ? richtig++ : falsch++;
  });
  return {marken, richtig, falsch, gesamt: auf.length};
}

/* ---------- Prüfen: Häufchen erkennen, nicht Felder vorgeben ---------- */
function pruefeRunde(){

    if (k && k.dataset.baustein) gew.push(k.dataset.baustein);
  }
  if (gew.length < aktiveFelder){
    meldung.textContent = 'Legt zuerst ' + aktiveFelder + ' ' +
      (aktiveFelder > 1 ? RTEXT.mehrzahl : RTEXT.einheit) + ' in die Felder.';
    return null;
  }
  const bw = brett.offsetWidth, bh = brett.offsetHeight;
  const bx = parseFloat(brett.style.left) || 0, by = parseFloat(brett.style.top) || 0;
  const [sx, sy, sw, sh] = BRETT.sammel;
  const marken = []; let richtig = 0, fehlt = 0;
  karten.filter(k => k.dataset.faktoren !== undefined).forEach(k => {
    const mx = k._x + breite / 2, my = k._y + breite * 0.844 / 2;
    const drin = k.parentElement === tisch &&
                 mx > bx + sx * bw && mx < bx + (sx + sw) * bw &&
                 my > by + sy * bh && my < by + (sy + sh) * bh;
    const hat = k.dataset.faktoren.split(' ');
    const soll = gew.every(b => hat.indexOf(b) >= 0);
    if (drin || soll) marken.push([k, drin === soll]);
    if (drin && soll) richtig++;
    if (!drin && soll) fehlt++;
  });
  return {marken, richtig, fehlt,
          gesamt: marken.filter(([, ok]) => ok).length +
                  marken.filter(([, ok]) => !ok).length};
}

function pruefen(){

     derselben Flaechenform «runden»:

     REICHWEITE: zwei Aktivitaeten, beide mit `brett="BRETT_VENN"` -

  if (FLAECHE === 'runden' && BRETT && BRETT.sammel){

        ? 'Eine Karte liegt noch nicht in einem Feld.'

  echteRuefung = true;
  if (window.knopfWirkung) window.knopfWirkung();

     ist der Gewinn des Einrastens: Eine Karte am Rand zweier Haufen ist
     nicht mehr mehrdeutig. */
  if (RASTER && RASTER.einrasten){
    const nach = {};
    auf.forEach(k => { (nach[k._feld] = nach[k._feld] || []).push(k); });
    const gesamt0 = {};
    karten.forEach(k => { if (k.style.display === 'none') return;
                          const g = k.dataset.gruppe;
                          if (g) gesamt0[g] = (gesamt0[g] || 0) + 1; });
    let stimmt0 = 0, gruppen0 = 0, rest0 = 0;
    const haufen0 = {};
    Object.entries(nach).forEach(([f, gr]) => {
      haufen0[f] = gr;
      const marken = [...new Set(gr.map(k => k.dataset.gruppe))];
      if (marken.length === 1 && marken[0] === ''){ rest0++; return; }
      gruppen0++;
      const ok = marken.length === 1 && gr.length === gesamt0[marken[0]];
      if (ok) stimmt0++;
    });
    if (pruefstufe === 1){
      pruefstufe = 2;
      loeschenMarken();
      Object.values(haufen0).forEach(gr => {
        const marken = [...new Set(gr.map(k => k.dataset.gruppe))];
        if (marken.length === 1 && marken[0] === '') return;
        const ok = marken.length === 1 && gr.length === gesamt0[marken[0]];
        gr.forEach(k => k.classList.add(ok ? 'richtig' : 'falsch'));
      });
      return;
    }
    loeschenMarken();
    pruefstufe = 1;
    meldung.textContent = gruppen0 + ' Gruppe' + (gruppen0 === 1 ? '' : 'n') +
      ' gelegt, ' + stimmt0 + ' davon vollständig' +
      (rest0 ? ' · dazu ' + rest0 + ' Feld' + (rest0 === 1 ? '' : 'er') +
               ' mit Karten, die nirgends passen' : '') +
      '.  Nochmals drücken zeigt, welche.';
    return;

  if (pruefstufe === 1){                       // zweiter Druck: markieren

  const h = breite * 0.844, dx = breite * 0.55, dy = h * 0.55;
  const vater = auf.map((_, i) => i);
  const finde = i => vater[i] === i ? i : (vater[i] = finde(vater[i]));
  for (let i = 0; i < auf.length; i++)
    for (let j = i + 1; j < auf.length; j++){
      const a = auf[i], b = auf[j];
      const lx = Math.max(0, Math.max(a._x, b._x) - Math.min(a._x, b._x) - breite);
      const ly = Math.max(0, Math.max(a._y, b._y) - Math.min(a._y, b._y) - h);
      if (lx < dx && ly < dy) vater[finde(i)] = finde(j);
    }
  const haufen = {};
  auf.forEach((k, i) => { const w = finde(i); (haufen[w] = haufen[w] || []).push(k); });

  const gesamt = {};
  karten.forEach(k => { const g = k.dataset.gruppe;
                        if (g) gesamt[g] = (gesamt[g] || 0) + 1; });

  let stimmt = 0, gruppen = 0, rest = 0;
  Object.values(haufen).forEach(gr => {
    if (gr.length < 2) return;
    const marken = [...new Set(gr.map(k => k.dataset.gruppe))];
    if (marken.length === 1 && marken[0] === ''){ rest++; return; }
    gruppen++;
    const ok = marken.length === 1 && marken[0] !== '' &&
               gr.length === gesamt[marken[0]];
    if (ok){ stimmt++; gr.forEach(k => k.classList.add('richtig')); }
    else   { gr.forEach(k => k.classList.add('falsch')); }
  });

    ' erkannt, ' + stimmt + ' davon vollständig' +
    (rest ? ' · dazu ' + rest + ' Reststapel' : '') +
    '.  Nochmals drücken zeigt, welche.';
  document.getElementById('pruefen')._merk = haufen;
}

async function bild(still){
  const auf = karten.filter(k => k.parentElement === tisch);
  if (!auf.length){ meldung.textContent = 'Auf der Fläche liegt noch nichts.'; return; }
  const h = Math.round(breite * 0.844);
  let bx = 0, by = 0;
  auf.forEach(k => { bx = Math.max(bx, k._x + breite); by = Math.max(by, k._y + h); });
  document.querySelectorAll('.rasterfeld').forEach(d => {
    if (d.classList.contains('neu')) return;
    bx = Math.max(bx, parseFloat(d.style.left) + parseFloat(d.style.width));
    by = Math.max(by, parseFloat(d.style.top) + parseFloat(d.style.height));
  });
  const s = 2, c = document.createElement('canvas');
  c.width = (bx + 24) * s; c.height = (by + 24) * s;
  const g = c.getContext('2d'); g.scale(s, s);
  g.fillStyle = F.karte(); g.fillRect(0, 0, bx + 24, by + 24);
  // Die Felder gehoeren mit aufs Bild. Bei den frei beschrifteten ist der
  // selbst geschriebene Titel das Ergebnis - die Kartenlage allein sagt
  // ohne ihn nichts.
  document.querySelectorAll('.rasterfeld').forEach(d => {
    if (d.classList.contains('neu')) return;   // Bedienelement, kein Ergebnis
    const x = parseFloat(d.style.left) + 12, y = parseFloat(d.style.top) + 12;
    const w = parseFloat(d.style.width), hh = parseFloat(d.style.height);
    g.save();
    g.strokeStyle = d.style.borderColor || F.rand();
    g.lineWidth = 1.5;
    if (!d.classList.contains('fest')) g.setLineDash([6, 4]);
    g.strokeRect(x, y, w, hh);
    g.setLineDash([]);
    const e = d.querySelector('input.titel'), t = d.querySelector('span');
    const txt = e ? e.value : (t ? t.textContent : '');
    if (txt){
      g.fillStyle = e ? farbe('--tinte') : F.matt();
      g.font = '15px "Patrick Hand", cursive';
      g.textAlign = 'center'; g.textBaseline = 'top';
      g.fillText(txt, x + w / 2, y + 6, w - 16);
    }
    g.restore();
  });
  const sortiert = auf.slice().sort((a, b) => (+a.style.zIndex || 0) - (+b.style.zIndex || 0));
  for (const k of sortiert){
    const b = k.querySelector('img');
    await b.decode().catch(() => {});
    const kw = k.classList.contains('ablage') ? breite * ABL : breite;
    const kh = k.classList.contains('ablage') ? h * ABL : h;
    const w = parseFloat(k._rot || 0);
    if (w){
      g.save();
      g.translate(k._x + 12 + kw / 2, k._y + 12 + kh / 2);
      g.rotate(w * Math.PI / 180);
      g.drawImage(b, -kw / 2, -kh / 2, kw, kh);
      g.restore();
    } else {
      g.drawImage(b, k._x + 12, k._y + 12, kw, kh);
    }
  }
  await new Promise(f => c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = still ? ('runde-' + rundeNr + '.png') : 'sortierergebnis.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    f();
  }));
}

/* ---------- Das Abgabebild ----------

   NEU (2026-10-13, Christine Bürlis Rückmeldung vom 24.09.): «Als LP
   wäre es gut, wenn man die Sortierung anschauen kann. Bei Bild
   speichern wird aber *nur* ein Screenshot gemacht, und wenn die SuS
   alle Kärtchen stapeln, sehe ich als LP nichts. Schön wäre es, wenn es
   ein Abgabe-Format gibt, das die Kärtchen wieder nebeneinander
   darstellt.»

   Der Punkt trifft etwas Grundsätzliches: Die Fläche WEISS mehr, als
   ihr Bild zeigt. Zu jeder Karte ist bekannt, in welchem Feld sie
   liegt und wie die Gruppe dieses Feld benannt hat. Das Abgabebild
   zeichnet diesen Stand neu auf - je Feld eine Zeile, die Karten
   nebeneinander, nichts verdeckt.

   ES ERSETZT «Bild speichern» NICHT, und das ist Absicht: Dass eine
   Gruppe gestapelt hat, ist selbst eine Beobachtung. Das eine Bild
   zeigt, WIE sie gelegt haben, das andere, WAS sie gelegt haben.

   Was frei auf dem Tisch liegt, kommt in eine letzte Zeile - von links
   nach rechts, wie es dort lag. Eine Ordnung ohne Felder lässt sich
   nicht aufräumen, ohne etwas zu behaupten; die Reihenfolge ist das
   Einzige, was wirklich dasteht. */
function abgabeZeilen(){
  const sichtbar = karten.filter(k => k.style.display !== 'none'
                                   && k.dataset.rolle !== 'ablage');
  // NACH NUMMER sortieren, nicht nach DOM-Folge: Die Felder werden mit
  // insertBefore(..., firstChild) eingehaengt und stehen deshalb
  // rueckwaerts. Ohne diese Zeile heisst das erste Feld «Feld 4».
  // Die Zusatzfelder haben keine Nummer und kommen ans Ende.
  const felder = [...document.querySelectorAll('.rasterfeld')]
        .filter(d => !d.classList.contains('neu'))
        .sort((a, b) => {
          const za = a.dataset.zusatz === '1', zb = b.dataset.zusatz === '1';
          if (za !== zb) return za ? 1 : -1;
          return Number(a.dataset.nr || 0) - Number(b.dataset.nr || 0);
        });
  const zeilen = [];
  let nr = 0;
  felder.forEach(d => {
    const zusatz = d.dataset.zusatz === '1';
    const kennung = zusatz ? 'z' : Number(d.dataset.nr);
    const drin = sichtbar.filter(k => k._feld === kennung)
                         .sort((a, b) => (a._x || 0) - (b._x || 0));
    if (!zusatz) nr++;
    if (!drin.length) return;
    const e = d.querySelector('input.titel'), t = d.querySelector('span');
    // Der selbst geschriebene Titel ist das Ergebnis und steht so da.
    // Wo die Gruppe nichts schreiben kann, waere die Feldbeschriftung
    // («eine Zahl») in jeder Zeile dieselbe - dann nummerieren wir
    // lieber. Das Zusatzfeld behaelt seinen Text; der sagt etwas.
    const eigen = !!(e && e.value.trim());
    const titel = eigen ? e.value.trim()
                        : (zusatz && t ? t.textContent : 'Feld ' + nr);
    zeilen.push({titel: titel, eigen: eigen, karten: drin});
  });
  const rest = sichtbar.filter(k => k._feld === undefined)
                       .sort((a, b) => (a._x || 0) - (b._x || 0));
  if (rest.length)
    zeilen.push({titel: 'noch auf dem Tisch', eigen: false, karten: rest});
  return zeilen;
}

async function abgabebild(){
  const zeilen = abgabeZeilen();
  if (!zeilen.length){
    meldung.textContent = 'Auf der Fläche liegt noch nichts.';
    return;
  }
  const kb = 150, kh = Math.round(kb * 0.844);     // feste Kartengroesse
  const luft = 12, kopf = 26, rand = 18;
  // HOECHSTENS ACHT je Zeile. Ohne diese Grenze macht eine einzige
  // Zeile mit neunzehn Karten - der Vorrat zu Beginn - ein Bild von
  // dreitausend Pixeln Breite, das niemand ansehen kann. Laengere
  // Zeilen laufen um; sie bleiben eine Zeile und bekommen nur mehrere
  // Lagen.
  const JE_ZEILE = 8;
  const lagen = z => Math.ceil(z.karten.length / JE_ZEILE);
  const breiteste = Math.min(JE_ZEILE,
        Math.max(...zeilen.map(z => z.karten.length)));
  const w = rand * 2 + breiteste * kb + (breiteste - 1) * luft;
  const h = rand * 2 + zeilen.reduce(
        (a, z) => a + kopf + lagen(z) * (kh + luft), 0);
  const s = 2, c = document.createElement('canvas');
  c.width = w * s; c.height = h * s;
  const g = c.getContext('2d'); g.scale(s, s);
  g.fillStyle = F.karte(); g.fillRect(0, 0, w, h);

  let y = rand;
  for (const z of zeilen){
    g.fillStyle = z.eigen ? farbe('--tinte') : F.matt();
    g.font = (z.eigen ? '17px "Patrick Hand", cursive'
                      : '13px "Fira Sans", sans-serif');
    g.textAlign = 'left'; g.textBaseline = 'top';
    g.fillText(z.titel || ' ', rand, y + 4, w - rand * 2);
    y += kopf;
    let i = 0;
    for (const k of z.karten){
      const b = k.querySelector('img');
      await b.decode().catch(() => {});
      const spalte = i % JE_ZEILE, lage = Math.floor(i / JE_ZEILE);
      g.drawImage(b, rand + spalte * (kb + luft),
                     y + lage * (kh + luft), kb, kh);
      i++;
    }
    y += lagen(z) * (kh + luft);
  }
  await new Promise(f => c.toBlob(b => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'abgabe.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    f();
  }));
  meldung.textContent = 'Abgabebild gespeichert — die Karten stehen darin nebeneinander.';
}

  function nachlegen(wieViele){
    const neue = [];

    for (let i = 0; i < wieViele; i++){
      const dran = [...document.querySelectorAll('.karte[data-stufe="'
                      + (STUFE + 1) + '"]')];
      if (!dran.length) break;
      STUFE++;
      letzter = NACHSCHUB[STUFE - 1] || letzter;
      dran.forEach(k => {

        // `_heim`. Das wird in Zeile 414 EINMAL beim Laden vergeben, und
        // zwar nur fuer die Karten der Stufe null - wer spaeter dazukam,
        // kannte seinen Platz nicht.

        // Karten mit der Rolle «ablage» heim, und die Nachgelegten tragen

    const frisch = neue.filter(k => !k._verdrahtet);

  }

  /* NEU (2026-09-19): Der Rueckweg. Er steht hier und nicht in
     zurueck(), weil STUFE, die Knopfbeschriftung und der Feldzuwachs
     hier zu Hause sind - zurueck() sieht sie gar nicht.

     Was zurueckgenommen wird: die Karten jeder Stufe ueber null. Sie
     verschwinden aus `karten` und werden wieder verborgen, gehen aber
     vorher denselben Heimweg wie alle anderen. Was NICHT
     zurueckgenommen wird: Felder, die jemand selbst geoeffnet hat. */
  window.nachschubZurueck = (heim) => {
    if (!STUFE) return;
    // NUR die, die wirklich im Spiel sind. Die Seite traegt ALLE Karten
    // aller Stufen; die noch nie ausgelegten liegen verborgen da, kennen
    // kein Zuhause und haben hier nichts verloren. `karten` ist die
    // Liste dessen, was liegt - sie ist das richtige Mass.
    const weg = karten.filter(k => +(k.dataset.stufe || 0) > 0);
    weg.forEach(k => {
      if (heim) heim(k);
      k.style.display = 'none';
      const i = karten.indexOf(k);
      if (i >= 0) karten.splice(i, 1);
    });
    STUFE = 0;
    feldAnzahl -= feldZuwachs;
    feldZuwachs = 0;
    if (RASTER) rasterZeichnen(rasterKnopf && rasterKnopf.classList.contains('an'));
    beschriften();
  };

  const knoepfe = [];
  const machKnopf = (id, wieViele, text) => {
    const kn = document.createElement('button');
    kn.id = id;
    kn.dataset.stufen = wieViele;
    kn.textContent = text;
    kn.onclick = () => nachlegen(wieViele);
    const leiste = document.querySelector('.leiste');
    leiste.insertBefore(kn, document.getElementById('bild') || null);
    knoepfe.push(kn);
    return kn;
  };

  function beschriften(){
    const uebrig = stufenUebrig();
    knoepfe.forEach(kn => {
      const will = +kn.dataset.stufen;
      // Der grosse Knopf verschwindet, sobald weniger Stufen uebrig
      // sind, als er nehmen wuerde - sonst verspricht er drei Figuren
      // und legt eine.
      const geht = uebrig >= will;
      kn.disabled = !geht;
      kn.style.display = geht ? '' : 'none';
    });
  }

  machKnopf('mehrkarten', 1, NACHSCHUBSCHRITT > 1
            ? '+ eine Figur' : 'Mehr Karten');
  if (NACHSCHUBSCHRITT > 1)
    machKnopf('mehrkarten_viele', NACHSCHUBSCHRITT,
              '+ ' + NACHSCHUBSCHRITT + ' Figuren');
  beschriften();
}

function zone(){
  // Bereich, in dem das Raster liegt: quer geteilt die ganze Breite
  // (das Brett liegt oben), laengs geteilt die rechte Haelfte, sonst
  // der ganze Tisch.
  if (QUER) return [8, tisch.clientWidth];
  return HAELFTEN ? [tisch.clientWidth * HAELFTEN.teiler + 10, tisch.clientWidth]
                  : [8, tisch.clientWidth];
}

// Anzahl und Beschriftung der Felder sind Zustand, nicht Vorlage: Die Felder
// werden bei jedem Zoom und jeder Fenstergroesse neu gezeichnet, das selbst
// Geschriebene muss das ueberleben. Deshalb steht es hier und nicht im DOM.
let feldAnzahl = RASTER ? RASTER.anzahl : 0;
const feldTitel = [];

/* Wie viele verschiedene Gruppen liegen gerade auf dem Tisch?
   Gebraucht beim Nachlegen: Jede zugeschaltete Figur bringt ihre eigene
   Gruppe mit, und das Raster soll genau so viele Felder zeigen. Karten
   ohne Marke (Distraktoren) zaehlen nicht - fuer sie ist das Restfeld
   da, nicht ein eigenes Gruppenfeld. */
function gruppenAufDemTisch(){
  const g = new Set();
  karten.forEach(k => { if (k.dataset.gruppe) g.add(k.dataset.gruppe); });
  return g.size;
}

function rasterZeichnen(an){
  document.querySelectorAll('.rasterfeld, .einfuegen').forEach(e => e.remove());
  if (!an || !RASTER) return;
  let fw = breite * RASTER.breite;
  let fh = breite * 0.844 * RASTER.hoehe;
  const [zx0, zxEnde] = zone();

  // NEU (2026-08-31, Rikes Auftrag): Ein Zusatzfeld darf jetzt eine
  // SPALTE am rechten Rand sein (wie: "spalte") statt einer Zeile
  // unterhalb. Der Grund steht bei Variante 1: Eine Zeile unten
  // verschiebt sich, sobald oben eine Gruppenzeile dazukommt - und die
  // Karten, die darin lagen, bleiben liegen und stehen ploetzlich in
  // einer fremden Gruppe. Eine Spalte rechts steht fest.
  //
  // Die Spalte nimmt sich ihre Breite VOR den Gruppenfeldern; die
  // bekommen den Rest.
  const zusatzfelder = !RASTER.extra ? []
    : (Array.isArray(RASTER.extra) ? RASTER.extra : [RASTER.extra]);
  const spaltenfelder = zusatzfelder.filter(e => e.wie === 'spalte');
  const zeilenfelder  = zusatzfelder.filter(e => e.wie !== 'spalte');
  const spaltenBreit = spaltenfelder.reduce(
        (a, e) => a + breite * (e.breite || 1.2) + 12, 0);
  const zx1 = zxEnde - spaltenBreit;

  let spalten = Math.max(1, Math.floor((zx1 - zx0 - 6) / (fw + 10)));

  // DIE REIHE BLEIBT EINE ZEILE (Rikes Vorgabe, 2026-09-13). Rutscht ein
  // Feld in eine zweite Zeile, wird die Reihe nicht mehr von links nach
  // rechts gelesen - und genau das ist die Aufgabe. Also: so viele
  // Spalten wie Felder, und die Feldbreite folgt daraus. Kommt ein Feld
  // dazu, werden alle etwas schmaler.
  if (RASTER.einrasten && FLAECHE !== 'reihe'){
    // Das Feld waechst mit der vollsten Gruppe. Alle gleich hoch,
    // sonst stuenden die Felder stufig da.
    const tief = tiefsteBelegung();
    const je = RASTER.rechnung ? 3 : proReihe(fw);
    const reihen = Math.ceil(tief / je);
    const noetig = (30 + reihen * (breite * 0.844 + 4) + 6) / (breite * 0.844);
    fh = breite * 0.844 * Math.max(RASTER.hoehe, noetig);
  }
  if (FLAECHE === 'reihe'){
    const n = feldAnzahl + (RASTER.erweiterbar ? 1 : 0);
    spalten = n;
    // Das Feld ist so breit, wie die Karte es braucht - NICHT so breit,
    // wie die Flaeche geteilt durch die Feldzahl. Erst wenn die Reihe
    // sonst nicht mehr in eine Zeile passt, wird enger gerueckt.
    const platz = ((zx1 - zx0 - 6) - 10 * (n - 1)) / n;
    fw = Math.max(24, Math.min(breite * RASTER.breite, platz));
    // Das Feld waechst mit dem vollsten Feld mit - alle gleich hoch,
    // sonst stuende die Reihe stufig da.
    const belegung = {};
    karten.forEach(k => { if (k._feld !== undefined && k.style.display !== 'none')
                            belegung[k._feld] = (belegung[k._feld] || 0) + 1; });
    const tiefstes = Math.max(1, ...Object.values(belegung));
    fh = breite * 0.844 * Math.max(RASTER.hoehe, tiefstes * 1.08);
  }

  // NEU (2026-08-31): Quer geteilt hat das Brett eine feste Hoehe - die
  // Trennlinie. Passen die Felder samt Zusatzfeldern nicht hinein,
  // werden sie flacher gemacht, statt unter die Linie zu rutschen. Beim
  // ersten Ausprobieren war genau das passiert: «passt zu keiner Figur»
  // und «weiss ich noch nicht» lagen unsichtbar hinter dem Vorrat.
  //
  // Gestaucht wird nur die HOEHE. Die Breite bleibt, weil sie an der
  // Kartenbreite haengt - ein Feld, in das die Karte nicht mehr passt,
  // waere schlimmer als ein flaches.
  if (QUER){
    const zeilen = Math.ceil((feldAnzahl + (RASTER.erweiterbar ? 1 : 0)) / spalten);
    // Die Zusatzfelder haengen an fh (sie halten ihr Verhaeltnis), also
    // steht die Gesamthoehe als Vielfaches von fh da:
    //   zeilen · (fh + 10)  +  groesstes Zusatzfeld · fh/RASTER.hoehe
    const zAnteil = zusatzfelder.length
      ? Math.max(...zusatzfelder.map(e => (e.hoehe || RASTER.hoehe))) / RASTER.hoehe
      : 0;
    const platz = grenzeY() - 26 - 12 - 10 * (zeilen + (zAnteil ? 1 : 0));
    if (zeilen > 0 && platz > 0) fh = Math.min(fh, platz / (zeilen + zAnteil));
    fh = Math.max(breite * 0.5, fh);
  }

  function feld(x, y, w, hh, text, zusatz, nr){
    const d = document.createElement('div');
    d.className = 'rasterfeld';
    // Die Felder werden mit insertBefore(..., firstChild) eingehaengt,
    // stehen im DOM also RUECKWAERTS - und die Zusatzfelder mittendrin.
    // Wer sie der Reihe nach braucht (etwa «Aufloesen»), darf sich
    // deshalb nicht auf die DOM-Folge verlassen. Diese Merkmale sagen,
    // was das Feld ist und das wievielte.
    if (zusatz) d.dataset.zusatz = '1'; else d.dataset.nr = String(nr);
    Object.assign(d.style, {left:x + 'px', top:y + 'px', width:w + 'px',
      height:hh + 'px', borderColor: zusatz ? F.akzent() : F.rand()});
    if (RASTER.frei && !zusatz){
      const e = document.createElement('input');
      e.className = 'titel'; e.type = 'text';
      e.placeholder = text; e.value = feldTitel[nr] || '';
      e.oninput = () => {
        feldTitel[nr] = e.value;
      };
      d.appendChild(e);
    } else {
      const t = document.createElement('span');
      t.textContent = text; d.appendChild(t);
    }
    if (RASTER.rechnung && !zusatz){
      const [px, luecke] = rechenPlaetze(w);
      const kh = breite * 0.844;
      [ZEICHEN, '='].forEach((zeichen, j) => {
        const e = document.createElement('span');
        e.className = 'rechenzeichen';
        e.textContent = zeichen;
        Object.assign(e.style, {
          left: (px[j] + breite) + 'px', top: '30px',
          width: luecke + 'px', height: kh + 'px', lineHeight: kh + 'px',
          // Der Malpunkt ist als Zeichen viel kleiner als das
          // Gleichheitszeichen; ohne den Zuschlag verschwindet er.
          fontSize: Math.round(Math.min(luecke, breite)
                               * (j === 0 ? 1.05 : 0.62)) + 'px'});
        d.appendChild(e);
      });
    }
    tisch.insertBefore(d, tisch.firstChild);
  }

  let r = 0, n = 0;
  // NEU (2026-08-21): `beschriftung` darf eine LISTE sein - dann traegt
  // jedes Feld seine eigene. Gebraucht fuer «Immer - manchmal - nie»:
  // Vorher stand auf allen drei Feldern derselbe Satz «immer / manchmal
  // / nie», und man sah nicht, welches welches ist.
  // Eine Zeichenkette gilt weiter fuer alle Felder gleich.
  const beschriftung = i => Array.isArray(RASTER.beschriftung)
    ? (RASTER.beschriftung[i] !== undefined
         ? RASTER.beschriftung[i] : RASTER.beschriftung[RASTER.beschriftung.length - 1])
    : RASTER.beschriftung;
  for (n = 0; n < feldAnzahl; n++){
    r = Math.floor(n / spalten);
    feld(zx0 + (n % spalten) * (fw + 10), 26 + r * (fh + 10), fw, fh,
         beschriftung(n), false, n);
  }
  /* Zwischen zwei Feldern ein neues einschieben.

     Rikes Frage (2026-09-13): «Wie gehen wir damit um, wenn man
     zwischen zwei was setzt?» Von Hand aufruecken waere die Antwort -
     bei acht belegten Feldern sind das acht Zuege, und die Gruppe
     verliert dabei leicht den Ueberblick.

     Stattdessen: Der Zwischenraum zwischen zwei Feldern ist anklickbar.
     Ein Klick schiebt dort ein Feld ein und rueckt alles rechts davon
     um eins weiter - die Karten wandern mit, weil sie ihre Feldnummer
     tragen und nicht ihren Ort.

     Das Bedienelement sitzt am Ort seiner Wirkung (agent/06) und
     braucht kein Wort Erklaerung: Man faehrt in die Luecke, dort
     erscheint ein Plus. */
  if (FLAECHE === 'reihe' && feldAnzahl > 1){
    for (let i = 1; i < feldAnzahl; i++){
      const d = document.createElement('div');
      d.className = 'einfuegen';
      const x = zx0 + i * (fw + 10) - 11;
      Object.assign(d.style, {left: x + 'px', top: 26 + 'px',
                              width: '12px', height: fh + 'px'});
      const t = document.createElement('span'); t.textContent = '+';
      d.appendChild(t);
      d.onclick = () => feldEinschieben(i);
      tisch.insertBefore(d, tisch.firstChild);
    }
  }
  if (RASTER.erweiterbar){
    // Steht dort, wo das nächste Feld entsteht - so ist ohne Erklärung
    // sichtbar, was der Klick bewirkt.
    r = Math.floor(n / spalten);
    const d = document.createElement('div');
    d.className = 'rasterfeld neu';
    Object.assign(d.style, {left:(zx0 + (n % spalten) * (fw + 10)) + 'px',
      top:(26 + r * (fh + 10)) + 'px', width:fw + 'px', height:fh + 'px'});
    const t = document.createElement('span');
    t.textContent = '+  ' + (RASTER.neu_text || 'noch eine Gruppe');
    d.appendChild(t);
    d.onclick = () => {
      feldAnzahl++;
      // FEHLERBEHOBEN (2026-09-13, Rike beim Ausprobieren): Hier wurde
      // nur das Raster neu gezeichnet. Bei der Reihe haengt die
      // FELDBREITE aber an der Zahl der Felder - die Felder wurden also
      // schmaler, und die Karten blieben liegen, wo sie waren. Sie
      // rutschten damit aus ihren Feldern heraus.
      //
      // Also: erst die Groessen neu rechnen, dann zeichnen, dann die
      // Karten in ihre Felder zuruecksetzen. Sie tragen ihre Feldnummer,
      // deshalb landet jede wieder dort, wo sie hingehoert.
      if (FLAECHE === 'reihe'){
        einpassenWennAutomatisch(); rasterZeichnen(true); reiheAllesSetzen();
      } else {
        rasterZeichnen(true);
      }
    };
    tisch.insertBefore(d, tisch.firstChild);
  }
  // NEU (2026-08-31, Rikes Auftrag): `extra` darf jetzt eine LISTE sein.
  // «Und bei den Gruppen, die man oben legen kann, vielleicht auch
  // einfach ein Platz fuer welche, wo man nicht weiss, was man mit
  // denen anfangen will.»
  //
  // Zwei Zusatzfelder sind nicht dasselbe zweimal: «passt zu keiner
  // Figur» ist ein ERGEBNIS - man hat geprueft und entschieden. «weiss
  // ich noch nicht» ist ein ZWISCHENSTAND. Beide in ein Feld zu werfen
  // hiesse, die Unentschiedenen als entschieden zu zaehlen; genau das
  // wuerde die Pruefung dann auch melden.
  //
  // Sie teilen sich eine Zeile, wenn beide da sind - sonst frisst das
  // Restfeld allein die ganze Breite und der zweite Platz rutscht aus
  // dem Bild.
  // Zusatzfelder als ZEILE unterhalb der Gruppenfelder.
  if (zeilenfelder.length){
    const y = 26 + (r + 1) * (fh + 10);
    const ganz = zx1 - zx0 - 8;
    const bw = zeilenfelder.length > 1
      ? (ganz - 10 * (zeilenfelder.length - 1)) / zeilenfelder.length : ganz;
    zeilenfelder.forEach((ex, i) => {
      // Die Zusatzfelder halten ihr VERHAELTNIS zum Gruppenfeld. Wird
      // das gestaucht, weil das Brett quer nur begrenzt hoch ist,
      // schrumpfen sie mit - sonst waeren die kleinen Ablagen ploetzlich
      // groesser als die Felder, zu denen sie gehoeren. Genau so sah es
      // beim ersten Ausprobieren aus.
      const hh = fh * ((ex.hoehe || RASTER.hoehe) / RASTER.hoehe);
      feld(zx0 + i * (bw + 10), y, bw, hh, ex.beschriftung, true, -1 - i);
    });
  }

  // Zusatzfelder als SPALTE am rechten Rand. Sie reichen von der
  // Oberkante bis zum Boden des Tisches - was hier liegt, gehoert zu
  // keiner einzelnen Zeile, sondern zum ganzen Sortieren. Und ihre Lage
  // haengt an nichts, was mit den Figuren waechst.
  let sx = zx1 + 10;
  spaltenfelder.forEach((ex, i) => {
    const sw = breite * (ex.breite || 1.2);
    const sh = Math.max(fh, tisch.clientHeight - 26 - 14);
    feld(sx, 26, sw, sh, ex.beschriftung, true, -1 - zeilenfelder.length - i);
    sx += sw + 12;
  });
}

const rasterKnopf = document.getElementById('raster');

// «zwingend» heisst: Die Felder gehoeren zur Aufgabe und sind nicht

}

const pk = document.getElementById('pruefen');
if (pk) pk.onclick = () => {
  /* FEHLERBEHOBEN (2026-09-17, Maurus zu Potenzen V5: «Pruefbutton
     spint»).

     URSACHE: fundPruefen() traegt seine Stufen SELBST - erst die
     Meldung, beim naechsten Druck die gruenen und roten Marken. Dieser
     Verteiler hier fing Stufe 1 aber ab und rief das ALLGEMEINE
     markieren(). Das liest `_brett` bzw. `_merk`; beides legt nur die
     Gruppenpruefung an, die Fund-Flaeche nie. markieren() kehrte also
     wortlos zurueck, und fundPruefens eigener Marken-Zweig wurde nie
     erreicht.

     GEMESSEN an variante_5 mit einem gueltigen Fund (4 · 8 = 32):
     Druck 1 meldete «1 von 1 Feld stimmt · 8 Karten sind uebrig.
     Nochmals druecken zeigt, welche Felder nicht stimmen.» - Druck 2
     hatte KEINE Wirkung, keine einzige Karte bekam eine Marke - Druck 3

     pruefen() es oben schon tut. */
  if (PRUEFART === 'fund'){ fundPruefen(); return; }

  else if (pruefstufe === 1){ markieren(); pruefstufe = 2; }
  else { loeschenMarken(); meldung.textContent = ''; }
};

/* ---------- Variante mit Runden: Steuerung, Zufall, neue Runde ---------- */
// Wie viele Felder beim Oeffnen aktiv sind. Bei einem Venn-Diagramm sind
// drei der Gegenstand der Aufgabe; wo weniger sinnvoll ist, sagt es das Thema.
let aktiveFelder = (RTEXT && RTEXT.standard) || 1;

/* Die Kreise des Venn - so viele, wie gewaehlt sind.

   NEU (2026-08-21, Rikes Entscheidung): «Die Wahl der Kreiszahl bleibt,
   und das Hintergrundbild zieht mit.» Bisher zog es nicht mit: Die
   Kreise steckten in einem fest eingebetteten SVG, das immer DREI
   zeigte. Wer «1» waehlte, sah ein aktives Feld und drei Kreise - die
   Hinweise der Variante nennen zwei Kreise «einen guten Einstieg» und
   drei «die eigentliche Aufgabe», und genau diese Abstufung war nicht
   zu sehen.

   Gezeichnet wird jetzt aus BRETT.kreise. Die Geometrie lag dort
   ohnehin - inKreis() prueft damit, ob eine Karte in einem Kreis
   liegt. Sie war nur nie gezeichnet worden.

   Nebengewinn: Zeichnung und Pruefung benutzen dieselben Zahlen. Vorher
   konnten Bild und Pruefung auseinanderlaufen, ohne dass es auffiel. */
const KREISFARBE = ['#E66C26', '#3C7DC7', '#1D7A45'];
const KREISSTRICH = ['none', '9 4', '3 3'];

function kreiseZeichnen(){
  document.querySelectorAll('.venkreis').forEach(e => e.remove());
  if (!BRETT || !BRETT.kreise) return;
  const bw = brett.offsetWidth, bh = brett.offsetHeight;
  const bx = parseFloat(brett.style.left) || 0, by = parseFloat(brett.style.top) || 0;
  const wieviele = (FLAECHE === 'runden') ? aktiveFelder : BRETT.kreise.length;
  for (let i = 0; i < Math.min(wieviele, BRETT.kreise.length); i++){
    const [cx, cy, r] = BRETT.kreise[i];
    const d = document.createElement('div');
    d.className = 'venkreis';
    const dm = 2 * r * bw;
    Object.assign(d.style, {position:'absolute', pointerEvents:'none',
      left:(bx + cx * bw - r * bw) + 'px',
